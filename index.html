 as growth, margins, cash conversion and leverage, then qualitative ones such as market position, management quality and any exclusions in the fund's policy. Finally check whether each company is actionable, for example a founder thinking about succession or a PE owner near the end of its hold, and rank the shortlist."}],"why":[{"type":"p","html":"A good screen narrows thousands of companies to a few dozen that fit the fund and might sell, which is what the client needs to act on."}],"push":[{"q":"“Which filter matters most for a buyout fund?”","a":[{"type":"p","html":"Cash generation, because the company has to support debt. Stable margins and low capex needs make a candidate far more attractive."}]},{"q":"“How do you avoid missing good targets?”","a":[{"type":"p","html":"Keep the first screen broad and use several data sources, then cut using judgment, since databases miss private companies and misclassify sectors."}]}],"q_text":"How would you screen for companies that a fund could invest in?","n":136},{"section":"08","group":null,"reported":"Rothschild & Co London Debt Advisory & Restructuring internship interview, October 2025.","answer":[{"type":"p","html":"I would cover four themes and update the numbers the week of the interview. First, the interest rate path, meaning where the Bank of England and ECB rates are and what markets expect next. Second, private credit, which has taken a large share of European buyout financing from banks, often through unitranche loans. Third, the maturity wall, as loans raised in the low-rate years come due and some highly levered borrowers struggle to refinance. Fourth, liability management exercises, which advisers including Moelis say have become a large part of restructuring activity."}],"why":[{"type":"p","html":"A structured answer with one current fact per theme shows commercial awareness without needing every number. Interviewers in debt teams want to see you read the FT and understand how rates feed into refinancing risk."}],"push":[{"q":"“Why has private credit grown so fast?”","a":[{"type":"p","html":"Banks pulled back after regulation tightened capital rules, and private credit funds offer speed, certainty and flexible terms, which sponsors value even at a higher price."}]},{"q":"“What does a higher-for-longer rate environment mean for leveraged companies?”","a":[{"type":"p","html":"Higher interest costs on floating-rate debt, less cash for repayment and harder refinancing, which increases demand for amend-and-extend deals and restructurings."}]}],"q_text":"What are the recent developments in the debt markets?","n":137},{"section":"08","group":null,"reported":"Rothschild & Co London summer analyst interview (October 2025). PJT and Rothschild candidates report the same question.","answer":[{"type":"p","html":"Use a fixed structure. Name the parties, the price and the structure, such as cash or shares and the premium. Explain the strategic rationale for the buyer and why the seller agreed. Mention the advisers, especially if the firm you are interviewing with is one of them. Give one risk, such as regulatory approval or integration, and finish with your view on whether it is a good deal. Q126 in section 07 gives a worked example using Qiagen and EQT."}],"why":[{"type":"p","html":"The structure lets you handle follow-ups on valuation, financing or risks, which are where interviewers go next."}],"push":[{"q":"“Was the price fair?”","a":[{"type":"p","html":"Compare the multiple paid with peers and precedent deals, and judge whether synergies or growth justify any premium."}]},{"q":"“What would you have done differently as the seller's adviser?”","a":[{"type":"p","html":"Pick one lever, such as running a wider auction or pushing for a higher share of cash, and explain why it would have helped."}]}],"q_text":"Tell me about a deal you have been following recently.","n":138},{"section":"09","group":null,"reported":null,"answer":[{"type":"p","html":"The discount rate is the annual return an investor could expect from other investments with similar risk. It is the opportunity cost of putting money into this company, and we use it to convert future cash flows into a value today."}],"why":[{"type":"p","html":"Money in the future is worth less than money now, because today's money could be invested elsewhere and earn a return. If a similar-risk investment earns 10% a year, £110 arriving next year is worth £100 to you today. The discount rate captures what you give up by choosing this investment over the alternatives."}],"push":[{"q":"“Shouldn't a company with higher potential returns have a lower discount rate, since it's more attractive?”","a":[{"type":"p","html":"Higher potential returns come with higher risk, and investors demand more compensation for risk. Expected upside belongs in the cash flow forecast. Uncertainty about those cash flows belongs in the discount rate, which is why riskier businesses are discounted more heavily."}]}],"q_text":"What does the discount rate mean?","n":139},{"section":"09","group":null,"reported":null,"answer":[{"type":"p","html":"Present value is what a stream of future cash flows is worth today once you discount them at the discount rate. It rises if the cash flows are bigger, grow faster or arrive sooner, and it falls if the discount rate rises or the cash flows arrive later. Net present value subtracts the upfront cost of the investment from the present value."}],"why":[{"type":"p","html":"Each cash flow is divided by (1 + r)<sup>n<\/sup>. A higher r or a larger n makes the denominator bigger and shrinks the value. An NPV above zero means the investment beats the alternatives at that discount rate."}],"push":[{"q":"“A company's PV on your numbers is £100 and it trades at £80. What does that tell you?”","a":[{"type":"p","html":"On your assumptions it looks undervalued. The market may be using a higher discount rate or expecting lower cash flows, so the next step is to work out which assumption explains the gap."}]}],"q_text":"What does present value mean, and what makes it change?","n":140},{"section":"09","group":null,"reported":null,"answer":[{"type":"p","html":"IRR is the discount rate at which an investment's NPV equals zero. In plain terms it is the compound annual return you earn on the money you put in. You go ahead when the IRR is above your discount rate, which is often called the hurdle rate."}],"why":[{"type":"p","html":"Discount the cash flows at the IRR and their present value exactly equals what you paid. Any discount rate below the IRR produces a positive NPV, so an IRR above your required return means the investment clears the bar."}],"push":[{"q":"“What drives IRR, compared with present value?”","a":[{"type":"p","html":"IRR depends on the price you pay plus the size and timing of the cash you get back. The discount rate plays no part in calculating it. PV works the other way round, since it depends on the discount rate and the cash flows, and the price paid only enters once you move to NPV."}]}],"q_text":"What is IRR, and how do you use it?","n":141},{"section":"10","group":null,"reported":null,"answer":[{"type":"p","html":"A deferred tax liability arises when a company pays less tax now than its accounting profit implies and will pay more later. The classic cause is faster depreciation for tax purposes than in the accounts, which lowers taxable profit in the early years."}],"why":[{"type":"p","html":"The tax still has to be paid eventually, so the company records the obligation as a liability. As the timing difference reverses, the liability unwinds and cash taxes rise."}],"push":[{"q":"“What creates a deferred tax asset?”","a":[{"type":"p","html":"The opposite timing. The most common source is tax losses carried forward, which will reduce future tax bills."}]}],"q_text":"What is a deferred tax liability?","n":142},{"section":"10","group":null,"reported":null,"answer":[{"type":"p","html":"IFRS 16 puts almost all leases on the balance sheet as a right-of-use asset and a lease liability, so rent expense is replaced by depreciation and interest. EBITDA is therefore higher under IFRS than under US GAAP for companies with large leases. IFRS also bans LIFO inventory accounting, and companies can show interest paid in either operating or financing cash flow."}],"why":[{"type":"p","html":"Most companies covered from London report under IFRS, so you need to know whether a given EBITDA figure includes or excludes lease costs before you compare it with peers."}],"push":[{"q":"“So do lease liabilities go into enterprise value?”","a":[{"type":"p","html":"If you are using IFRS 16 EBITDA, which excludes lease costs, yes, because the numerator and denominator must match. If you use pre-IFRS 16 EBITDA that deducts rent, leave leases out of EV."}]}],"q_text":"What accounting differences matter for a London banker valuing European companies?","n":143},{"section":"10","group":null,"reported":null,"answer":[{"type":"p","html":"<b>Income statement.<\/b> A £20 gain, so pre-tax income rises £20 and net income rises £15."},{"type":"p","html":"<b>Cash flow statement.<\/b> Net income +£15, then subtract the £20 gain in operating cash flow, then add £110 of sale proceeds in investing. Net change in cash is +£105."},{"type":"p","html":"<b>Balance sheet.<\/b> Cash +£105 and PP&amp;E −£90, so assets rise £15. Retained earnings rise £15."}],"why":[{"type":"p","html":"You subtract the gain in operating cash flow because the full £110 already appears in investing, and leaving the gain in would count £20 twice. Cash rises by £105 because £5 of tax is paid on the gain."}],"push":[{"q":"“What if it sold for £70?”","a":[{"type":"p","html":"A £20 loss cuts net income by £15. You add the £20 loss back in operating cash flow and record £70 in investing, so cash rises £75. PP&amp;E falls £90, assets fall £15, retained earnings fall £15."}]}],"q_text":"A factory with a book value of £90 is sold for £110. Walk me through it.","n":144},{"section":"10","group":null,"reported":null,"answer":[{"type":"p","html":"<b>Income statement.<\/b> Operating expense rises £10, net income falls £7.50."},{"type":"p","html":"<b>Cash flow statement.<\/b> Add back £10 as a non-cash charge, so cash rises £2.50."},{"type":"p","html":"<b>Balance sheet.<\/b> Cash +£2.50. Retained earnings fall £7.50 and share capital rises £10 for the shares granted, so equity rises £2.50."}],"why":[{"type":"p","html":"Employees are paid in shares, so no cash leaves, and the expense saves tax on the simplified assumption that it is deductible."}],"push":[{"q":"“So is stock-based compensation free?”","a":[{"type":"p","html":"No. Existing shareholders are diluted, which costs them value. Many bankers refuse to add it back in a DCF for that reason, or they count the extra shares."}]}],"q_text":"A company records £10 of stock-based compensation. What happens?","n":145},{"section":"10","group":null,"reported":null,"answer":[{"type":"p","html":"Raising the debt changes neither. Cash and debt both rise £100, so EV is unchanged, and shareholders' claim has not changed."},{"type":"p","html":"If it then pays a £100 dividend, equity value falls £100 because cash has gone to shareholders, and EV is unchanged because lower equity value is offset by higher debt. If it buys £100 of operating assets, EV rises £100 and equity value is unchanged."}],"why":[{"type":"p","html":"EV only moves when the core operations change. Financing decisions move value between investor groups without changing the size of the business."}],"push":[{"q":"“Wouldn't the share price move in practice?”","a":[{"type":"p","html":"It might, because markets react to signals like higher leverage. The textbook answer assumes every transaction happens at fair value."}]}],"q_text":"A company raises £100 of debt and holds it as cash. What happens to equity value and enterprise value? What if it then spends the cash?","n":146},{"section":"10","group":null,"reported":null,"answer":[{"type":"p","html":"In theory, yes, because EV values the same operations. In practice they will differ, because the levered company benefits from the interest tax shield, carries more bankruptcy risk and so has a different cost of capital."}],"why":[{"type":"p","html":"The theoretical answer comes from Modigliani and Miller, who assume no taxes and no distress costs. Relax those assumptions and capital structure starts to matter."}],"push":[{"q":"“Which has the higher equity value?”","a":[{"type":"p","html":"The one with less debt, because equity value is EV minus net debt."}]}],"q_text":"Two companies are identical except one has a lot of debt. Do they have the same enterprise value?","n":147},{"section":"10","group":null,"reported":null,"answer":[{"type":"p","html":"Equity value is £1,000m. Add £300m of debt and £50m of NCI, subtract £100m of cash. EV is £1,250m."}],"why":[{"type":"p","html":"Same bridge as before, applied to numbers."}],"push":[{"q":"“EBITDA is £125m. What's the EV/EBITDA multiple?”","a":[{"type":"p","html":"10x."}]}],"q_text":"Share price £20, 50m shares, £300m of debt, £100m of cash and £50m of non-controlling interest. What is enterprise value?","n":148},{"section":"10","group":null,"reported":null,"answer":[{"type":"p","html":"Shorthand for how much investors pay for each unit of a metric such as EBITDA or earnings. A 10x EV/EBITDA multiple means the business is valued at ten times its annual EBITDA. Built into it are expectations about growth, risk and the discount rate."}],"why":[{"type":"p","html":"From the Gordon growth formula, value = cash flow ÷ (r − g), so a multiple is roughly 1 ÷ (r − g). Higher growth or lower risk produces a higher multiple."}],"push":[{"q":"“Why does a faster-growing company trade on a higher multiple?”","a":[{"type":"p","html":"A higher g makes r − g smaller, so each pound of current earnings is worth more."}]}],"q_text":"What is a valuation multiple?","n":149},{"section":"10","group":null,"reported":null,"answer":[{"type":"p","html":"EV/EBITDA does not change, because EV and EBITDA are unaffected. After-tax interest is £200m × 6% × 75% = £9m, so net income falls to £41m. Equity value falls to £600m. P/E moves from 16x to about 14.6x."}],"why":[{"type":"p","html":"P/E falls because the after-tax cost of debt, 4.5%, is below the company's earnings yield of 50 ÷ 800 = 6.25%. EPS rises because the share count falls by more than net income does."}],"push":[{"q":"“When would the buyback be dilutive to EPS?”","a":[{"type":"p","html":"When the after-tax cost of debt exceeds the earnings yield, so here a pre-tax rate above 6.25% ÷ 0.75 ≈ 8.3%."}]}],"q_text":"A company has equity value of £800m and net income of £50m. It borrows £200m at 6% and uses it to buy back shares. What happens to P/E and EV/EBITDA?","n":150},{"section":"11","group":null,"reported":null,"answer":[{"type":"p","html":"The valuation falls, because future cash flows are discounted more heavily. The terminal value is hit hardest, since it is furthest out and, under perpetuity growth, the larger WACC − g denominator shrinks it further."}],"why":[{"type":"p","html":"Value is cash flow divided by a discount factor, so a higher discount rate means a lower value."}],"push":[{"q":"“The Bank of England raises rates. What happens to a DCF valuation?”","a":[{"type":"p","html":"The risk-free rate rises, which raises both the cost of equity and the cost of debt, so WACC rises and the valuation falls. Growth expectations may also weaken, which lowers value further."}]}],"q_text":"WACC rises by 1%. What happens to the DCF?","n":151},{"section":"11","group":null,"reported":null,"answer":[{"type":"p","html":"Subtract debt, preferred stock, NCI and other claims, add cash and non-operating assets to get equity value, then divide by diluted shares."}],"why":[{"type":"p","html":"Same bridge as the EV section, run in reverse."}],"push":[{"q":"“Which balance sheet do you use?”","a":[{"type":"p","html":"The most recent one, matching the valuation date."}]}],"q_text":"How do you get from enterprise value to the implied share price at the end of a DCF?","n":152},{"section":"11","group":null,"reported":null,"answer":[{"type":"p","html":"It assumes cash flows arrive halfway through each year, so year one is discounted by 0.5 years, year two by 1.5, and so on. It raises the valuation slightly and is more realistic, since cash comes in through the year."}],"why":[{"type":"p","html":"Discounting a cash flow for less time increases its present value."}],"push":[{"q":"“Do you apply it to the terminal value?”","a":[{"type":"p","html":"With perpetuity growth, discount the terminal value using the same mid-year period as the final year's cash flow. With an exit multiple, discount from the end of the final year, since the method assumes a sale at that point."}]}],"q_text":"What is the mid-year convention?","n":153},{"section":"11","group":null,"reported":null,"answer":[{"type":"p","html":"Preferably not. SBC costs shareholders through dilution even though no cash leaves the company, so treating it as free overstates value. If you do add it back, you should increase the share count to reflect future dilution."}],"why":[{"type":"p","html":"Someone pays for SBC. The company avoids a cash outflow by transferring value from existing shareholders to employees."}],"q_text":"Should you add back stock-based compensation in a DCF?","push":[],"n":154},{"section":"11","group":null,"reported":null,"answer":[{"type":"p","html":"A sale to a strategic buyer, a sale to another PE firm, an IPO, or a partial exit through a dividend recap. A strategic sale is often preferred, because it gives a full cash exit and strategic buyers can pay more thanks to synergies."}],"why":[{"type":"p","html":"The sponsor wants the highest price with the most certainty."}],"push":[{"q":"“Why is an IPO less attractive?”","a":[{"type":"p","html":"The sponsor can only sell part of its stake at the IPO and must sell the rest over time, subject to lock-ups and market prices."}]}],"q_text":"What exit routes does a PE firm have, and which does it prefer?","n":155},{"section":"12","group":null,"reported":null,"answer":[{"type":"p","html":"A stressed company still meets its obligations, but performance is weakening and its debt is becoming expensive. A distressed company faces a serious risk of default, its bonds trade well below par, and it struggles to refinance. An insolvent company cannot pay its debts and is in, or close to, a formal process."}],"why":[{"type":"p","html":"The categories describe how close the company is to failing to pay its lenders."}],"push":[{"q":"“How would you spot distress from market data?”","a":[{"type":"p","html":"Bonds trading at large discounts to par, credit spreads of roughly 1,000 basis points or more over government bonds, and leverage far above sector norms."}]}],"q_text":"How are stressed, distressed and insolvent companies different?","n":156},{"section":"12","group":null,"reported":null,"answer":[{"type":"p","html":"Too much debt relative to cash flow, falling demand, rising costs, higher rates on floating-rate debt, a large maturity it cannot refinance, the loss of a major customer, or fraud."}],"why":[{"type":"p","html":"Distress happens when cash coming in can no longer cover what the company owes."}],"push":[{"q":"“Why are higher interest rates a particular trigger now?”","a":[{"type":"p","html":"Many buyouts from the low-rate years used floating-rate loans, so interest costs rose sharply just as those loans approach maturity."}]}],"q_text":"What causes a company to become distressed?","n":157},{"section":"12","group":null,"reported":null,"answer":[{"type":"p","html":"Out of court, it can refinance, amend and extend its maturities, sell assets, raise new equity or rescue financing, agree a debt-for-equity swap, or run a liability management exercise. In court, it can use a UK scheme of arrangement or Part 26A restructuring plan, enter administration, which often leads to a pre-pack sale, or file for US Chapter 11. Liquidation is the last resort."}],"why":[{"type":"p","html":"The aim is to reduce debt to a level the business can support while keeping it operating."}],"push":[{"q":"“Why try out of court first?”","a":[{"type":"p","html":"It is cheaper, faster, less damaging to customers and suppliers, and keeps management in control."}]}],"q_text":"What options does a distressed company have?","n":158},{"section":"12","group":null,"reported":null,"answer":[{"type":"p","html":"A transaction in which a company reworks its debt outside court to buy time or reduce debt, using the flexibility in its existing debt documents. Examples include exchanging bonds for new debt at a discount, extending maturities, uptiering, where some lenders are moved ahead of others, and drop-downs, where valuable assets are moved into a subsidiary outside the existing lenders' security."}],"why":[{"type":"p","html":"Companies use them to avoid a formal process, and they have become very common as highly levered companies face harder refinancing conditions."}],"push":[{"q":"“Why do creditors dislike them?”","a":[{"type":"p","html":"Some are non-pro rata, favouring a majority group of lenders and leaving the minority worse off. Lenders now often sign cooperation agreements to protect themselves."}]}],"q_text":"What is a liability management exercise?","n":159},{"section":"12","group":null,"reported":null,"answer":[{"type":"p","html":"Under absolute priority, value goes first to super-senior and secured creditors up to the value of their security, then to unsecured creditors, then to subordinated debt, with shareholders last. In theory each class is paid in full before the next receives anything."}],"why":[{"type":"p","html":"Lenders accept lower returns for higher priority, so the order of repayment reflects the risk each group signed up for."}],"push":[{"q":"“Does absolute priority always hold?”","a":[{"type":"p","html":"No. Junior classes are often given something to win their support, and a UK restructuring plan lets the court impose a plan on a dissenting class through cross-class cram down if that class is no worse off than in the most likely alternative."}]}],"q_text":"What is the priority of claims in a restructuring?","n":160},{"section":"12","group":null,"reported":null,"answer":[{"type":"p","html":"In a debt-for-equity swap, creditors exchange some or all of their debt for equity, cutting the company's debt and interest. Existing shareholders are heavily diluted or wiped out. The fulcrum security is the most senior class that will not be repaid in full, and it usually receives most of the new equity."}],"why":[{"type":"p","html":"Value runs out at the fulcrum class, so its holders become the new owners."}],"push":[{"q":"“Why would creditors accept shares?”","a":[{"type":"p","html":"If the company cannot repay them, equity in a deleveraged business can be worth more than a claim on an overleveraged one."}]}],"q_text":"What is a debt-for-equity swap, and what is the fulcrum security?","n":161},{"section":"12","group":null,"reported":null,"answer":[{"type":"p","html":"EV is £400m. Secured lenders recover 100%, or £250m. The remaining £150m goes to the unsecured notes, a 75% recovery. Shareholders receive nothing, and the unsecured notes are the fulcrum security."}],"why":[{"type":"p","html":"Run the waterfall from the top, paying each class in full until the value runs out."}],"push":[{"q":"“What if the company is valued at 3x?”","a":[{"type":"p","html":"EV is £300m. Secured lenders still recover 100%, and the unsecured notes recover £50m ÷ £200m = 25%."}]}],"q_text":"A distressed company has £100m of EBITDA and is valued at 4x. It has £250m of senior secured debt and £200m of senior unsecured notes, and no cash. What do creditors recover?","n":162},{"section":"12","group":null,"reported":null,"answer":[{"type":"p","html":"US Chapter 11 is a court process in which management usually stays in control, an automatic stay stops creditor action, and a plan can be imposed on dissenting classes. Chapter 7 is liquidation. In the UK, a scheme of arrangement binds a class if a majority in number holding 75% by value vote in favour. A Part 26A restructuring plan needs 75% by value in each voting class and allows cross-class cram down. In administration, an insolvency practitioner takes control, often leading to a pre-pack sale."}],"why":[{"type":"p","html":"London restructuring work often uses UK tools even for international groups, so knowing the basics is useful at a London office."}],"push":[{"q":"“What is DIP financing?”","a":[{"type":"p","html":"New money lent to a company in Chapter 11, given priority over existing debt so lenders are willing to provide it. The UK has no exact equivalent."}]}],"q_text":"How do UK and US restructuring processes differ?","n":163},{"section":"12","group":null,"reported":null,"answer":[{"type":"p","html":"The focus shifts to liquidity and recoveries. You build a 13-week cash flow forecast to see how long the cash lasts, run a liquidation analysis as a floor, use lower multiples and higher discount rates, and use the valuation to identify which creditor classes are in the money."}],"why":[{"type":"p","html":"Once a company is distressed, shareholders are often out of the money, so the valuation's job is to show how value splits between creditor classes."}],"push":[{"q":"“What is a 13-week cash flow forecast?”","a":[{"type":"p","html":"A weekly forecast of receipts and payments over a quarter, used to manage liquidity week by week."}]},{"q":"“A company's bonds trade at 50% of par. What does that tell you?”","a":[{"type":"p","html":"The market expects heavy losses. A buyer at 50p who expects to recover 75p earns a 50% return, and funds that buy at deep discounts aiming to convert their debt into control are known as loan-to-own investors."}]}],"q_text":"How does valuation change for a distressed company?","n":164}]};</script>

  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  var QS = D.questions, BY = {}, SEC = {};
  QS.forEach(function (q) { BY[q.n] = q; });
  D.sections.forEach(function (s) { SEC[s.id] = s; });

  var SETS = [
    { id: 'bible',  name: 'The 400 Bible', eyebrow: 'Part 1 · ' + D.parts.part1.title, blurb: 'Accounting through to leveraged buyouts', intro: D.parts.part1.intro, secs: ['01', '02', '03', '04', '05', '06'] },
    { id: 'extras', name: 'Extras',        eyebrow: 'Part 2 · ' + D.parts.part2.title, blurb: 'Reported Moelis and boutique questions, extras, restructuring', intro: D.parts.part2.intro, secs: ['07', '08', '09', '10', '11', '12'] },
    { id: 'merger', name: 'Merger Models', eyebrow: 'Section 05 · also in the Bible', blurb: 'Merger model concepts and drills', intro: SEC['05'].intro, secs: ['05'] }
  ];
  SETS.forEach(function (s) {
    s.qs = QS.filter(function (q) { return s.secs.indexOf(q.section) >= 0; });
    var rows = [];
    s.qs.forEach(function (q) {
      var last = rows[rows.length - 1];
      if (!last || last.sec !== q.section || last.group !== q.group) rows.push({ key: rows.length, sec: q.section, group: q.group, qs: [], first: !last || last.sec !== q.section });
      rows[rows.length - 1].qs.push(q);
    });
    s.rows = rows;
  });

  var K_P = 'moelis_progress_v1', K_S = 'moelis_seen_v1';
  function load(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var PROG = load(K_P), SEEN = load(K_S);       // PROG: n -> 'g' (got it) | 'm' (missed it)

  function show(id) {
    ['home', 'setup', 'drill', 'done'].forEach(function (n) { $('s-' + n).hidden = n !== id; });
    window.scrollTo(0, 0);
  }
  function range(qs) { return 'Q' + qs[0].n + '–Q' + qs[qs.length - 1].n; }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  function gotCount(qs) { return qs.filter(function (q) { return PROG[q.n] === 'g'; }).length; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ---------- home ---------- */
  function renderHome() {
    $('homeLede').textContent = QS.length + ' questions with interview-ready answers, the reasoning behind each one, and the follow-ups an interviewer is likely to push with.';
    $('homeNote').textContent = 'All calculations assume a 25% tax rate unless stated otherwise.';
    var box = $('sets'); box.innerHTML = '';
    SETS.forEach(function (s) {
      var got = gotCount(s.qs), pct = Math.round(got / s.qs.length * 100);
      var b = document.createElement('button');
      b.className = 'set';
      b.innerHTML = '<span class="eyebrow">' + esc(s.eyebrow) + '</span><span class="set-name">' + esc(s.name) + '</span>' +
        '<span class="set-meta"><span>' + esc(range(s.qs)) + ' · ' + plural(s.qs.length, 'question') + '</span><span class="tnum">' + got + ' / ' + s.qs.length + ' got</span></span>' +
        '<span class="meter"><i style="width:' + pct + '%"></i></span>';
      b.addEventListener('click', function () { openSet(s); });
      box.appendChild(b);
    });
  }
  var armed = null;
  $('reset').addEventListener('click', function () {
    var b = $('reset');
    if (!armed) { b.textContent = 'Tap again to confirm'; armed = setTimeout(function () { armed = null; b.textContent = 'Reset progress'; }, 4000); return; }
    clearTimeout(armed); armed = null; PROG = {}; SEEN = {}; save(K_P, PROG); save(K_S, SEEN); b.textContent = 'Reset progress'; renderHome();
  });

  /* ---------- setup ---------- */
  var cur = { set: null, sel: {}, order: 'shuffle', show: 'all' };
  function openSet(s) {
    cur.set = s; cur.sel = {}; s.rows.forEach(function (r) { cur.sel[r.key] = true; });
    renderSetup(); show('setup');
  }
  function pool() {
    var out = [];
    cur.set.rows.forEach(function (r) { if (cur.sel[r.key]) out = out.concat(r.qs); });
    if (cur.show === 'todo') out = out.filter(function (q) { return PROG[q.n] !== 'g'; });
    return out;
  }
  function renderSetup() {
    var s = cur.set;
    $('setupEyebrow').textContent = s.eyebrow; $('setupTitle').textContent = s.name; $('setupIntro').textContent = s.intro;
    var box = $('rows'); box.innerHTML = '';
    s.rows.forEach(function (r) {
      var sec = SEC[r.sec], title = r.group || sec.title, got = gotCount(r.qs);
      var row = document.createElement('div'); row.className = 'row';
      var m = document.createElement('button'); m.className = 'row-main'; m.setAttribute('role', 'checkbox'); m.setAttribute('aria-checked', cur.sel[r.key] ? 'true' : 'false');
      m.innerHTML = '<span class="check"></span><span class="row-num">' + esc(r.sec) + '</span><span><span class="row-title">' + esc(title) + '</span><span class="row-sub tnum">' + esc(range(r.qs)) + ' · ' + plural(r.qs.length, 'question') + ' · ' + got + ' got</span></span>';
      m.addEventListener('click', function () { cur.sel[r.key] = !cur.sel[r.key]; renderSetup(); });
      row.appendChild(m);
      if (r.first && sec.intro) {
        var ab = document.createElement('button'); ab.className = 'about'; ab.textContent = 'About this section'; ab.setAttribute('aria-expanded', 'false');
        var tx = document.createElement('p'); tx.className = 'about-text'; tx.textContent = sec.intro; tx.hidden = true;
        ab.addEventListener('click', function () { tx.hidden = !tx.hidden; ab.setAttribute('aria-expanded', String(!tx.hidden)); ab.textContent = tx.hidden ? 'About this section' : 'Hide'; });
        row.appendChild(ab); row.appendChild(tx);
      }
      box.appendChild(row);
    });
    ['segOrder', 'segShow'].forEach(function (id) {
      var key = id === 'segOrder' ? 'order' : 'show';
      Array.prototype.forEach.call($(id).children, function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === cur[key])); });
    });
    var n = pool().length;
    $('start').disabled = n === 0;
    $('start').textContent = n ? 'Start · ' + plural(n, 'question') : 'Nothing to drill';
    $('startHint').textContent = n ? '' : (cur.show === 'todo' ? 'You have got everything selected. Switch to All to go again.' : 'Select at least one section.');
  }
  ['segOrder', 'segShow'].forEach(function (id) {
    Array.prototype.forEach.call($(id).children, function (b) {
      b.addEventListener('click', function () { cur[id === 'segOrder' ? 'order' : 'show'] = b.getAttribute('data-v'); renderSetup(); });
    });
  });
  $('setupBack').addEventListener('click', function () { renderHome(); show('home'); });
  $('start').addEventListener('click', function () {
    var qs = pool(); if (!qs.length) return;
    var ids;
    if (cur.order === 'shuffle') {         // a fresh shuffle each time, with anything you have never seen come first
      var fresh = shuffle(qs.filter(function (q) { return !SEEN[q.n]; })), seen = shuffle(qs.filter(function (q) { return SEEN[q.n]; }));
      ids = fresh.concat(seen).map(function (q) { return q.n; });
    } else ids = qs.map(function (q) { return q.n; });
    startRun(ids);
  });

  /* ---------- drill ---------- */
  var run = null;
  function table(rows) {
    var h = '<div class="tbl"><table><thead><tr>' + rows[0].map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.slice(1).forEach(function (r) { h += '<tr><th scope="row">' + esc(r[0]) + '</th>' + r.slice(1).map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; });
    return h + '</tbody></table></div>';
  }
  function blocks(bs) { return bs.map(function (b) { return b.type === 'p' ? '<p>' + nb(b.html) + '</p>' : table(b.rows); }).join(''); }
  function add(html) {
    var d = document.createElement('div'); d.innerHTML = html; var el = d.firstElementChild;
    $('thread').appendChild(el); return el;
  }
  function reveal(el) {
    var t = $('thread'), top = Math.max(0, el.offsetTop - 18);
    if (t.scrollTo) t.scrollTo({ top: top }); else t.scrollTop = top;
  }
  function startRun(ids) {
    run = { ids: ids, i: 0, res: {} };
    show('drill'); showQuestion();
  }
  function showQuestion() {
    var q = BY[run.ids[run.i]], sec = SEC[q.section];
    run.q = q; run.stage = 'q'; run.p = -1;
    SEEN[q.n] = 1; save(K_S, SEEN);
    $('pos').textContent = (run.i + 1) + ' / ' + run.ids.length;
    $('fill').style.width = (run.i / run.ids.length * 100) + '%';
    var t = $('thread'); t.innerHTML = ''; t.scrollTop = 0;
    var where = sec.id + ' · ' + sec.title + (q.group ? ' · ' + q.group : '');
    add('<div class="blk"><div class="eyebrow where">Q' + q.n + ' · ' + esc(where) + '</div><h3 class="q-text" style="margin:0">' + esc(nb(q.q_text)) + '</h3>' +
      (q.reported ? '<p class="reported"><span class="eyebrow">Reported</span>' + esc(q.reported) + '</p>' : '') +
      '<p class="say">Say your answer out loud, then check it.</p></div>');
    setActions();
  }
  function morePush() { return run.p + 1 < run.q.push.length; }
  function setActions() {
    var label = null;
    if (run.stage === 'q' || run.stage === 'pq') label = 'Show answer';
    else if (morePush()) label = 'They push';
    $('primary').hidden = !label; if (label) $('primary').textContent = label;
    $('grades').hidden = !!label;
  }
  $('primary').addEventListener('click', function () {
    var q = run.q, el;
    if (run.stage === 'q') {
      var say = document.querySelector('.say'); if (say) say.remove();
      el = add('<div class="blk"><div class="box"><span class="tag">Answer</span>' + blocks(q.answer) + '</div>' +
        '<div class="why"><span class="eyebrow">Why it’s right</span>' + blocks(q.why) + '</div></div>');
      run.stage = 'a';
    } else if (run.stage === 'a' || run.stage === 'pa') {
      run.p++;
      var pu = q.push[run.p];
      el = add('<div class="push blk"><span class="eyebrow">If they push · ' + (run.p + 1) + ' of ' + q.push.length + '</span><p class="push-q">' + esc(nb(pu.q)) + '</p></div>');
      run.stage = 'pq';
    } else if (run.stage === 'pq') {
      var host = $('thread').lastElementChild;
      var a = document.createElement('div'); a.className = 'push-a'; a.innerHTML = blocks(q.push[run.p].a);
      host.appendChild(a); el = a; run.stage = 'pa';
    }
    setActions(); if (el) reveal(el);
  });
  function next() {
    run.i++;
    if (run.i >= run.ids.length) return finish();
    showQuestion();
  }
  function grade(g) {
    var q = run.q; run.res[q.n] = g; PROG[q.n] = g === 'got' ? 'g' : 'm'; save(K_P, PROG); next();
  }
  $('got').addEventListener('click', function () { grade('got'); });
  $('miss').addEventListener('click', function () { grade('miss'); });
  $('skip').addEventListener('click', function () { run.res[run.q.n] = run.res[run.q.n] || 'skip'; next(); });
  $('quit').addEventListener('click', function () { renderSetup(); show('setup'); });

  /* ---------- done ---------- */
  function finish() {
    var ids = run.ids, got = 0, miss = [], skip = 0;
    ids.forEach(function (n) { var r = run.res[n]; if (r === 'got') got++; else if (r === 'miss') miss.push(n); else skip++; });
    $('doneEyebrow').textContent = cur.set.name + ' · done';
    $('score').innerHTML = got + '<small> / ' + ids.length + '</small>';
    $('tally').innerHTML = '<span>' + got + ' got</span><span>' + miss.length + ' missed</span>' + (skip ? '<span>' + skip + ' skipped</span>' : '');
    $('missList').innerHTML = miss.map(function (n) { return '<li><span>Q' + n + '</span>' + esc(BY[n].q_text) + '</li>'; }).join('');
    $('missList').hidden = !miss.length;
    run.miss = miss; $('again').hidden = !miss.length;
    show('done');
  }
  $('again').addEventListener('click', function () { startRun(shuffle(run.miss.slice())); });
  $('finish').addEventListener('click', function () { renderSetup(); show('setup'); });

  renderHome();
})();
</script>
</body>
</html>
