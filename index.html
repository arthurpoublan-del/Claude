<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tech Drill">
<title>Technical Drill</title>
<style>
  :root {
    --paper: #ffffff;
    --ink: #000000;
    --ink-2: rgba(0, 0, 0, 0.64);
    --ink-3: rgba(0, 0, 0, 0.42);
    --rule: rgba(0, 0, 0, 0.16);
    --fill: #f2f2f2;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Charter, Georgia, "Noto Serif", serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { background: var(--paper); color-scheme: light; -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15.5px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .tnum { font-variant-numeric: tabular-nums; }

  #app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; }
  .screen { padding: max(28px, env(safe-area-inset-top)) 22px max(36px, env(safe-area-inset-bottom)); }

  .eyebrow { font: 600 10.5px/1.3 var(--sans); letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink); }
  .muted { color: var(--ink-2); }
  h1 { margin: 10px 0 14px; font: 600 40px/1.04 var(--serif); letter-spacing: -0.015em; text-wrap: balance; }
  h2 { margin: 8px 0 14px; font: 600 32px/1.08 var(--serif); letter-spacing: -0.01em; text-wrap: balance; }
  .lede { margin: 0; max-width: 46ch; font-size: 14.5px; line-height: 1.55; color: var(--ink-2); }
  .link { font: 500 13px/1.3 var(--sans); text-decoration: underline; text-underline-offset: 3px; }
  .back { display: inline-block; margin: 0 0 26px; font: 500 13px/1 var(--sans); }
  .back::before { content: "\2190\00a0\00a0"; }

  /* home */
  .sets { margin: 34px 0 0; border-top: 2px solid var(--ink); }
  .set { display: block; width: 100%; padding: 22px 0 6px; }
  .set:active .set-name { text-decoration: underline; text-underline-offset: 5px; }
  .set-name { display: block; margin: 7px 0 10px; font: 600 27px/1.1 var(--serif); letter-spacing: -0.01em; }
  .set-meta { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; color: var(--ink-2); }
  .meter { display: block; height: 2px; margin: 16px 0 0; background: var(--rule); }
  .meter i { display: block; height: 100%; background: var(--ink); }
  .note { margin: 22px 0 0; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
  .foot { margin-top: 30px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12.5px; color: var(--ink-3); }

  /* setup */
  .rows { margin: 30px 0 0; border-top: 2px solid var(--ink); }
  .row { border-bottom: 1px solid var(--rule); }
  .row-main { display: grid; grid-template-columns: 22px 28px 1fr; column-gap: 12px; align-items: start; width: 100%; padding: 15px 0 14px; }
  .check { width: 18px; height: 18px; margin-top: 3px; border: 1.5px solid var(--ink); position: relative; }
  .row-main[aria-checked="true"] .check { background: var(--ink); }
  .row-main[aria-checked="true"] .check::after { content: ""; position: absolute; left: 4.5px; top: 1.5px; width: 5px; height: 9px; border: solid var(--paper); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .row-num { padding-top: 1px; font: 600 12px/1.9 var(--sans); letter-spacing: 0.06em; color: var(--ink-3); }
  .row-title { display: block; font: 600 17.5px/1.3 var(--serif); }
  .row-sub { display: block; margin-top: 3px; font-size: 12.5px; line-height: 1.4; color: var(--ink-2); }
  .about { margin: -4px 0 14px 74px; font: 500 12px/1.3 var(--sans); text-decoration: underline; text-underline-offset: 3px; color: var(--ink-2); }
  .about-text { margin: 0 0 16px 74px; font: italic 400 13.5px/1.55 var(--serif); color: var(--ink-2); max-width: 44ch; }
  .opts { margin: 28px 0 0; display: grid; gap: 18px; }
  .opt-label { display: block; margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--ink); }
  .seg button { padding: 12px 10px; text-align: center; font: 600 13.5px/1.2 var(--sans); }
  .seg button + button { border-left: 1.5px solid var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  .btn { display: block; width: 100%; min-height: 52px; padding: 14px 18px; border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink); font: 600 15px/1.2 var(--sans); text-align: center; letter-spacing: 0.01em; }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn:active { background: var(--ink); color: var(--paper); }
  .btn.solid:active { background: var(--paper); color: var(--ink); }
  .btn:disabled { opacity: 0.32; pointer-events: none; }
  .start { margin-top: 30px; }
  .hint { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-2); text-align: center; }

  /* drill */
  #s-drill { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding: 0; }
  .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: max(14px, env(safe-area-inset-top)) 22px 12px; }
  .bar button { font: 500 13px/1 var(--sans); padding: 8px 0; }
  .bar .r { text-align: right; }
  .bar .mid { padding: 8px 0; font: 600 12px/1 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; }
  .progress { height: 2px; background: var(--rule); flex: none; }
  .progress i { display: block; height: 100%; width: 0; background: var(--ink); }
  .thread { position: relative; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 26px 22px 28px; scroll-padding-top: 20px; }
  .where { margin: 0 0 12px; }
  .q-text { margin: 0; font: 600 24px/1.27 var(--serif); letter-spacing: -0.005em; text-wrap: pretty; }
  .reported { margin: 16px 0 0; padding: 10px 0 0; border-top: 1px solid var(--rule); font-size: 13px; line-height: 1.5; color: var(--ink-2); }
  .reported .eyebrow { margin-right: 8px; color: var(--ink); }
  .say { margin: 30px 0 0; font: italic 400 15px/1.5 var(--serif); color: var(--ink-3); }

  .box { position: relative; margin-top: 30px; padding: 20px 16px 16px; border: 1.5px solid var(--ink); }
  .box .tag { position: absolute; top: -10px; left: 14px; padding: 4px 8px 3px; background: var(--ink); color: var(--paper); font: 600 10px/1.2 var(--sans); letter-spacing: 0.15em; text-transform: uppercase; }
  .why { margin-top: 16px; padding: 16px 16px 16px; background: var(--fill); }
  .why .eyebrow { display: block; margin-bottom: 8px; }
  .box p, .why p, .push-a p { margin: 0 0 10px; }
  .box p:last-child, .why p:last-child, .push-a p:last-child { margin-bottom: 0; }
  .box b { font-weight: 650; }
  sup { font-size: 0.72em; line-height: 0; }

  .push { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--ink); }
  .push .eyebrow { display: block; margin-bottom: 10px; }
  .push-q { margin: 0; font: italic 600 19px/1.35 var(--serif); }
  .push-a { margin-top: 14px; padding: 2px 0 2px 14px; border-left: 2px solid var(--ink); }

  .tbl { margin: 12px 0 14px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
  thead th { border-bottom: 1.5px solid var(--ink); font: 600 11px/1.3 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; }
  tbody th { font-weight: 600; }

  .actions { flex: none; padding: 12px 22px max(14px, env(safe-area-inset-bottom)); border-top: 1px solid var(--ink); background: var(--paper); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* done */
  .score { margin: 26px 0 6px; font: 600 88px/0.95 var(--serif); letter-spacing: -0.03em; }
  .score small { font-size: 34px; font-weight: 400; color: var(--ink-3); letter-spacing: 0; }
  .tally { display: flex; gap: 22px; margin: 6px 0 0; font-size: 13.5px; color: var(--ink-2); }
  .list { margin: 30px 0 0; padding: 0; list-style: none; border-top: 2px solid var(--ink); }
  .list li { display: grid; grid-template-columns: 44px 1fr; padding: 13px 0; border-bottom: 1px solid var(--rule); font: 500 15.5px/1.4 var(--serif); }
  .list li span { font: 600 12px/1.9 var(--sans); color: var(--ink-3); letter-spacing: 0.04em; }
  .stack { display: grid; gap: 10px; margin-top: 28px; }

  @media (prefers-reduced-motion: no-preference) { .thread { scroll-behavior: smooth; } }
  @media (min-width: 600px) { h1 { font-size: 46px; } .q-text { font-size: 26px; } }
</style>
</head>
<body>
<div id="app">

  <section class="screen" id="s-home">
    <div class="eyebrow">Moelis London</div>
    <h1>First-Round Technicals</h1>
    <p class="lede" id="homeLede"></p>
    <div class="sets" id="sets"></div>
    <p class="note" id="homeNote"></p>
    <div class="foot"><span>Progress is saved on this device.</span><button class="link" id="reset">Reset progress</button></div>
  </section>

  <section class="screen" id="s-setup" hidden>
    <button class="back" id="setupBack">All sections</button>
    <div class="eyebrow" id="setupEyebrow"></div>
    <h2 id="setupTitle"></h2>
    <p class="lede" id="setupIntro"></p>
    <div class="rows" id="rows"></div>
    <div class="opts">
      <div><span class="eyebrow opt-label">Order</span>
        <div class="seg" id="segOrder"><button data-v="order" aria-pressed="false">In order</button><button data-v="shuffle" aria-pressed="true">Shuffled</button></div></div>
      <div><span class="eyebrow opt-label">Questions</span>
        <div class="seg" id="segShow"><button data-v="all" aria-pressed="true">All</button><button data-v="todo" aria-pressed="false">Not yet got</button></div></div>
    </div>
    <button class="btn solid start" id="start">Start</button>
    <p class="hint" id="startHint"></p>
  </section>

  <section class="screen" id="s-drill" hidden>
    <div class="bar"><button id="quit">Close</button><div class="mid tnum" id="pos"></div><div class="r"><button id="skip">Skip</button></div></div>
    <div class="progress"><i id="fill"></i></div>
    <div class="thread" id="thread"></div>
    <div class="actions">
      <button class="btn solid" id="primary">Show answer</button>
      <div class="two" id="grades" hidden><button class="btn" id="miss">Missed it</button><button class="btn solid" id="got">Got it</button></div>
    </div>
  </section>

  <section class="screen" id="s-done" hidden>
    <div class="eyebrow" id="doneEyebrow"></div>
    <div class="score tnum" id="score"></div>
    <div class="tally tnum" id="tally"></div>
    <ul class="list" id="missList"></ul>
    <div class="stack"><button class="btn solid" id="again" hidden>Drill the ones I missed</button><button class="btn" id="finish">Back to the section</button></div>
  </section>

</div>
<script>window.DRILL_DATA = {"parts":{"part1":{"title":"The Bible Basics","intro":"Every question from the basic sections of the 400-question IB Bible, in the Bible's order. Accounting, equity value and enterprise value, valuation, DCF, merger models and LBOs. Where the Bible asks the same thing twice, or one answer covers several of its questions, the guide gives one answer. The merger model and LBO sections end with worked paper drills."},"part2":{"title":"Moelis and Extras","intro":"Questions outside the Bible's basic sections. Reported questions from Moelis London and other London boutiques come first, then extra technicals, then restructuring, which Moelis asks about more than most banks."}},"sections":[{"id":"01","title":"Accounting","intro":"Top priority. Almost every first round includes at least one accounting question, and the latest Moelis London report said the technical round focused on accounting. For walk-throughs, assume 25% tax, go income statement, then cash flow statement, then balance sheet, and say the balance check out loud at the end."},{"id":"02","title":"Equity Value and Enterprise Value","intro":"The bridge, and why each item is added or subtracted, comes up constantly."},{"id":"03","title":"Valuation","intro":"Expect at least one question on which method gives the highest value and one on matching metrics to EV or equity value."},{"id":"04","title":"DCF and WACC","intro":"Be able to walk through a DCF in under a minute without hesitating and know the WACC formulas cold, then handle the follow-ups."},{"id":"05","title":"Merger Models","intro":"Concepts first, then paper drills from Q92. The September 2025 London first round included a 10-minute accretion/dilution problem on a deal funded with debt and equity, which is Q95. Run the full EPS method, then check with yields."},{"id":"06","title":"Leveraged Buyouts","intro":"The CV lists LBO modelling, and the analyst you spoke to said a paper LBO will come up. Concepts first, then paper LBO drills from Q114. Work each drill with a pen before reading the answer, and say each step out loud."},{"id":"07","title":"Reported in Moelis London Interviews","intro":"Questions candidates say they were asked in Moelis London interviews, from Glassdoor and Wall Street Oasis reports. Reported first rounds are two 30-minute interviews, one behavioural or CV-based and one technical. A London summer analyst report from October 2026 said the technical interview focused on accounting, and another London candidate said interviewers kept asking why after each answer, so the follow-ups here go deep. The reported LBO questions, Q100 and Q103, sit in the LBO section of Part 1 because the Bible asks them too."},{"id":"08","title":"Reported in Elite Boutique London Interviews","intro":"Technical questions candidates report from London summer analyst and analyst interviews at Centerview, Evercore, Lazard, PJT, Perella Weinberg and Rothschild, drawn from Glassdoor and Wall Street Oasis. Questions already covered elsewhere in this guide are left out. Reports describe Centerview London using maths tests and brainteasers, PJT London asking many restructuring questions, and Perella Weinberg London asking candidates to do arithmetic without a calculator. The reported questions on valuing a company and on mergers versus acquisitions sit in Part 1 as Q37 and Q80."},{"id":"09","title":"Finance Concepts","intro":"Short section, but interviewers use these to check you understand why valuation works at all. Expect one of them as a warm-up."},{"id":"10","title":"Extra Accounting, EV and Valuation","intro":"Common first-round questions that the Bible's basic sections do not ask. Worth knowing, but learn Part 1 first."},{"id":"11","title":"Extra DCF and LBO","intro":"More follow-ups that come up after the core DCF and LBO questions."},{"id":"12","title":"Restructuring Basics","intro":"Moelis is one of the leading restructuring advisers. A first round for a generalist role may only touch on this, but a clean answer here will stand out."}],"questions":[{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"The income statement shows revenue, expenses and net income over a period, so it tells you whether the company is profitable. The balance sheet shows assets, liabilities and equity at a point in time, so it tells you what the company owns and how it is funded. The cash flow statement starts with net income, adjusts for non-cash items and working capital, then adds investing and financing flows to show how the cash balance changed."}],"why":[{"type":"p","html":"Accrual accounting means net income and cash differ. A company can book revenue before collecting cash, or spend cash on equipment that only reaches the income statement slowly through depreciation. You need all three statements to see profitability, financial position and cash generation together."}],"push":[{"q":"“If you could only see one statement, which would you choose?”","a":[{"type":"p","html":"The cash flow statement, because cash keeps a company alive and valuation is built on it. If you could have two, take the income statement and balance sheet, since you can rebuild the cash flow statement from them."}]}],"q_text":"What are the three financial statements, and why do we need them?","n":1},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"<b>Income statement.<\/b> Revenue, cost of goods sold, SG&amp;A, research and development, depreciation and amortisation, operating profit, interest expense, tax and net income."},{"type":"p","html":"<b>Balance sheet.<\/b> Assets such as cash, receivables, inventory, prepaid expenses, PP&amp;E, goodwill and other intangibles. Liabilities such as payables, accrued expenses, deferred revenue, debt and lease liabilities. Equity made up of share capital, reserves and retained earnings."},{"type":"p","html":"<b>Cash flow statement.<\/b> Operating activities start from net income, add back D&amp;A, stock-based compensation and other non-cash charges, then adjust for working capital. Investing holds capex, acquisitions and asset sales. Financing holds debt raised or repaid, shares issued or bought back, and dividends."}],"why":[{"type":"p","html":"Every three-statement walk-through relies on knowing where an item lives. Grouping items by statement and by section shows the interviewer you have that map in your head."}],"push":[{"q":"“Where does interest income go?”","a":[{"type":"p","html":"On the income statement below operating profit, and in operating cash flow through net income."}]},{"q":"“Any UK wording I should know?”","a":[{"type":"p","html":"UK accounts often say turnover for revenue, stock for inventory, and debtors and creditors for receivables and payables."}]}],"q_text":"Give me examples of the major line items on each financial statement.","n":2},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"Net income from the income statement goes to the top of the cash flow statement and into retained earnings on the balance sheet. On the cash flow statement you add back non-cash charges such as depreciation, adjust for changes in working capital, then include investing items like capex and financing items like debt raised or dividends paid. The net change in cash becomes the change in the cash line on the balance sheet. Capex increases PP&amp;E, depreciation reduces it, and debt raised or repaid changes the debt balance."}],"why":[{"type":"p","html":"Every change on the balance sheet apart from cash appears somewhere on the cash flow statement, and the cash flow statement's net change feeds the cash line. Both sides of the balance sheet therefore move by the same amount, so it always balances."}],"push":[{"q":"“Where does a dividend show up?”","a":[{"type":"p","html":"Nowhere on the income statement. It is a financing outflow on the cash flow statement, and on the balance sheet it reduces cash and retained earnings."}]}],"q_text":"Walk me through how the three statements link together.","n":3},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"<b>Income statement.<\/b> Pre-tax income falls by £10, tax falls by £2.50, so net income falls by £7.50."},{"type":"p","html":"<b>Cash flow statement.<\/b> Net income is down £7.50, but you add back the £10 of depreciation because it is non-cash. Cash is up £2.50."},{"type":"p","html":"<b>Balance sheet.<\/b> Cash is up £2.50 and PP&amp;E is down £10, so total assets fall by £7.50. Retained earnings fall by £7.50, so liabilities plus equity also fall by £7.50 and the balance sheet balances."}],"why":[{"type":"p","html":"Depreciation costs no cash. Its only cash effect is lowering the tax bill, and the £2.50 increase in cash is exactly that tax saving, £10 × 25%."}],"push":[{"q":"“Why does cash go up when an expense goes up?”","a":[{"type":"p","html":"The expense is non-cash, and it reduces taxes, which are paid in cash."}]},{"q":"“What if it's a £10 goodwill impairment that isn't tax deductible?”","a":[{"type":"p","html":"Tax does not change, so net income falls by the full £10. You add back £10 on the cash flow statement, so cash is unchanged. Goodwill falls £10 and retained earnings fall £10."}]}],"q_text":"Depreciation increases by £10. Walk me through the three statements.","n":4},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"It is usually buried inside other lines. Depreciation on factories and machines sits in cost of goods sold, and depreciation on offices and IT sits in operating expenses. Some companies show it as a separate line. The cash flow statement always shows the full D&amp;A figure as an add-back, so that is where to find it."}],"why":[{"type":"p","html":"Depreciation follows the asset. A production machine helps make the goods sold, so its cost belongs in COGS."}],"push":[{"q":"“Why does that matter when you calculate EBITDA?”","a":[{"type":"p","html":"If you add only the D&amp;A shown on the income statement to EBIT, you can miss the part inside COGS and understate EBITDA. Take D&amp;A from the cash flow statement."}]}],"q_text":"Where does depreciation usually show up on the income statement?","n":5},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"<b>Income statement.<\/b> Operating expense rises £10, so pre-tax income falls £10 and net income falls £7.50."},{"type":"p","html":"<b>Cash flow statement.<\/b> Net income is down £7.50. Accrued compensation is a liability, so its £10 increase adds £10 in working capital. Cash is up £2.50."},{"type":"p","html":"<b>Balance sheet.<\/b> Cash up £2.50 on the assets side. Accrued compensation up £10 and retained earnings down £7.50, so liabilities plus equity rise £2.50 and it balances."}],"why":[{"type":"p","html":"The company has recorded wages it owes but has not paid yet. The expense counts this period, the cash has not left, and the only cash effect is the tax saving."}],"push":[{"q":"“What happens when the wages are paid?”","a":[{"type":"p","html":"Nothing on the income statement. Accrued compensation falls £10, which is −£10 on the cash flow statement. Cash and the liability both fall £10."}]}],"q_text":"Accrued compensation goes up by £10. Walk me through the three statements.","n":6},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"<b>Income statement.<\/b> No change."},{"type":"p","html":"<b>Cash flow statement.<\/b> The £10 increase in inventory is −£10 in working capital, so cash falls £10."},{"type":"p","html":"<b>Balance sheet.<\/b> Cash −£10, inventory +£10. Total assets are unchanged and nothing else moves."},{"type":"p","html":"The income statement only records inventory when it is sold. At that point its cost moves into COGS, matched against the revenue it earns."}],"why":[{"type":"p","html":"The matching principle. Buying stock does not earn anything yet, so expensing it now would understate this period's profit and overstate the next."}],"push":[{"q":"“What if they buy it on credit?”","a":[{"type":"p","html":"Inventory and payables both rise £10. The two working capital changes cancel on the cash flow statement, so cash is unchanged."}]},{"q":"“Now they sell it for £20. What happens?”","a":[{"type":"p","html":"Revenue £20, COGS £10, pre-tax income £10, net income £7.50. On the cash flow statement, net income +£7.50 plus the £10 fall in inventory gives cash +£17.50. On the balance sheet cash +£17.50 and inventory −£10, so assets rise £7.50, matching the rise in retained earnings."}]}],"q_text":"Inventory goes up by £10 and the company pays cash. Walk me through it, and tell me why the income statement doesn't change.","n":7},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"<b>At purchase.<\/b> No income statement change. On the cash flow statement, −£100 in investing and +£100 in financing, so net cash is unchanged. On the balance sheet PP&amp;E rises £100 and debt rises £100."},{"type":"p","html":"<b>Year one income statement.<\/b> £10 of interest and £10 of depreciation cut pre-tax income by £20, so net income falls £15."},{"type":"p","html":"<b>Year one cash flow statement.<\/b> Net income −£15, add back £10 of depreciation, so operating cash flow is −£5. Repaying £10 of principal is −£10 in financing. Net change in cash is −£15."},{"type":"p","html":"<b>Year one balance sheet.<\/b> Cash −£15 and PP&amp;E −£10, so assets fall £25. Debt falls £10 and retained earnings fall £15, so liabilities plus equity also fall £25."}],"why":[{"type":"p","html":"Interest is a cash cost and tax deductible. Depreciation is tax deductible but non-cash. Principal repayment only touches financing cash flow and the debt balance."}],"push":[{"q":"“Why isn't the principal repayment on the income statement?”","a":[{"type":"p","html":"It is returning borrowed money, which is not an expense."}]}],"q_text":"A company raises £100 of debt to buy a factory. Walk me through the purchase, then year one with 10% interest, 10% annual depreciation and 10% of the principal repaid.","n":8},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"<b>Year two, income statement.<\/b> £10 of interest and £10 of depreciation cut pre-tax income by £20, so net income falls £15."},{"type":"p","html":"<b>Year two, cash flow statement.<\/b> Net income −£15, add back £10 of depreciation, so cash falls £5. No financing flow because no principal is repaid."},{"type":"p","html":"<b>Year two, balance sheet.<\/b> Cash −£5 and PP&amp;E −£10, so assets fall £15. Debt is unchanged and retained earnings fall £15."},{"type":"p","html":"<b>Year three.<\/b> After two years of depreciation the factory's book value is £80. The £80 write-down cuts pre-tax income by £80 and net income by £60. On the cash flow statement, net income −£60 plus the £80 non-cash write-down gives +£20, and repaying the loan is −£100 in financing, so cash falls £80. On the balance sheet, cash −£80 and PP&amp;E −£80, so assets fall £160. Debt −£100 and retained earnings −£60, so liabilities plus equity also fall £160."}],"why":[{"type":"p","html":"Interest is cash and tax deductible. Depreciation and the write-down are tax deductible but non-cash. Repaying principal only touches financing and the debt line. Q8 runs the version where principal is repaid each year."}],"push":[{"q":"“What if the write-down isn't tax deductible?”","a":[{"type":"p","html":"Net income falls the full £80. Add back £80, so operating cash flow is zero, and the £100 repayment leaves cash down £100. Assets fall £180 and debt plus retained earnings fall £180."}]}],"q_text":"A company buys a £100 factory with debt. In year two it pays 10% interest, depreciates the factory by 10% and repays no principal. At the start of year three the factory breaks, is written down to zero, and the loan is repaid in full. Walk me through both years.","n":9},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"<b>Income statement.<\/b> Revenue +£100, COGS +£60, pre-tax income +£40, tax £10, net income +£30."},{"type":"p","html":"<b>Cash flow statement.<\/b> Net income +£30, and the £60 fall in inventory adds £60 in working capital. Cash is up £90."},{"type":"p","html":"<b>Balance sheet.<\/b> Cash +£90, inventory −£60, so assets rise £30. Retained earnings rise £30."}],"why":[{"type":"p","html":"The customer paid £100 and the company paid £10 of tax, which gives the £90. The inventory had been paid for in an earlier period, so its cost is non-cash today."}],"push":[{"q":"“What if the customer buys on credit?”","a":[{"type":"p","html":"The income statement is identical. On the cash flow statement the £100 rise in receivables is −£100, so cash flow is +£30 − £100 + £60 = −£10, which is the tax payment. On the balance sheet receivables rise £100, inventory falls £60 and cash falls £10, so assets rise £30, matching the £30 rise in retained earnings."}]}],"q_text":"A company sells inventory that cost £60 for £100 in cash. Walk me through it.","n":10},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"Yes. Shareholders' equity is assets minus liabilities, so it turns negative once losses and payouts exceed the capital shareholders put in. Three common causes. A private equity owner does a dividend recap and borrows to pay itself a dividend larger than the book equity. The company loses money year after year and wipes out retained earnings. Or a mature company funds large buybacks with debt, which is why McDonald's reports negative shareholders' equity."}],"why":[{"type":"p","html":"Book equity is an accounting figure built from history. It says nothing on its own about whether the business can pay its bills."}],"push":[{"q":"“Is negative book equity a sign of distress?”","a":[{"type":"p","html":"Not by itself. Check cash flow, leverage and interest cover. For a company returning cash through buybacks it can be fine. For a company that got there through losses it is a warning sign."}]}],"q_text":"Could a company end up with negative shareholders' equity? What does it mean?","n":11},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"Working capital is current operating assets minus current operating liabilities, mostly receivables plus inventory minus payables and deferred revenue. Bankers normally leave out cash and debt. On the cash flow statement an increase in working capital reduces cash, and a decrease releases cash."}],"why":[{"type":"p","html":"Growing receivables or inventory means the company has tied up cash in them. Growing payables or deferred revenue means the company is holding cash it owes suppliers or has received early from customers. The change in working capital is the bridge between profit and operating cash flow."}],"push":[{"q":"“Is negative working capital bad?”","a":[{"type":"p","html":"Not necessarily. UK supermarkets collect cash from shoppers at the till and pay suppliers weeks later, so negative working capital reflects bargaining power. It is only a warning sign when it comes from a company struggling to pay its bills."}]}],"q_text":"What is working capital, and what does the change in working capital mean?","n":12},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"<b>Income statement.<\/b> Pre-tax income falls £10 and net income falls £7.50."},{"type":"p","html":"<b>Cash flow statement.<\/b> Net income is down £7.50, you add back the £10 write-down as a non-cash charge, and cash is up £2.50."},{"type":"p","html":"<b>Balance sheet.<\/b> Cash up £2.50, inventory down £10, so assets fall £7.50. Retained earnings fall £7.50."}],"why":[{"type":"p","html":"A write-down follows the same pattern as depreciation. It is a non-cash expense that saves tax, assuming it is tax deductible."}],"push":[{"q":"“Where exactly does the add-back go on the cash flow statement?”","a":[{"type":"p","html":"Either as its own non-cash line or inside the change in inventory within working capital. Cash ends up the same either way."}]}],"q_text":"A company writes down £10 of inventory. Walk me through it.","n":13},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"<b>Income statement.<\/b> No change."},{"type":"p","html":"<b>Cash flow statement.<\/b> +£100 from the share issue and −£20 for the dividend, both in financing, so cash rises £80."},{"type":"p","html":"<b>Balance sheet.<\/b> Cash +£80. Share capital +£100 and retained earnings −£20, so equity rises £80."}],"why":[{"type":"p","html":"Both are transactions with shareholders, so neither touches operating profit."}],"push":[{"q":"“Does the dividend reduce net income?”","a":[{"type":"p","html":"No. It is paid out of net income after net income is calculated."}]}],"q_text":"A company issues £100 of new shares and pays a £20 dividend. Walk me through it.","n":14},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"<b>Debt write-down, income statement.<\/b> Owing £100 less is a £100 gain, so pre-tax income rises £100 and net income rises £75."},{"type":"p","html":"<b>Cash flow statement.<\/b> Net income +£75, then subtract the £100 non-cash gain. Cash falls £25, which is the tax on the gain."},{"type":"p","html":"<b>Balance sheet.<\/b> Cash −£25 on assets. Debt −£100 and retained earnings +£75, so liabilities plus equity also fall £25."},{"type":"p","html":"<b>Bailout.<\/b> Depends on the form. Usually the government buys new shares or preferred shares, which works like Q14. Cash +£100 in financing, equity +£100, no income statement effect. If it is a loan, debt rises £100 instead of equity."}],"why":[{"type":"p","html":"Cancelling a liability makes the company better off on paper, so it shows up as a gain. The only cash effect is tax, on the simple assumption that the gain is taxable."}],"push":[{"q":"“Where does a debt write-down happen in practice?”","a":[{"type":"p","html":"In restructurings, when creditors accept less than face value. Tax treatment of cancelled debt varies by country, and reliefs sometimes apply, which is one of the things restructuring advisers check."}]}],"q_text":"Walk me through a £100 write-down of debt the company owes, and a £100 bailout.","n":15},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"<b>On receipt.<\/b> No revenue yet. On the cash flow statement the £120 rise in deferred revenue adds £120 to cash. On the balance sheet cash rises £120 and deferred revenue rises £120."},{"type":"p","html":"<b>After month one.<\/b> Revenue of £10 is recognised, so net income rises £7.50 if we ignore costs. On the cash flow statement, net income +£7.50 and the £10 fall in deferred revenue is −£10, so cash falls £2.50. On the balance sheet cash falls £2.50, deferred revenue falls £10 and retained earnings rise £7.50, so both sides fall by £2.50."}],"why":[{"type":"p","html":"Revenue is recognised as the service is delivered, while the cash arrived at the start."}],"push":[{"q":"“Why does cash fall in a month when the company earns revenue?”","a":[{"type":"p","html":"The cash came in a month earlier. Recognising revenue now creates taxable profit, and the tax is the only cash movement this month."}]}],"q_text":"A customer pays £120 upfront for a 12-month subscription. Walk me through receipt and then the first month.","n":16},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"Receivables are cash the company has earned but not yet collected, so they are a future cash inflow and an asset. Deferred revenue is cash the company has collected for products or services it still owes the customer, so it is an obligation and a liability."}],"why":[{"type":"p","html":"Assets bring future benefits and liabilities are future obligations. With deferred revenue the company must still deliver before it can count the revenue as earned."}],"push":[{"q":"“Is a large deferred revenue balance a bad sign?”","a":[{"type":"p","html":"Usually the opposite. It means customers pay upfront, as with software subscriptions, which is good for cash flow."}]}],"q_text":"Why is accounts receivable an asset but deferred revenue a liability?","n":17},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"Usually 30 to 90 days, depending on the payment terms normal in its industry. You measure it with days sales outstanding, which is receivables ÷ revenue × 365."}],"why":[{"type":"p","html":"Receivables are cash the company has earned but not received, so DSO tells you how long cash is tied up in customers."}],"push":[{"q":"“DSO rises from 45 to 60 days. What does that tell you?”","a":[{"type":"p","html":"Customers are paying more slowly, the company has loosened credit terms to win sales, or it has collection problems. Each extra day ties up cash, so check whether bad debts are rising too."}]}],"q_text":"How long does it usually take a company to collect its receivables?","n":18},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"Cash accounting records revenue and expenses when cash moves. Accrual accounting records revenue when it is earned and expenses when they are incurred, whatever the timing of the cash. Listed companies must use accrual accounting. Cash accounting is mostly for very small businesses."},{"type":"p","html":"With the TV, cash accounting records the sale only when the card company pays the retailer, a few days later. Accrual accounting records revenue at the till, with a receivable that clears when the card company pays."}],"why":[{"type":"p","html":"Accrual accounting matches revenue with the costs of earning it, which is why net income and cash flow differ and why we need a cash flow statement."}],"push":[{"q":"“Why don't large companies use cash accounting?”","a":[{"type":"p","html":"Profits would swing with the timing of payments, and management could move results simply by delaying or speeding up payments."}]}],"q_text":"What's the difference between cash-based and accrual accounting? Show me with a customer paying for a TV by credit card.","n":19},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"It goes there if it relates to the current period's business and, in most cases, affects taxable profit. Revenue, cost of goods sold, salaries, depreciation and interest all qualify. Buying equipment, repaying debt principal and paying dividends do not, because they either benefit many periods or are payments to investors."}],"why":[{"type":"p","html":"Accrual accounting matches costs to the periods they help generate revenue. A machine that lasts ten years is spread across ten years through depreciation. Principal repayments and dividends are financing decisions, so they sit on the cash flow statement and balance sheet."}],"push":[{"q":"“So interest goes on the income statement but principal repayment doesn't?”","a":[{"type":"p","html":"Correct. Interest is the cost of using the money this period and is tax deductible. Principal repayment is handing the borrowed money back, which is not an expense."}]}],"q_text":"How do you decide whether an item goes on the income statement?","n":20},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"<b>Income statement.<\/b> Nothing at first."},{"type":"p","html":"<b>Cash flow statement.<\/b> Capex of £100 in investing, so cash falls £100."},{"type":"p","html":"<b>Balance sheet.<\/b> Cash down £100, PP&amp;E up £100. Total assets are unchanged."}],"why":[{"type":"p","html":"Equipment benefits many years, so its cost reaches the income statement gradually through depreciation."}],"push":[{"q":"“And over the equipment's life?”","a":[{"type":"p","html":"Each year's depreciation flows through exactly like the first example, reducing PP&amp;E until the asset is fully depreciated."}]}],"q_text":"A company buys £100 of equipment with cash. What happens?","n":21},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"Statutory earnings under IFRS or US GAAP include items management argues do not reflect ongoing performance, such as restructuring costs, impairments, amortisation of acquired intangibles, stock-based compensation and one-off legal costs. Adjusted figures strip those out to show underlying performance, and UK companies often call them adjusted or underlying operating profit. Bankers use adjusted numbers for comps so peers are compared on the same basis."}],"why":[{"type":"p","html":"Comps only work if every company's earnings exclude the same one-off items."}],"push":[{"q":"“What's the risk with adjusted earnings?”","a":[{"type":"p","html":"Management chooses the adjustments. If a one-off restructuring cost appears every year, it is a normal cost and should stay in. Read the reconciliation and make the adjustments consistent across peers."}]}],"q_text":"Why do companies report both statutory earnings and adjusted or non-GAAP earnings?","n":22},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"EBITDA is earnings before interest, taxes, depreciation and amortisation. It is a rough proxy for operating cash flow that ignores capital structure, tax differences and non-cash D&amp;A, so it makes companies easy to compare."}],"why":[{"type":"p","html":"Excluding interest makes EBITDA independent of how the company is financed, which is why it pairs with enterprise value. Excluding D&amp;A removes differences in accounting choices about asset lives."}],"push":[{"q":"“What's wrong with EBITDA?”","a":[{"type":"p","html":"It ignores capex, working capital and tax, all of which cost cash. For capital-intensive businesses like telecoms or manufacturing it can make cash generation look much better than it is."}]}],"q_text":"What is EBITDA, and why do bankers use it?","n":23},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"A company can report net income while burning cash if it is tying up cash in working capital, spending heavily on capex, or facing a debt maturity it cannot refinance. Once it runs out of cash and misses a payment, profitability on paper does not save it."}],"why":[{"type":"p","html":"Fast-growing companies often build inventory and receivables before collecting cash from customers. Accounting profit cannot repay a bond that matures next month."}],"push":[{"q":"“Can the reverse happen, losses but plenty of cash?”","a":[{"type":"p","html":"Yes. A large non-cash charge like an impairment can create a loss while the business still generates cash. A start-up funded with equity can also report losses with a large cash balance."}]}],"q_text":"How can a profitable company go bankrupt?","n":24},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"Free cash flow is cash flow from operations minus capital expenditure. It is the cash the business generates after paying for what it needs to keep running and growing, and it is available to repay debt, pay dividends, buy back shares or fund acquisitions."}],"why":[{"type":"p","html":"Net income includes non-cash items and ignores capex, so free cash flow is a cleaner measure of what investors can take out of the business."}],"push":[{"q":"“What's the difference between unlevered and levered free cash flow?”","a":[{"type":"p","html":"Unlevered FCF is before interest and is available to all investors, so it pairs with enterprise value and WACC. Levered FCF is after interest and debt repayments, is available only to shareholders, and pairs with equity value and cost of equity."}]}],"q_text":"What is free cash flow?","n":25},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"Goodwill is created when an acquirer pays more than the fair value of the target's identifiable net assets. It represents things like brand strength, an assembled workforce and expected synergies that are not recognised separately. Under IFRS it is not amortised. It is tested for impairment every year and written down if the acquisition has lost value."}],"why":[{"type":"p","html":"The acquirer's balance sheet has to balance after the deal. The acquirer pays a price, records the target's assets and liabilities at fair value, and the gap between the two becomes goodwill."}],"push":[{"q":"“What does a goodwill impairment tell you?”","a":[{"type":"p","html":"The acquirer overpaid or the business has done worse than expected. It is non-cash, so it reduces net income and goodwill but leaves cash untouched."}]}],"q_text":"What is goodwill, and how is it created?","n":26},{"section":"01","group":null,"reported":null,"answer":[{"type":"p","html":"Mainly when the company acquires another business and pays more than the fair value of its identifiable net assets. Goodwill also moves with exchange rates when it belongs to a foreign subsidiary. It cannot be revalued upwards, and under IFRS an impairment of goodwill can never be reversed."}],"why":[{"type":"p","html":"Goodwill only exists because of acquisitions. It is the leftover of the purchase price after every identifiable asset and liability has been valued."}],"push":[{"q":"“How else can goodwill fall, apart from impairment?”","a":[{"type":"p","html":"Selling the business it belongs to removes it from the balance sheet, and exchange rate moves can shrink it."}]}],"q_text":"Under what circumstances would goodwill increase?","n":27},{"section":"02","group":null,"reported":null,"answer":[{"type":"p","html":"Equity value is what the whole company, including its cash and other non-core assets, is worth to common shareholders. For a listed company it is the share price times diluted shares. Enterprise value is the value of the core operating business to every investor, including lenders, preferred shareholders and minority holders."}],"why":[{"type":"p","html":"Shareholders own the company's cash and investments, so equity value includes them. EV strips them out to isolate the operating business, which makes it comparable across companies with different capital structures."}],"push":[{"q":"“Give me an analogy.”","a":[{"type":"p","html":"A house worth £500,000 with a £400,000 mortgage. Your equity is £100,000, but the house itself, the enterprise value, is worth £500,000 however it is financed."}]}],"q_text":"What do equity value and enterprise value mean?","n":28},{"section":"02","group":null,"reported":null,"answer":[{"type":"p","html":"Enterprise value, because it is the full cost of the business. The buyer pays the equity value to shareholders, but it also takes on or refinances the target's debt and receives its cash. Headline offers are quoted per share, which is equity value, so you need both. Equity value is what shareholders receive and EV is what the business costs."}],"why":[{"type":"p","html":"Two targets with the same offer price per share can cost very different amounts if one carries far more debt."}],"push":[{"q":"“A deal is reported as worth £5bn including debt. Which value is that?”","a":[{"type":"p","html":"Enterprise value."}]}],"q_text":"When you look at an acquisition, do you pay more attention to enterprise value or equity value?","n":29},{"section":"02","group":null,"reported":null,"answer":[{"type":"p","html":"Start with diluted equity value. Add debt, preferred stock and non-controlling interest. Subtract cash and other non-operating assets such as investments in associates. Under IFRS 16, if you are using EBITDA that excludes lease costs, add lease liabilities too, and you can add unfunded pension deficits."}],"why":[{"type":"p","html":"You add claims that other investors have on the core business, and you subtract assets that sit outside the core business. Each item should match what the operating metric you pair with EV includes."}],"push":[{"q":"“Why do you subtract cash?”","a":[{"type":"p","html":"Cash is not part of the core operations, and EBITDA does not include the interest income it earns. The common answer, that a buyer can use the target's cash to cut the price, is partly right, but the consistency argument is the one interviewers want."}]}],"q_text":"Walk me through the bridge from equity value to enterprise value.","n":30},{"section":"02","group":null,"reported":null,"answer":[{"type":"p","html":"When a parent owns more than 50% of a subsidiary, it consolidates 100% of the subsidiary's revenue and EBITDA, even though it only owns part of it. Equity value only reflects the parent's share, so you add NCI to capture the full value of the subsidiary and match the 100% of EBITDA in the denominator."}],"why":[{"type":"p","html":"Numerator and denominator must cover the same set of operations, or the multiple is distorted."}],"push":[{"q":"“And a 30% stake in another company?”","a":[{"type":"p","html":"Below 50% the investee is not consolidated, so its EBITDA is not in the parent's numbers. You subtract the value of the stake from EV for the same consistency reason."}]}],"q_text":"Why do you add non-controlling interest?","n":31},{"section":"02","group":null,"reported":null,"answer":[{"type":"p","html":"Diluted equity value counts options, warrants and convertibles that would create new shares. Under the treasury stock method you assume in-the-money options are exercised, the company receives the strike price in cash, and it uses that cash to buy back shares at the current share price. The net new shares are added to the basic count."},{"type":"p","html":"<b>Example.<\/b> 100 shares at £10, plus 10 options with a £5 strike. Exercise creates 10 shares and £50 of cash, which buys back 5 shares at £10. Net new shares are 5, so diluted shares are 105 and diluted equity value is £1,050."}],"why":[{"type":"p","html":"Options are future claims on ownership, so ignoring them overstates value per share."}],"push":[{"q":"“What about out-of-the-money options?”","a":[{"type":"p","html":"Ignore them, since nobody would exercise them. Convertible bonds count as shares if the share price is above the conversion price, and as debt if it is below."}]}],"q_text":"How do you calculate diluted equity value? Walk me through the treasury stock method.","n":32},{"section":"02","group":null,"reported":null,"answer":[{"type":"p","html":"No. Some cash is needed to run the business day to day, and some is restricted or held overseas where bringing it home costs tax, so bankers sometimes subtract only excess cash. On debt, if a company's bonds trade well below par, market value says more than face value about what the debt is worth. Change-of-control clauses can force a buyer to repay debt at face value, which matters in an acquisition. Debt-like items such as lease liabilities, pension deficits and deferred consideration owed from earlier deals can also belong in the bridge."}],"why":[{"type":"p","html":"EV measures the cost of the operating business. Only cash a buyer could take out lowers that cost, and every claim that has to be paid off raises it."}],"push":[{"q":"“Do you add an undrawn revolver?”","a":[{"type":"p","html":"No. Only the amount drawn is debt."}]}],"q_text":"Is it always right to subtract all the cash and add all the debt?","n":33},{"section":"02","group":null,"reported":null,"answer":[{"type":"p","html":"EV can be negative if a company holds more cash than its equity value plus debt. It happens with cash-rich companies the market expects to burn cash, and sometimes with distressed companies. Equity value for a listed company cannot be negative, because a share price cannot fall below zero."}],"why":[{"type":"p","html":"A negative EV means the market values the operating business at less than nothing, so it expects the operations to destroy value."}],"q_text":"Can enterprise value be negative? What about equity value?","push":[],"n":34},{"section":"02","group":null,"reported":null,"answer":[{"type":"p","html":"There are £10m ÷ £1,000 = 10,000 bonds. Each converts into £1,000 ÷ £50 = 20 shares. The share price of £100 is above the £50 conversion price, so the bonds are in the money and you assume conversion. That adds 10,000 × 20 = 200,000 shares, so diluted shares are 1.2 million and diluted equity value is £120m."}],"why":[{"type":"p","html":"A holder converts whenever the shares received are worth more than the bond's par value. Here 20 shares at £100 are worth £2,000 against £1,000 of par."}],"push":[{"q":"“What if the share price were £40?”","a":[{"type":"p","html":"Below the conversion price, so no conversion. Shares stay at 1 million and the £10m counts as debt."}]},{"q":"“What changes in the EV bridge if you assume conversion?”","a":[{"type":"p","html":"The £10m leaves debt because it is already counted in the diluted share count. Counting it in both places would double count it."}]}],"q_text":"A company has 1 million shares at £100, plus £10m of convertible bonds with a par value of £1,000 and a conversion price of £50. What are the diluted shares?","n":35},{"section":"02","group":null,"reported":null,"answer":[{"type":"p","html":"Equity value is the market value of the shares, share price times diluted shares. Shareholders' equity is the book value on the balance sheet, share capital plus reserves and retained earnings, built up from past transactions. For a healthy company equity value is usually higher, because the market prices in future growth and assets such as brands that never reach the balance sheet. Price-to-book compares the two."}],"why":[{"type":"p","html":"One is a forward-looking market price and the other is an accounting record of history."}],"push":[{"q":"“When would equity value be below book value?”","a":[{"type":"p","html":"When the market doubts the assets are worth their book value or expects losses. Distressed companies and many European banks after 2008 traded below book."}]},{"q":"“Can book equity be negative while equity value is positive?”","a":[{"type":"p","html":"Yes. See Q11."}]}],"q_text":"What's the difference between equity value and shareholders' equity?","n":36},{"section":"03","group":null,"reported":"Rothschild & Co London graduate interview (reviewed August 2026) and London intern interview (September 2026), which also covered common multiples.","answer":[{"type":"p","html":"First I would understand the business and the situation, meaning what it does, how it makes money, how fast it grows and why we are valuing it, for example a sale, an IPO or a fairness opinion. Then I would pick the methods. For most companies that means trading comps and precedent transactions for a market view, and a DCF for an intrinsic view. If private equity buyers are likely, I would add an LBO analysis to show what a sponsor could pay. I would put the ranges side by side on a football field, see where they overlap, and explain any gaps before settling on a range."}],"why":[{"type":"p","html":"Interviewers want to hear a process. Starting with the business and the purpose shows judgment, because the right methods depend on both. Ending with triangulation shows you would sense-check one method against the others."}],"push":[{"q":"“Which multiples would you use?”","a":[{"type":"p","html":"EV/EBITDA for most sectors, EV/EBIT where capex is heavy, EV/Revenue for loss-making growth companies, P/E for a quick equity view, and price-to-book for banks."}]},{"q":"“Your DCF comes out 40% above the comps. What do you do?”","a":[{"type":"p","html":"Check the assumptions driving the gap, usually terminal growth, margins or WACC, and compare the DCF's implied exit multiple with peers. A gap that large usually means the forecast is more optimistic than the market's view."}]}],"q_text":"Walk me through how you would value a company.","n":37},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"Comparable companies, which applies multiples from similar listed companies. Precedent transactions, which applies multiples paid in past acquisitions of similar companies. A DCF, which values the company from its projected cash flows. Bankers also use LBO analysis, sum-of-the-parts and liquidation analysis in specific situations."}],"why":[{"type":"p","html":"Comps and precedents are relative valuation, so they tell you what others pay. A DCF is intrinsic valuation, so it tells you what the cash flows are worth on your assumptions."}],"push":[{"q":"“What are the pros and cons of each?”","a":[{"type":"p","html":"Comps are current and market-based, but they depend on finding close peers and they reflect market sentiment. Precedents include control premiums, but the data can be old or sparse. A DCF is grounded in the company's own cash flows, but it is very sensitive to assumptions, especially the terminal value."}]}],"q_text":"What are the main valuation methodologies?","n":38},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"Precedent transactions usually do, because acquirers pay a control premium and often price in synergies. A DCF can land higher or lower depending on the assumptions. Comps tend to sit lowest because they reflect prices for minority stakes trading on the market."}],"why":[{"type":"p","html":"UK takeover premiums are often in the 20% to 40% range over the undisturbed share price, which pushes precedent multiples above trading multiples."}],"push":[{"q":"“Can comps ever come out above precedents?”","a":[{"type":"p","html":"Yes, if markets have re-rated since the precedent deals happened, or if the precedents were done in a weak market or were distressed sales."}]}],"q_text":"Which methodology gives the highest value?","n":39},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"For businesses with unpredictable or negative cash flows, such as early-stage start-ups, and for banks and insurers, where debt is part of the operations and free cash flow is hard to define. For banks you would use a dividend discount model and price-to-book multiples."}],"why":[{"type":"p","html":"A DCF is only as good as the cash flow forecast behind it."}],"push":[{"q":"“So how would you value a loss-making tech company?”","a":[{"type":"p","html":"Revenue multiples from comps, plus a DCF extended far enough for margins to reach a mature level, with heavy sensitivity analysis."}]}],"q_text":"When would you not use a DCF?","n":40},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"<b>Liquidation valuation.<\/b> Value the assets as if sold off and the liabilities repaid."},{"type":"p","html":"<b>Replacement value.<\/b> What it would cost to rebuild the company's assets today."},{"type":"p","html":"<b>LBO analysis.<\/b> What a private equity buyer could pay and still hit its target return."},{"type":"p","html":"<b>Sum of the parts.<\/b> Value each division separately and add them up."},{"type":"p","html":"<b>M&amp;A premiums analysis.<\/b> Apply the premiums paid in similar takeovers to the target's undisturbed share price."},{"type":"p","html":"<b>Future share price analysis.<\/b> Project the share price from a forward multiple and discount it back."},{"type":"p","html":"<b>Dividend discount model.<\/b> Mainly for banks and insurers, see Q131."}],"why":[{"type":"p","html":"Each method answers a narrower question, and bankers add the ones that fit the situation to the football field."}],"push":[{"q":"“Which would you add for a UK listed target?”","a":[{"type":"p","html":"A premiums analysis, since UK takeover premiums are well documented, plus the 52-week share price range as a reference bar."}]}],"q_text":"Apart from comps, precedents and a DCF, what other valuation methods are there?","n":41},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"Mainly in bankruptcy or distress, to show what creditors and shareholders would get if the assets were sold and the liabilities paid. Each asset takes a haircut. Cash counts in full, receivables at most of face value, and inventory and PP&amp;E at larger discounts."},{"type":"p","html":"It can come out highest when a company owns valuable hard assets, such as property, but the market prices its earnings very low, for example after an earnings miss or at the bottom of a cycle. Comps and precedents are then depressed too, and the assets can be worth more than the business as a going concern."}],"why":[{"type":"p","html":"Going-concern methods value earnings. A liquidation values assets, so it wins when assets are worth more than the earnings they produce."}],"push":[{"q":"“Why does it matter in a restructuring?”","a":[{"type":"p","html":"Creditors compare any plan with what they would get in a liquidation or other likely alternative, and UK courts use that comparison when deciding whether to impose a plan on a dissenting class."}]}],"q_text":"When would you use a liquidation valuation, and when could it give the highest value?","n":42},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"You value each division separately, using whichever method and multiples suit it, add them up, then adjust for net debt and central costs. It suits conglomerates whose divisions are in different industries."}],"why":[{"type":"p","html":"Applying one multiple to a group whose divisions grow at different rates misprices it."}],"push":[{"q":"“What's a conglomerate discount?”","a":[{"type":"p","html":"Markets often value a group below the sum of its parts, which is why activists push for break-ups and spin-offs."}]}],"q_text":"What is a sum-of-the-parts valuation, and when do you use it?","n":43},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"EV/EBITDA is the most common, because it ignores capital structure and D&amp;A policy, but it ignores capex. EV/EBIT captures D&amp;A as a rough proxy for capex, so it suits capital-intensive businesses. P/E is simple and widely quoted, but it is distorted by leverage, tax rates and one-off items."}],"why":[{"type":"p","html":"Each multiple strips out different items, so you pick the one that keeps the comparison fair for the sector."}],"push":[{"q":"“What about airlines or retailers with big leases?”","a":[{"type":"p","html":"Use EBITDA consistently on an IFRS 16 basis with lease liabilities in EV, or use EBITDAR, so companies that own and lease their assets are compared fairly."}]}],"q_text":"Compare EV/EBITDA, EV/EBIT and P/E.","n":44},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"EV/EBITDAR for airlines, retailers and hotels on pre-IFRS 16 numbers. EV/reserves and EV/production for oil and gas. Price-to-book and price-to-tangible-book for banks. Price-to-FFO for REITs. EV/subscribers for telecoms and streaming. EV/ARR for software."},{"type":"p","html":"Subscribers, scientists or barrels are operating metrics. They serve every investor in the company regardless of how it is financed, so they pair with enterprise value, the same way revenue does."}],"why":[{"type":"p","html":"The matching rule from Q49. A metric before any payment to lenders goes with EV."}],"push":[{"q":"“Why price-to-book for a bank?”","a":[{"type":"p","html":"A bank's assets and liabilities are mostly financial and carried close to market value, and regulators judge a bank on its capital, so book equity means something."}]}],"q_text":"What are some industry-specific multiples, and why do metrics like EV/subscribers use enterprise value?","n":45},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"Usually the DCF. The LBO price is whatever lets a sponsor hit a target IRR of around 20% to 25%, which is well above most companies' WACC, and it values the business only through the exit. The DCF discounts every year's cash flow at the lower WACC and adds the terminal value, so it tends to come out higher."}],"why":[{"type":"p","html":"A higher required return means a lower price for the same cash flows."}],"push":[{"q":"“When could the LBO come out higher?”","a":[{"type":"p","html":"When debt is cheap and plentiful, so sponsors can pay up, and the DCF uses a conservative forecast or a high WACC."}]}],"q_text":"Would an LBO or a DCF give a higher valuation?","n":46},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"A chart showing the valuation range from each methodology side by side, often with the 52-week share price range, so you can see where the methods overlap and settle on a price range."}],"why":[{"type":"p","html":"It gives a client a defensible range drawn from several approaches."}],"push":[{"q":"“Which bar would you trust most?”","a":[{"type":"p","html":"It depends on the situation. In a sale process, precedents and the LBO analysis show what buyers might pay. For a stable, predictable business the DCF is more useful."}]}],"q_text":"What is a football field?","n":47},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"The same way as a company. For comps, look at what similar trees have sold for. For a DCF, project apples per year times the price per apple, minus the cost of looking after the tree, over its productive life. Discount at a rate that reflects the risks, such as weather and disease, and add a terminal value for the timber or land at the end."}],"why":[{"type":"p","html":"The question checks that you can apply relative and intrinsic valuation to anything that produces cash."}],"push":[{"q":"“Which method would you trust more?”","a":[{"type":"p","html":"Comps if trees like it change hands often. A DCF if it is unusual and there are no good sales to compare with."}]}],"q_text":"How would you value an apple tree?","n":48},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"Match the metric to the investors it belongs to. Revenue, EBITDA and EBIT are before interest, so they belong to all investors and pair with EV. Net income and levered free cash flow are after interest, so they belong to shareholders and pair with equity value."}],"why":[{"type":"p","html":"Net income has already paid the lenders, so dividing EV by it mixes up whose value you are measuring."}],"push":[{"q":"“So why is EV/net income wrong?”","a":[{"type":"p","html":"The numerator includes the lenders' claim, but the denominator has already deducted their interest. The mismatch makes the multiple meaningless."}]}],"q_text":"How do you decide whether to pair a metric with enterprise value or equity value?","n":49},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"Use comps and precedent transactions with user-based metrics, such as EV per user or EV per page view, from similar companies and recent deals for start-ups. Do not build a DCF stretched far into the future, because with no revenue every cash flow would be a guess."}],"why":[{"type":"p","html":"When cash flows cannot be forecast with any confidence, value the business on the metrics you can see."}],"push":[{"q":"“What would you look at as it starts earning revenue?”","a":[{"type":"p","html":"EV/Revenue against high-growth peers, and later a DCF once margins and growth become predictable."}]}],"q_text":"It's 2004 and Facebook has no revenue and no profit. How would you value it?","n":50},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"Rarely. Large financial institutions with big cash balances can have a negative enterprise value, so EV multiples stop working. And if a slide shows revenue multiples for a mix of financial and non-financial companies, you might show equity value/revenue for the financials so the slide reads consistently. Most of the time you would use P/E and price-to-book for banks anyway."}],"why":[{"type":"p","html":"For a bank, interest is part of its revenue and operations, so the usual EV versus equity value split breaks down."}],"q_text":"You never use equity value/EBITDA. Is there any case where you might use equity value/revenue?","push":[],"n":51},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"Same industry and business model first, then similar size, geography, growth and margins. You start broad, narrow down, and usually end with five to ten companies."}],"why":[{"type":"p","html":"Multiples reflect growth and risk, so peers need similar profiles for their multiples to mean anything for your company."}],"push":[{"q":"“What if there are no good comps?”","a":[{"type":"p","html":"Widen the criteria, accept a broader peer set, and lean more on the DCF and precedent transactions."}]}],"q_text":"How do you choose comparable companies?","n":52},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"Either the market expects lower growth, lower margins or higher risk, or the company is undervalued. You would compare its growth and margins with the peers to see which explanation fits."}],"why":[{"type":"p","html":"A multiple is the market's summary of expectations, so a discount to peers is a question to investigate before calling it a bargain."}],"push":[{"q":"“Mean or median?”","a":[{"type":"p","html":"Median, because it is less distorted by outliers."}]}],"q_text":"Your company trades below the median multiple of its peers. What does that mean?","n":53},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"For comps, calculate each peer's multiples, take a range such as the 25th to 75th percentile, and apply it to the company's own metric, usually LTM or next year's EBITDA, to get an implied EV range. Do the same with precedents, using LTM figures at each deal's announcement. For the DCF, take the range from the sensitivity tables on WACC and terminal growth or exit multiple. Bridge each EV range to equity value and value per share, then put them on a football field."},{"type":"p","html":"Example. Peers trade at 8x to 10x EBITDA and the company has £50m of EBITDA, so EV is £400m to £500m. With £100m of net debt, equity value is £300m to £400m."}],"why":[{"type":"p","html":"Each method gives a range, and the overlap between them is what you defend to a client."}],"push":[{"q":"“Why next year's EBITDA for comps but LTM for precedents?”","a":[{"type":"p","html":"Markets price on expected earnings, especially for growing companies. Precedents use LTM because those were the figures known when the deal was struck."}]}],"q_text":"How do you turn comps, precedents and a DCF into a value for the company?","n":54},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"It may have just beaten expectations, hold an advantage the numbers do not show yet such as patents or a strong brand, have won a favourable legal ruling, or be the market leader with a larger share."},{"type":"p","html":"To reflect an advantage, use the upper end of the peer range such as the 75th percentile, add a premium to the multiples, or use stronger projections in the DCF."},{"type":"p","html":"The median is a starting point. You pick from the range based on how the company compares with its peers."}],"why":[{"type":"p","html":"Multiples summarise the market's view of growth and risk, so anything that changes that view moves the multiple."}],"push":[{"q":"“How would you justify the 75th percentile to a client?”","a":[{"type":"p","html":"Show where the company ranks against peers on growth, margins and returns on capital."}]}],"q_text":"Why might a company with similar growth and profitability to its peers trade at a premium? How do you reflect a competitive advantage, and do you always use the median?","n":55},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"One process had several bidders competing and the other did not. One target had bad news or a depressed share price, so it went cheaply. The deals happened at different points in the market cycle. Or the targets sat in industries with different typical multiples, or one offered the acquirer far more synergies."}],"why":[{"type":"p","html":"Price depends on the process and the timing as much as on the financials."}],"push":[{"q":"“Which explanation would you check first?”","a":[{"type":"p","html":"The process and the timing, using deal announcements and where the market was trading at each date."}]}],"q_text":"Two companies with the same financial profile are bought by the same acquirer, but one deal's EBITDA multiple is twice the other's. How could that happen?","n":56},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"On EV/EBITDA under older accounting rules, the one that leases. Both businesses have the same EV, but the lease cost sits in operating expenses and lowers EBITDA, while depreciation sits below EBITDA. Lower EBITDA with the same EV means a higher multiple."},{"type":"p","html":"Under IFRS 16 the lease cost moves below EBITDA into depreciation and interest, and the lease liability goes into EV, so the two businesses look much the same. That is why you check the accounting basis first, see Q143."}],"why":[{"type":"p","html":"A multiple is EV ÷ EBITDA, so anything that lowers EBITDA at the same EV raises the multiple."}],"push":[{"q":"“What about EV/EBIT?”","a":[{"type":"p","html":"Both the lease cost and depreciation reduce EBIT, so on EV/EBIT the two multiples match."}]}],"q_text":"You're buying a vending machine business. Would you pay a higher multiple for one that owns its machines and depreciates them, or one that leases them? The depreciation and lease costs are the same.","n":57},{"section":"03","group":null,"reported":null,"answer":[{"type":"p","html":"Use the same three methods with a few differences. Apply a discount to the public comps, often 10% to 15% or more, because a private stake is less liquid. There is no premiums analysis or share price analysis, because there is no share price. The output is enterprise value, which you bridge to equity value, but not to a price per share. In the DCF, estimate WACC from listed peers since the company has no beta or market cap."},{"type":"p","html":"Precedent multiples need no discount, because they already show what buyers paid for control of whole companies, including private ones. Private companies cannot be in trading comps, but private deals can be in precedents when the terms are disclosed."}],"why":[{"type":"p","html":"The comps discount is for illiquidity. A precedent is already a price for the whole company, so there is no liquidity gap to adjust for."}],"push":[{"q":"“Where do you find data on private deals?”","a":[{"type":"p","html":"Mergermarket, Capital IQ and PitchBook, press releases, and in the UK the accounts filed at Companies House."}]}],"q_text":"How do you value a private company? Why discount the comps but not the precedents, and can private companies be in your valuation?","n":58},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"Project the company's unlevered free cash flow for five to ten years. Calculate a terminal value for the period after that, using either perpetuity growth or an exit multiple. Discount the projected cash flows and the terminal value back to today at WACC and add them up to get enterprise value. Then subtract net debt and other claims to get equity value, and divide by diluted shares for an implied share price."}],"why":[{"type":"p","html":"A DCF says a company is worth the present value of the cash it will generate for all its investors."}],"push":[{"q":"“Why five to ten years?”","a":[{"type":"p","html":"Long enough for the company to reach a steady state, short enough to forecast with some confidence."}]}],"q_text":"Walk me through a DCF.","n":59},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"Revenue minus operating costs gives EBIT. Apply tax to get NOPAT, which is EBIT × (1 − t). Add back D&amp;A and other non-cash charges, subtract capex, and subtract any increase in working capital."}],"why":[{"type":"p","html":"What you are left with is the cash the operations generate before any payments to lenders or shareholders."}],"push":[{"q":"“Why include the change in working capital but leave out interest?”","a":[{"type":"p","html":"Working capital is part of running the business. Interest is a payment to one group of investors, the lenders, and unlevered FCF is meant to be available to all investors. The cost of debt is captured in WACC instead."}]}],"q_text":"How do you get from revenue to unlevered free cash flow?","n":60},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"WACC = cost of equity × equity % + cost of debt × (1 − t) × debt % + cost of preferred × preferred %, using market-value weights. It is the blended return all of the company's investors require."}],"why":[{"type":"p","html":"Unlevered FCF goes to every investor, so the discount rate has to reflect what every investor expects to earn."}],"push":[{"q":"“Why the after-tax cost of debt?”","a":[{"type":"p","html":"Interest is tax deductible, so the effective cost to the company is lower by the tax rate."}]}],"q_text":"What is WACC, and how do you calculate it?","n":61},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"With CAPM, cost of equity = risk-free rate + beta × equity risk premium. The risk-free rate is usually the 10-year government bond yield in the currency of the cash flows, so 10-year gilts for a sterling forecast. The equity risk premium is the extra return investors expect for holding equities over government bonds, commonly around 4% to 6%."}],"why":[{"type":"p","html":"Investors need compensation for time, captured by the risk-free rate, and for risk, captured by beta times the premium."}],"push":[{"q":"“A UK-listed company earns most of its revenue in the US. Which risk-free rate?”","a":[{"type":"p","html":"Match the currency of the cash flows. If you forecast in dollars, use US Treasuries."}]}],"q_text":"How do you calculate the cost of equity?","n":62},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"Beta measures how much a stock moves relative to the overall market. A beta of 1.0 moves with the market, 1.5 moves 50% more, and 0.5 moves half as much. A higher beta means more market risk and a higher cost of equity."}],"why":[{"type":"p","html":"Investors can diversify away company-specific risk, so only market risk earns a higher expected return."}],"push":[{"q":"“Can beta be negative?”","a":[{"type":"p","html":"In theory, for an asset that moves against the market, but it is rare for operating companies."}]}],"q_text":"What does beta mean?","n":63},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"Each peer's beta reflects its own leverage. You unlever to strip out capital structure and isolate business risk, take the median, then relever at your company's capital structure."},{"type":"p","html":"Unlevered beta = levered beta ÷ (1 + (1 − t) × D/E). Levered beta = unlevered beta × (1 + (1 − t) × D/E)."}],"why":[{"type":"p","html":"More debt makes equity riskier, because shareholders are paid after lenders. Two companies with identical operations can show different betas purely because of leverage."}],"push":[{"q":"“Why does the tax rate appear in the formula?”","a":[{"type":"p","html":"The interest tax shield lowers the effective cost of debt, which partly offsets the extra risk debt places on equity."}]}],"q_text":"Why do you unlever and relever beta?","n":64},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"Usually the technology company. Its value rests more on growth far in the future and its shares react more to changes in sentiment, so they move more than the market."}],"why":[{"type":"p","html":"Beta measures how much a share moves with the market, and investors price long-dated, uncertain growth more nervously."}],"push":[{"q":"“Is that always true?”","a":[{"type":"p","html":"No. A mature software company with recurring revenue can have a lower beta than a cyclical manufacturer, which is why you use the company's own peers."}]}],"q_text":"Would you expect a manufacturing company or a technology company to have a higher beta?","n":65},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"You project levered free cash flow, after
