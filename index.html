interest and debt repayments, discount it at the cost of equity, and the output is equity value. An unlevered DCF uses WACC and gives enterprise value. In theory they give the same equity value, but in practice they rarely match exactly because the capital structure assumptions differ."}],"why":[{"type":"p","html":"Cash flows and discount rates must refer to the same investors."}],"push":[{"q":"“Which do banks use more?”","a":[{"type":"p","html":"Unlevered, because it separates operating performance from financing, and the capital structure may change in a deal."}]}],"q_text":"What changes in a levered DCF?","n":66},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"Perpetuity growth gives TV = final-year FCF × (1 + g) ÷ (WACC − g). The exit multiple method applies an EV/EBITDA multiple from comps or precedents to final-year EBITDA. Bankers often prefer the exit multiple because clients understand it, while perpetuity growth is better grounded in theory. Best practice is to run both and check each against the other."}],"why":[{"type":"p","html":"Both estimate what the business is worth at the end of the forecast. Cross-checking catches unrealistic assumptions in either."}],"push":[{"q":"“How do you check your terminal value is reasonable?”","a":[{"type":"p","html":"Back out the multiple implied by the perpetuity method, or the growth rate implied by the multiple method. If perpetuity growth implies 20x EBITDA when peers trade at 9x, an assumption is wrong."}]}],"q_text":"How do you calculate terminal value, and which method is better?","n":67},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"A company growing faster than the economy forever would eventually be bigger than the economy. Long-run growth is usually set at around 1% to 3%, close to long-term inflation or GDP growth."}],"why":[{"type":"p","html":"The terminal value assumes the business has reached maturity, and mature businesses grow with the economy."}],"push":[{"q":"“What if your growth rate is higher than WACC?”","a":[{"type":"p","html":"The formula breaks and gives a negative or infinite value, which tells you the assumptions are inconsistent."}]}],"q_text":"Why must the terminal growth rate be below long-run GDP growth?","n":68},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"It depends entirely on the assumptions, so neither is reliably higher. The multiples method is more variable, because exit multiples span a wider range than sensible long-term growth rates."},{"type":"p","html":"The flaw is that today's multiples may look very different in five or ten years. That is worst in cyclical industries such as semiconductors, where multiples swing with the cycle. You handle it by using a range of exit multiples and running sensitivities."}],"why":[{"type":"p","html":"An exit multiple assumes today's market conditions hold at the end of the forecast."}],"push":[{"q":"“How do you cross-check the two?”","a":[{"type":"p","html":"Back out the growth rate implied by the exit multiple, or the multiple implied by the growth rate, as in Q67."}]}],"q_text":"Which terminal value method gives a higher valuation, and what's the flaw with basing the exit multiple on today's comps?","n":69},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"Often 60% to 80%, sometimes more. It is a weakness, because so much depends on assumptions about the distant future, which is why you always run sensitivity tables on WACC and terminal growth or the exit multiple."}],"why":[{"type":"p","html":"Most of a mature company's value lies in the cash it generates after year five."}],"push":[{"q":"“How would you reduce that dependence?”","a":[{"type":"p","html":"Extend the forecast period so more value comes from explicit years, accepting that the later forecasts are less reliable."}]}],"q_text":"How much of a DCF's value typically comes from the terminal value? Is that a problem?","n":70},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"The £500m company. Smaller companies are riskier, less diversified and less liquid, so investors want a higher return, and practitioners often add a size premium on top of CAPM. WACC is usually higher for the smaller company too, because its debt costs more and it can carry less of it, so more of its funding comes from expensive equity."}],"why":[{"type":"p","html":"Higher risk means a higher required return for every type of investor."}],"push":[{"q":"“Could the smaller company ever have the lower WACC?”","a":[{"type":"p","html":"In theory, if it carried much more cheap debt, but lenders rarely allow that for smaller companies."}]}],"q_text":"Should the cost of equity be higher for a £5bn or a £500m company? What about WACC?","n":71},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"Shareholders are paid last, have no guaranteed return and bear all the downside. Lenders receive fixed interest, rank ahead in insolvency and often hold security. Interest is also tax deductible."}],"why":[{"type":"p","html":"Investors demand more return for taking more risk."}],"push":[{"q":"“So why not fund everything with debt?”","a":[{"type":"p","html":"More debt raises the risk of distress, which pushes up both the cost of debt and the cost of equity. Past a point WACC starts rising."}]}],"q_text":"Why is equity more expensive than debt?","n":72},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"Trick question. Dividends are already included, because beta and the equity risk premium are measured on total returns, which include dividends as well as share price moves."},{"type":"p","html":"Without CAPM you can rearrange the Gordon growth model. Cost of equity = next year's dividend per share ÷ share price + dividend growth rate. A £2 dividend on a £40 share growing 4% a year gives 5% + 4% = 9%."}],"why":[{"type":"p","html":"CAPM gives the total return investors require, and total return already counts dividends."}],"push":[{"q":"“When would you use the dividend version?”","a":[{"type":"p","html":"For stable dividend payers such as utilities and banks, as a cross-check on CAPM."}]}],"q_text":"Cost of equity is the return an equity investor expects. Shouldn't dividends be in the formula? And how would you calculate it without CAPM?","n":73},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"WACC falls at first, because debt is cheaper than equity and interest is tax deductible. Past a certain point, rising bankruptcy risk pushes up the cost of debt and the cost of equity enough that WACC rises again. The target is the capital structure that minimises WACC."}],"why":[{"type":"p","html":"Cheaper funding helps until the risk it creates outweighs the saving."}],"push":[{"q":"“Where is that optimum?”","a":[{"type":"p","html":"It depends on how stable the cash flows are. A regulated utility can carry far more debt than a tech start-up."}]}],"q_text":"How does adding debt affect WACC?","n":74},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"Usually the 10% revenue change, because it flows through every year's cash flow and the terminal value, and by more than 10% if many costs are fixed. A one-point change in WACC moves value by roughly 10% to 15%. With 10% WACC and 2% growth, the terminal value multiple falls from 1 ÷ 8% = 12.5x to 1 ÷ 9% ≈ 11.1x, about 11% lower. So they are close, and margins decide it."},{"type":"p","html":"A 1% revenue change against a one-point change in the discount rate is easy. The discount rate wins clearly."}],"why":[{"type":"p","html":"Revenue scales cash flows in proportion, while the discount rate works through compounding and the r − g denominator."}],"q_text":"Which affects a DCF more, a 10% change in revenue or a 1% change in the discount rate? And 1% revenue against 1% discount rate?","push":[],"n":75},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"It has no market cap or beta, so you build it from listed peers. Unlever the peers' betas, take the median, and relever it at the private company's target capital structure. Use the company's own borrowing rate for the cost of debt, and add a size or illiquidity premium if it is small. In practice bankers also check against estimates from auditors or valuation specialists."}],"why":[{"type":"p","html":"The business risk of a private company is similar to that of its listed peers, so their betas are the best available evidence."}],"q_text":"How do you calculate WACC for a private company?","push":[],"n":76},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"Build your own projections, cut management's to something more conservative, or show sensitivity tables across different growth and margin assumptions so the client sees the range."},{"type":"p","html":"Common DCF sensitivities are revenue growth against terminal multiple, EBITDA margin against terminal multiple, terminal multiple against discount rate, and long-term growth against discount rate."}],"why":[{"type":"p","html":"A DCF is only as good as its forecast, so you test the forecast instead of relying on it."}],"push":[{"q":"“How would you sanity-check management's numbers?”","a":[{"type":"p","html":"Compare forecast growth and margins with the company's own history and with peers and consensus estimates."}]}],"q_text":"What do you do if you don't believe management's projections? Which sensitivities would you run?","n":77},{"section":"04","group":null,"reported":null,"answer":[{"type":"p","html":"In a standard unlevered DCF you do not. Principal repayments sit in financing cash flow, and unlevered free cash flow stops at operating cash flow minus capex. The debt shows up only in the bridge from EV to equity value."},{"type":"p","html":"In a levered DCF, repayments reduce future interest. Definitions differ on whether repayments themselves are deducted. Many bankers subtract mandatory repayments in levered free cash flow, as in Q66, while the Bible's version only counts the lower interest."}],"why":[{"type":"p","html":"Unlevered cash flow is measured before any payment to lenders, so how the debt is repaid cannot change it."}],"q_text":"A company has a heavy debt load and repays a large chunk of principal each year. How do you account for that in a DCF?","push":[],"n":78},{"section":"05","group":null,"reported":null,"answer":[{"type":"p","html":"Project both companies' financials. Set the purchase price and the mix of cash, debt and stock. Allocate the purchase price, creating goodwill and asset write-ups. Combine the income statements and adjust for foregone interest on cash used, new interest on debt raised, new shares issued, synergies and extra amortisation from write-ups. Compare combined EPS with the acquirer's standalone EPS to see whether the deal is accretive or dilutive."}],"why":[{"type":"p","html":"The model asks whether the acquirer's shareholders are better or worse off per share after the deal."}],"push":[{"q":"“Why do bankers care about EPS?”","a":[{"type":"p","html":"Boards and shareholders of listed acquirers watch it, and dilutive deals can hurt the share price, even though EPS is an imperfect measure of value."}]}],"q_text":"Walk me through a merger model.","n":79},{"section":"05","group":null,"reported":"Rothschild & Co London summer analyst interview, October 2025.","answer":[{"type":"p","html":"In a merger, two companies combine into one legal entity. One company is absorbed into the other, or both fold into a new company, and the absorbed company ceases to exist, with its shareholders usually receiving shares in the combined group. In an acquisition, the buyer purchases the target's shares or assets. In a share purchase the target survives as a subsidiary of the buyer. In an asset purchase the buyer takes only the assets and liabilities it chooses."},{"type":"p","html":"In the UK, company law has no general statutory merger procedure for domestic companies, so deals described as mergers are normally structured as one company acquiring the other's shares, through a takeover offer or a scheme of arrangement."}],"why":[{"type":"p","html":"The legal form decides who survives, what happens to liabilities and contracts, and how shareholders are paid, which is why bankers care even when the press uses the words loosely."}],"push":[{"q":"“Why would a buyer prefer an asset deal to a share deal?”","a":[{"type":"p","html":"It can pick which assets and liabilities to take and leave historic liabilities behind, and in some jurisdictions it gets a tax step-up on the assets. The downside is that contracts and licences often need consent to transfer."}]},{"q":"“What is a merger of equals?”","a":[{"type":"p","html":"A deal between companies of similar size, often all-stock with little or no premium, where shareholders of both sides end up with comparable stakes and board seats are shared."}]}],"q_text":"What is the legal difference between a merger and an acquisition?","n":80},{"section":"05","group":null,"reported":null,"answer":[{"type":"p","html":"To grow faster than it could organically, enter new markets or products, gain market share, acquire technology or talent, or achieve cost and revenue synergies. Sometimes buying is cheaper and faster than building, and sometimes the motive is defensive."}],"why":[{"type":"p","html":"An acquisition makes sense when the target is worth more inside the buyer than on its own, by more than the premium paid."}],"push":[{"q":"“Why do so many acquisitions destroy value?”","a":[{"type":"p","html":"Overpaying, overestimating synergies, integration problems and culture clashes."}]}],"q_text":"Why would a company acquire another?","n":81},{"section":"05","group":null,"reported":null,"answer":[{"type":"p","html":"Compare the after-tax cost of each funding source with the target's earnings yield, which is the target's net income divided by the purchase price, or 1 ÷ purchase P/E. The cost of stock is the acquirer's earnings yield, 1 ÷ acquirer P/E. The cost of cash is the interest income given up, after tax. The cost of debt is the interest rate after tax. If the weighted cost of funding is below the target's earnings yield, the deal is accretive."}],"why":[{"type":"p","html":"You are buying a stream of earnings. If the funding costs you less in earnings than the target adds, EPS rises."}],"push":[{"q":"“Is there a shortcut for an all-stock deal?”","a":[{"type":"p","html":"Yes. If the acquirer's P/E is higher than the purchase P/E paid for the target, an all-stock deal is accretive."}]}],"q_text":"How can you tell quickly whether a deal is accretive or dilutive?","n":82},{"section":"05","group":null,"reported":null,"answer":[{"type":"p","html":"Cash is usually cheapest if the acquirer has a surplus, because the interest given up is low. Debt is next, though it adds leverage and can hurt the credit rating. Stock is usually the most expensive and dilutes ownership, but it makes sense when the acquirer's shares are highly valued, the deal is very large or the balance sheet cannot take more debt."}],"why":[{"type":"p","html":"The acquirer weighs cost against risk and flexibility."}],"push":[{"q":"“Which would the seller prefer?”","a":[{"type":"p","html":"Cash, for certainty. Stock lets the seller share in upside but leaves them exposed to the acquirer's share price."}]}],"q_text":"How does an acquirer decide between cash, debt and stock?","n":83},{"section":"05","group":null,"reported":null,"answer":[{"type":"p","html":"The target's assets and liabilities are marked to fair value, new intangible assets such as customer relationships and brands are recognised, and whatever remains of the purchase price above net assets becomes goodwill. Write-ups create extra depreciation and amortisation, which reduces combined net income."}],"why":[{"type":"p","html":"The acquirer's balance sheet must reflect what it paid and what it got."}],"push":[{"q":"“Why do deferred tax liabilities appear?”","a":[{"type":"p","html":"In a share purchase, write-ups raise the book value of assets but not their tax value. The gap between book and tax bases is recorded as a deferred tax liability."}]}],"q_text":"What happens in a purchase price allocation?","n":84},{"section":"05","group":null,"reported":null,"answer":[{"type":"p","html":"Goodwill is not amortised. It stays on the balance sheet until it is impaired or the business is sold. Other intangible assets, such as customer relationships and technology, are identified separately and usually amortised over their useful lives, which reduces pre-tax income. Some, such as brands with no fixed life, are not amortised but tested for impairment."},{"type":"p","html":"Two other items can matter. Acquired in-process R&amp;D, which IFRS 3 recognises as an intangible asset. And a deferred revenue write-down, where under IFRS the target's deferred revenue is marked to fair value, often below book, so some revenue never reaches the combined income statement."}],"why":[{"type":"p","html":"Identifiable intangibles have a separate value and a life. Goodwill is the leftover after everything identifiable is valued."}],"push":[{"q":"“Why do bankers care about amortisation of intangibles?”","a":[{"type":"p","html":"It lowers combined net income and makes a deal less accretive, so it goes into the merger model."}]}],"q_text":"What is the difference between goodwill and other intangible assets, and is there anything else intangible that can affect the combined company?","n":85},{"section":"05","group":null,"reported":null,"answer":[{"type":"p","html":"<b>Revenue synergies.<\/b> The combined company sells more, for example cross-selling products to each other's customers or selling into new regions."},{"type":"p","html":"<b>Cost synergies.<\/b> The combined company spends less, for example by closing duplicate offices, cutting overlapping roles, and buying in bulk."},{"type":"p","html":"In the model, revenue synergies are added to combined revenue with an assumed margin, and cost synergies reduce combined COGS or operating expenses. Both raise pre-tax income and EPS."},{"type":"p","html":"Cost synergies matter far more. They are within management's control and easier to plan, while revenue synergies depend on customers and are often never delivered."}],"why":[{"type":"p","html":"Buyers pay for synergies upfront in the premium, so the ones that can be delivered are the ones that justify the price."}],"push":[{"q":"“What gets missed when modelling synergies?”","a":[{"type":"p","html":"The one-off cost of achieving them, such as redundancy payments, and the time they take to phase in."}]}],"q_text":"What are synergies, how do they enter a merger model, and which matter more?","n":86},{"section":"05","group":null,"reported":null,"answer":[{"type":"p","html":"No. A deal can be accretive purely because debt is cheap, even if the acquirer overpays. Better tests are whether the return on the investment beats the acquirer's WACC, whether ROIC exceeds the cost of capital, and whether the price is below the target's value including realistic synergies. Private acquirers ignore EPS altogether."}],"why":[{"type":"p","html":"EPS measures accounting earnings per share in the short term, which can diverge from value created."}],"push":[{"q":"“Why are synergies so often overstated?”","a":[{"type":"p","html":"Revenue synergies are speculative, cost synergies take years and cost money to achieve, and models often ignore integration costs and timing. Bankers trust cost synergies more, because they are within management's control."}]}],"q_text":"Is EPS accretion enough to judge whether a deal is good?","n":87},{"section":"05","group":null,"reported":null,"answer":[{"type":"p","html":"Take the combined company's LTM EBITDA, find the typical debt-to-EBITDA ratio for comparable companies and recent deals, and apply it to get a rough figure. Look at debt comps for similar companies to see what types of debt and how many tranches they used. Then check interest cover, and for a rated acquirer whether the extra debt would push it down a credit rating."}],"why":[{"type":"p","html":"Lenders size debt on what the cash flows can support, and comparable deals show what lenders have accepted recently."}],"push":[{"q":"“Why does the credit rating matter?”","a":[{"type":"p","html":"A downgrade raises the cost of all the company's debt, and dropping below investment grade can shut it out of some markets."}]}],"q_text":"How much debt could a company raise to fund an acquisition?","n":88},{"section":"05","group":null,"reported":null,"answer":[{"type":"p","html":"Start from the undisturbed share price and add a control premium, often 20% to 40%, supported by comps, precedents, a DCF and LBO analysis. In the UK, the Takeover Code governs the process, and once an approach becomes public the bidder normally has 28 days to announce a firm offer or walk away."}],"why":[{"type":"p","html":"Shareholders will not hand over control at the market price, and the buyer can justify a premium with synergies and control of the cash flows."}],"push":[{"q":"“Why pay a premium at all?”","a":[{"type":"p","html":"Without one, shareholders have no reason to sell. Competing bidders push the price up further."}]}],"q_text":"How is the purchase price set for a listed target?","n":89},{"section":"05","group":null,"reported":null,"answer":[{"type":"p","html":"Overpaying creates a large amount of goodwill and intangibles. If the deal goes badly, the acquirer later takes a large impairment. eBay bought Skype in 2005 and wrote down about $1.4bn of it in 2007. HP bought the UK software company Autonomy in 2011 and took an $8.8bn write-down the next year."},{"type":"p","html":"In the all-stock case, the buyer's share price falls by roughly the £50m of value lost, spread across its shares, so it does not halve. Because the seller was paid in those shares, the seller effectively receives less than it negotiated."}],"why":[{"type":"p","html":"Goodwill records the premium paid. When the premium turns out to be unjustified, the write-down records the loss."}],"push":[{"q":"“How can a seller protect itself in an all-stock deal?”","a":[{"type":"p","html":"Through a collar or a fixed value per share, where the number of shares issued adjusts within a range so the value received stays more stable."}]}],"q_text":"A company overpays for another. What happens afterwards? And if a buyer pays £100m in an all-stock deal and the market decides it's worth £50m, what happens?","n":90},{"section":"05","group":null,"reported":null,"answer":[{"type":"p","html":"It is a sanity check. No board does a deal because a model shows 21% accretion. The model tells them whether a deal can work and at what price, and it shows how far they can go before EPS turns dilutive."},{"type":"p","html":"The usual sensitivities are purchase price, the mix of cash, stock and debt, and revenue and cost synergies. Typical tables show accretion or dilution for purchase price against cost synergies, purchase price against revenue synergies, and purchase price against percentage of cash. Operating changes such as growth and margins are usually run as scenarios."}],"why":[{"type":"p","html":"The model frames the negotiation by showing the price and structure at which the deal stops working for shareholders."}],"q_text":"What role does a merger model play in negotiations, and which sensitivities would you run?","push":[],"n":91},{"section":"05","group":"Merger model drills","reported":null,"answer":[{"type":"p","html":"<b>1. Purchase price.<\/b> The target's equity value plus the premium."},{"type":"p","html":"<b>2. Funding.<\/b> Cash costs the interest given up, after tax. Debt costs new interest, after tax. Stock means new shares, found by dividing the stock-funded amount by the acquirer's share price."},{"type":"p","html":"<b>3. Pro forma net income.<\/b> Acquirer net income + target net income − after-tax foregone interest − after-tax new interest + after-tax synergies − after-tax amortisation of write-ups."},{"type":"p","html":"<b>4. Pro forma EPS.<\/b> Pro forma net income ÷ (existing shares + new shares). Compare with the acquirer's standalone EPS."},{"type":"p","html":"<b>5. Check with yields.<\/b> The deal is accretive if the target's earnings yield, target net income ÷ purchase price, beats the weighted after-tax cost of funding. The cost of stock is 1 ÷ acquirer P/E."}],"why":[{"type":"p","html":"Accretion asks one thing. Do the target's earnings cover what the funding costs the acquirer's shareholders? The yield check answers it in one line, and the full method gives the percentage."}],"push":[{"q":"“Why does the yield shortcut ignore synergies?”","a":[{"type":"p","html":"It compares only the target's standalone earnings with funding costs. Add after-tax synergies to the target's earnings to include them."}]},{"q":"“Why use the purchase price, with premium, in the target's yield?”","a":[{"type":"p","html":"The acquirer pays the premium, so its return is the target's earnings on what it paid, not on the market value before the deal."}]}],"q_text":"How do you run a merger model on paper?","n":92},{"section":"05","group":"Merger model drills","reported":null,"answer":[{"type":"p","html":"The acquirer issues £600m ÷ £20 = 30m shares. Combined net income is £150m on 130m shares, so EPS is about £1.15 against £1.00 standalone. The deal is about 15% accretive."}],"why":[{"type":"p","html":"The acquirer's cost of stock is 1 ÷ 20 = 5%, below the target's earnings yield of 50 ÷ 600 ≈ 8.3%."}],"push":[{"q":"“What if it's funded with debt at 6%, 25% tax?”","a":[{"type":"p","html":"Interest is £36m, or £27m after tax. Combined net income is £123m on 100m shares, so EPS is £1.23 and the deal is 23% accretive."}]},{"q":"“At what interest rate would debt make it dilutive?”","a":[{"type":"p","html":"When the after-tax cost exceeds 8.3%, so a pre-tax rate above 8.3% ÷ 0.75 ≈ 11.1%."}]}],"q_text":"Acquirer: net income £100m, 100m shares at £20, so a P/E of 20x. Target: net income £50m, bought for £600m, all in stock. Accretive or dilutive?","n":93},{"section":"05","group":"Merger model drills","reported":null,"answer":[{"type":"p","html":"The acquirer issues 60m shares. Combined net income is £140m on 160m shares, so EPS is £0.875, about 12.5% dilutive."},{"type":"p","html":"To keep EPS at £1.00 on 160m shares you need £160m of net income, so £20m more after tax. Pre-tax synergies needed are £20m ÷ 0.75 ≈ £26.7m."}],"why":[{"type":"p","html":"The acquirer pays 15x for the target with stock valued at 10x, so the cost of stock, 10%, exceeds the target's yield of 40 ÷ 600 ≈ 6.7%."}],"q_text":"Acquirer: net income £100m, 100m shares at £10, so a P/E of 10x. Target: net income £40m, bought for £600m, all in stock. What happens, and what synergies would you need to break even?","push":[],"n":94},{"section":"05","group":"Merger model drills","reported":null,"answer":[{"type":"p","html":"<b>Standalone EPS.<\/b> £200m ÷ 100m = £2.00, so the acquirer's P/E is 10x."},{"type":"p","html":"<b>Debt.<\/b> £150m at 8% is £12m of interest, £9m after tax."},{"type":"p","html":"<b>Stock.<\/b> £150m ÷ £20 = 7.5m new shares."},{"type":"p","html":"<b>Pro forma.<\/b> Net income is £200m + £30m − £9m = £221m on 107.5m shares, so EPS is about £2.056. The deal is about 2.8% accretive."},{"type":"p","html":"<b>Yield check.<\/b> The target's yield is £30m ÷ £300m = 10%. After-tax debt costs 6% and stock costs 1 ÷ 10 = 10%, so the blend is 8%. 8% is below 10%, so it is accretive."}],"why":[{"type":"p","html":"The debt half is cheap at 6% after tax. The stock half costs 10%, the same as the target's yield, so it adds nothing. All the accretion comes from the debt."}],"push":[{"q":"“Would it be accretive all in stock?”","a":[{"type":"p","html":"No, it would be neutral. The acquirer and the purchase price are both at 10x, so the cost of stock equals the target's yield."}]},{"q":"“At what interest rate does the deal turn dilutive?”","a":[{"type":"p","html":"When the blended cost passes 10%, so when after-tax debt costs more than 10%, a pre-tax rate above about 13.3%."}]}],"q_text":"The acquirer trades at £20 a share with 100m shares and £200m of net income. It pays £300m for a target earning £30m, half in debt at 8% and half in new stock, with 25% tax. Accretive or dilutive, and by how much?","n":95},{"section":"05","group":"Merger model drills","reported":null,"answer":[{"type":"p","html":"<b>Standalone EPS.<\/b> £500m ÷ 250m = £2.00."},{"type":"p","html":"<b>Foregone interest.<\/b> £300m × 4% = £12m, £9m after tax."},{"type":"p","html":"<b>New interest.<\/b> £600m × 7% = £42m, £31.5m after tax."},{"type":"p","html":"<b>Synergies.<\/b> £20m pre-tax, £15m after tax."},{"type":"p","html":"<b>Amortisation.<\/b> £16m pre-tax, £12m after tax."},{"type":"p","html":"<b>Pro forma.<\/b> £500m + £60m − £9m − £31.5m + £15m − £12m = £522.5m. No new shares, so EPS is £522.5m ÷ 250m = £2.09, about 4.5% accretive."}],"why":[{"type":"p","html":"Without synergies or amortisation, net income would be £519.5m and EPS about £2.08. Synergies add £15m and amortisation takes £12m away, so they roughly cancel here."}],"push":[{"q":"“Check it with yields.”","a":[{"type":"p","html":"The target's yield is £60m ÷ £900m ≈ 6.7%. Cash costs 3% after tax and debt 5.25%, so the weighted cost is (300 × 3% + 600 × 5.25%) ÷ 900 = 4.5%. Below 6.7%, so accretive."}]},{"q":"“Why does amortisation of write-ups matter so much?”","a":[{"type":"p","html":"It is a permanent annual charge against net income, so it can turn a marginal deal dilutive."}]}],"q_text":"The acquirer has £500m of net income, 250m shares and a £30 share price. It buys a target earning £60m for £900m, using £300m of cash that earns 4% and £600m of new debt at 7%. It expects £20m of pre-tax cost synergies, and the write-ups add £16m of pre-tax amortisation a year. Tax is 25%. What happens to EPS?","n":96},{"section":"05","group":"Merger model drills","reported":null,"answer":[{"type":"p","html":"Standalone EPS is £150m ÷ 200m = £0.75, so the acquirer's P/E is 20x. An all-stock deal is EPS neutral when the purchase P/E equals the acquirer's P/E, so the most it can pay is £40m × 20 = £800m."},{"type":"p","html":"Check. £800m ÷ £15 is about 53.3m new shares. Combined net income of £190m on 253.3m shares is £0.75."},{"type":"p","html":"The target's shareholders own 53.3m ÷ 253.3m, about 21% of the combined company, the same share as their 21% of combined earnings."}],"why":[{"type":"p","html":"In an all-stock deal, paying the acquirer's own P/E swaps earnings for shares at the same rate, so EPS does not move."}],"push":[{"q":"“What is a contribution analysis?”","a":[{"type":"p","html":"A comparison of how much revenue, EBITDA and net income each side brings with the ownership split it receives. In a merger of equals it shows whether either side is giving too much away."}]},{"q":"“What synergies would justify paying £900m?”","a":[{"type":"p","html":"At £900m, 60m new shares give 260m in total. Keeping EPS at £0.75 needs £195m of net income, £5m more after tax, so about £6.7m of pre-tax synergies."}]}],"q_text":"The acquirer has 200m shares at £15 and net income of £150m. The target earns £40m. What is the most the acquirer can pay in an all-stock deal without diluting EPS, and how much of the combined company would the target's shareholders own?","n":97},{"section":"05","group":"Merger model drills","reported":null,"answer":[{"type":"p","html":"<b>a.<\/b> Acquirer at 12x P/E buys a target at 15x, all stock. Dilutive. The cost of stock is 8.3% against a target yield of 6.7%."},{"type":"p","html":"<b>b.<\/b> Same deal, all debt at 6% pre-tax. Accretive. After-tax debt costs 4.5%, below 6.7%."},{"type":"p","html":"<b>c.<\/b> Same deal, all cash that earned 2%. Accretive. Foregone interest costs 1.5% after tax."},{"type":"p","html":"<b>d.<\/b> Acquirer at 25x buys a target at 20x, all stock. Accretive. Stock costs 4% against a 5% yield."},{"type":"p","html":"<b>e.<\/b> Acquirer at 10x, half stock and half debt at 8%, buying a target at 11x. Stock costs 10%, debt 6% after tax, so the blend is 8% against a 9.1% yield. Accretive."},{"type":"p","html":"<b>f.<\/b> Acquirer at 8x buys a target at 10x with debt at 15%. After-tax debt costs 11.25% against a 10% yield. Dilutive."}],"why":[{"type":"p","html":"Every case is the same comparison, the weighted after-tax cost of funding against the target's earnings yield at the purchase price."}],"push":[{"q":"“Why can an accretive deal still be a bad one?”","a":[{"type":"p","html":"Accretion can come purely from cheap debt even when the buyer overpays. Q87 covers the better tests."}]}],"q_text":"Rapid fire. Accretive or dilutive?","n":98},{"section":"06","group":null,"reported":null,"answer":[{"type":"p","html":"Set the purchase price and the sources and uses, meaning how much debt and equity fund the price plus fees. Project the company's financials and free cash flow. Use that cash to pay interest and repay debt. At exit, apply a multiple to final-year EBITDA to get enterprise value, subtract remaining net debt to get equity value, and compare it with the initial equity to calculate the money multiple and IRR."}],"why":[{"type":"p","html":"The model asks what return the sponsor earns on its equity at a given price and debt package."}],"q_text":"Walk me through an LBO model.","push":[],"n":99},{"section":"06","group":null,"reported":"London summer analyst, technical round. The interviewer then spent about 15 minutes on LBO assumptions.","answer":[{"type":"p","html":"A sponsor buys a company using mostly debt and some equity, runs it for about five years, then sells it. The model starts with <b>sources and uses<\/b>. Uses are the purchase price for the equity, refinancing the target's existing debt, and transaction and financing fees. Sources are the new debt tranches, any cash on the target's balance sheet, and the sponsor's equity, which plugs the gap."},{"type":"p","html":"Next comes the <b>opening balance sheet<\/b>. You remove the target's old equity, add the new debt and sponsor equity, and record goodwill for the excess of the price over the fair value of net assets."},{"type":"p","html":"Then you <b>project the income statement and cash flows<\/b> for the hold period. Free cash flow after interest goes to mandatory debt repayments first, then to optional repayments through a cash sweep, keeping a minimum cash balance and drawing the revolver if cash runs short."},{"type":"p","html":"At <b>exit<\/b>, final-year EBITDA times the exit multiple gives enterprise value. Subtract remaining net debt for exit equity value, then compare it with the sponsor's initial equity for the money multiple and IRR."}],"why":[{"type":"p","html":"Each step answers one question. Sources and uses shows how the deal is paid for, the projections show whether the company can carry the debt, and the exit shows what the equity is worth at the end. Interviewers asking for depth want to hear sources and uses, the debt schedule and the returns calculation in that order."}],"push":[{"q":"“Why does the sponsor's equity act as the plug in sources and uses?”","a":[{"type":"p","html":"The price and the amount lenders will provide are set first, based on valuation and on how much leverage the cash flows support. Whatever is left must come from the sponsor."}]},{"q":"“Why do mandatory repayments come before the cash sweep?”","a":[{"type":"p","html":"Mandatory amortisation is a contractual obligation. The sweep only uses cash left after that, and lenders often require a percentage of excess cash to go to repayments."}]},{"q":"“Why might interest be circular in the model?”","a":[{"type":"p","html":"Interest depends on the debt balance, the debt balance depends on cash available for repayment, and that cash depends on interest. Most models use average balances and turn on iterative calculation, or use opening balances to avoid the loop."}]}],"q_text":"Describe in depth how an LBO model works.","n":100},{"section":"06","group":null,"reported":null,"answer":[{"type":"p","html":"A private equity firm buys a company using a large amount of debt and a smaller equity cheque, uses the company's cash flow to pay interest and repay debt, then sells after roughly three to seven years. Leverage increases returns because the firm puts in less equity, so any rise in value is earned on a smaller base."}],"why":[{"type":"p","html":"Buy a £500,000 house with a £100,000 deposit and sell it for £600,000, and you have made £100,000 on £100,000, a 100% return, against 20% if you had paid all cash."}],"push":[{"q":"“Does leverage cut both ways?”","a":[{"type":"p","html":"Yes. If the value falls, the equity is wiped out much faster."}]}],"q_text":"What is an LBO, and why does it work?","n":101},{"section":"06","group":null,"reported":null,"answer":[{"type":"p","html":"Pay less at entry, use more leverage, grow EBITDA through revenue growth or margin improvement, sell at a higher multiple than it paid, and use cash flow to pay down debt. A dividend recap can also raise IRR by returning cash early."}],"why":[{"type":"p","html":"Returns come from the gap between what the equity costs at entry and what it is worth at exit, and each lever widens that gap."}],"push":[{"q":"“Which lever is most reliable?”","a":[{"type":"p","html":"EBITDA growth and debt paydown, because multiple expansion depends on market conditions at exit."}]},{"q":"“Which assumptions move returns most?”","a":[{"type":"p","html":"Purchase and exit multiples, leverage and EBITDA growth."}]}],"q_text":"How can a private equity firm increase its returns?","n":102},{"section":"06","group":null,"reported":"Follow-up reported after the LBO walkthrough in a London summer analyst interview.","answer":[{"type":"p","html":"<b>Purchase multiple.<\/b> Set from comps and precedent transactions, plus the premium needed to win the process."},{"type":"p","html":"<b>Leverage.<\/b> Usually expressed as a multiple of EBITDA, set by what lenders will provide for that sector and credit profile, often somewhere around 4x to 6x for a stable business."},{"type":"p","html":"<b>Interest rates.<\/b> A base rate such as SONIA plus a margin for floating-rate loans, or a fixed coupon for bonds."},{"type":"p","html":"<b>Operating forecasts.<\/b> Revenue growth, margins, capex and working capital, based on history, management's plan and a downside case."},{"type":"p","html":"<b>Exit multiple and timing.<\/b> Usually a five-year hold, with the exit multiple set at or below the entry multiple to stay conservative."},{"type":"p","html":"<b>Other items.<\/b> Minimum cash, fees, and the tax rate."}],"why":[{"type":"p","html":"Returns are driven by the entry price, how much debt replaces equity, EBITDA growth and the exit price. The assumptions above set each of those, so they are what an interviewer probes."}],"push":[{"q":"“Why set the exit multiple no higher than the entry multiple?”","a":[{"type":"p","html":"Assuming the multiple rises means relying on market conditions in five years, which the sponsor cannot control. Returns should work without it."}]},{"q":"“Rates rise by 2%. What happens to the LBO?”","a":[{"type":"p","html":"Interest costs rise, less cash is left to repay debt, and lenders offer less leverage because coverage ratios get tighter. The sponsor has to put in more equity or pay a lower price, and IRR falls."}]},{"q":"“How would you sanity-check the leverage?”","a":[{"type":"p","html":"Look at interest cover, EBITDA divided by interest, and whether the company can repay a meaningful share of debt over the hold in a downside case."}]}],"q_text":"Talk me through the key assumptions in an LBO and how you would set each one.","n":103},{"section":"06","group":null,"reported":null,"answer":[{"type":"p","html":"Stable, predictable cash flows to service the debt, low capex needs, a strong market position, little existing debt, room for operational improvement, a reasonable price and a clear exit route. Strong management helps."}],"why":[{"type":"p","html":"Every feature on that list either supports the debt or improves the exit."}],"push":[{"q":"“Why are early-stage tech companies poor candidates?”","a":[{"type":"p","html":"Volatile or negative cash flows cannot support debt repayments."}]}],"q_text":"What makes a good LBO candidate?","n":104},{"section":"06","group":null,"reported":null,"answer":[{"type":"p","html":"It shows the most a financial buyer could pay and still hit its target IRR, typically 20% to 25%. Strategic buyers can usually pay more because of synergies, so in a sale process the LBO value often acts as a floor."}],"why":[{"type":"p","html":"It answers what a sponsor can afford, which matters whenever PE firms are likely bidders."}],"q_text":"Why is an LBO analysis used as a valuation method?","push":[],"n":105},{"section":"06","group":null,"reported":null,"answer":[{"type":"p","html":"A PE firm holds the company for only three to seven years, so it cares about the return on its equity more than the long-run cost of debt. The debt is borrowed by the company and serviced from its own cash flows, so the sponsor does not repay it out of its own pocket. Less equity in means a higher return on the equity that is in."}],"why":[{"type":"p","html":"Leverage raises the return on equity as long as the business earns more than the cost of the debt and can service it."}],"push":[{"q":"“What does the sponsor risk?”","a":[{"type":"p","html":"Its equity. If the company cannot service the debt, lenders can take control and the equity can be wiped out."}]}],"q_text":"A strategic acquirer usually prefers to pay cash. Why does a PE firm use so much debt?","n":106},{"section":"06","group":null,"reported":null,"answer":[{"type":"p","html":"No. You need an income statement, a debt schedule that tracks each tranche, and enough of a cash flow statement to show how much cash is free to repay debt. A full balance sheet can be skipped by assuming a net change in working capital instead of forecasting each item."}],"why":[{"type":"p","html":"The question an LBO answers is how much cash is available to service debt and what the equity is worth at exit, and those three pieces answer it."}],"push":[{"q":"“When would you build the full balance sheet?”","a":[{"type":"p","html":"When it matters for covenants, such as tests based on net assets, or when the client wants a full model."}]}],"q_text":"Do you need to project all three statements in an LBO model? Are there shortcuts?","n":107},{"section":"06","group":null,"reported":null,"answer":[{"type":"p","html":"A revolving credit facility for working capital needs. Senior secured term loans, with Term Loan A amortising and Term Loan B mostly repaid at maturity. High-yield bonds, which are fixed-rate and often unsecured. Mezzanine or PIK notes at the junior end. In Europe, private credit funds increasingly provide unitranche loans that replace separate senior and junior debt."}],"why":[{"type":"p","html":"Debt that ranks higher is cheaper and comes with tighter terms, and junior debt pays more to compensate for its extra risk."}],"push":[{"q":"“Why might a sponsor choose high-yield bonds over term loans?”","a":[{"type":"p","html":"Bonds usually come with longer maturities and lighter covenants, at the cost of a higher rate and restrictions on early repayment."}]}],"q_text":"What types of debt might a PE firm use?","n":108},{"section":"06","group":null,"reported":null,"answer":[{"type":"p","html":"It depends on the company, the sector and the market, so you look at debt comps for similar recent deals. The main measures are total debt to EBITDA, senior debt to EBITDA, interest cover, which is EBITDA ÷ interest, and the fixed charge coverage ratio. For a stable business, total leverage is typically a mid single-digit multiple of EBITDA, and lenders want interest cover comfortably above 2x. Nobody lends 50x EBITDA."}],"why":[{"type":"p","html":"Leverage shows how much debt the company carries against its earnings, and coverage shows whether it can pay the interest."}],"push":[{"q":"“Why would a software company get more leverage than a restaurant chain with the same EBITDA?”","a":[{"type":"p","html":"Recurring subscription revenue is more predictable and capex is lower, so lenders trust the cash flows more."}]}],"q_text":"What are reasonable leverage and coverage ratios in an LBO?","n":109},{"section":"06","group":null,"reported":null,"answer":[{"type":"p","html":"High-yield debt pays a higher rate, usually fixed, has incurrence covenants, is repaid at maturity and often cannot be repaid early without a penalty. Bank debt is cheaper, usually floating, has maintenance covenants tested every quarter, and is often amortised over its life."},{"type":"p","html":"A sponsor uses more bank debt when it wants the lower cost, is worried about meeting interest payments, or plans major expansion or capex and does not want to be limited by the incurrence covenants on bonds. It uses more high-yield when it wants flexibility, plans to refinance later, and its returns are not too sensitive to interest costs."}],"why":[{"type":"p","html":"The choice trades cost against flexibility. Cheaper debt comes with tighter terms."}],"push":[{"q":"“Where does private credit fit?”","a":[{"type":"p","html":"Unitranche loans from private credit funds sit between the two, with one floating rate and lighter covenants than bank debt, and they now fund many mid-market European buyouts, see Q137."}]}],"q_text":"What's the difference between bank debt and high-yield debt, and when would a sponsor use each?","n":110},{"section":"06","group":null,"reported":null,"answer":[{"type":"p","html":"Almost every industry has mature companies with stable cash flow. Software businesses with recurring subscription revenue are now among the most common buyout targets. Sponsors also buy in risky sectors to consolidate the industry by buying several competitors, to turn around a struggling company, or to carve out a division a larger company wants to sell."}],"why":[{"type":"p","html":"The test is whether the specific company's cash flows can support debt, not how its sector is labelled."}],"q_text":"Why would a private equity firm buy a company in a risky industry such as technology?","push":[],"n":111},{"section":"06","group":null,"reported":null,"answer":[{"type":"p","html":"Interest is tax deductible, so debt reduces the company's tax bill. £100m of debt at 8% costs £8m of interest and saves £2m of tax at 25%, so the after-tax cost is £6m. Cash flow is still lower than with no debt, because the interest costs more than the tax it saves."}],"why":[{"type":"p","html":"The government effectively pays part of the interest, which is one reason debt is cheaper than equity."}],"push":[{"q":"“Is the tax shield unlimited in the UK?”","a":[{"type":"p","html":"No. The corporate interest restriction generally caps net interest deductions at 30% of tax-adjusted EBITDA for groups with more than £2m of net interest a year."}]}],"q_text":"What is the tax shield in an LBO?","n":112},{"section":"06","group":null,"reported":null,"answer":[{"type":"p","html":"The company raises new debt and uses it to pay a large dividend to its owner, the PE firm."},{"type":"p","html":"It returns cash to the sponsor early without selling the company, which raises IRR, and lets the sponsor recover part of its equity while keeping control."},{"type":"p","html":"<b>Income statement.<\/b> No change at the time of the recap. Future interest expense rises."},{"type":"p","html":"<b>Cash flow statement.<\/b> In financing, the new debt raised and the dividend paid cancel out, so the net change in cash is zero."},{"type":"p","html":"<b>Balance sheet.<\/b> Debt goes up and shareholders' equity goes down by the same amount, so it balances. This is one way book equity turns negative, see Q11."}],"why":[{"type":"p","html":"IRR rewards getting cash back sooner, so moving part of the payout forward lifts IRR even if the total cash returned stays the same. Q121 shows the numbers."}],"push":[{"q":"“What is the risk?”","a":[{"type":"p","html":"The company carries more debt, so it has less room if trading weakens."}]}],"q_text":"What is a dividend recap, why would a PE firm do one, and how does it hit the three statements?","n":113},{"section":"06","group":"Paper LBO drills","reported":null,"answer":[{"type":"p","html":"<b>1. Entry.<\/b> Entry EV = EBITDA × entry multiple. Split it into debt and sponsor equity, and add fees to the uses if they are given."},{"type":"p","html":"<b>2. Grow EBITDA<\/b> to the exit year at the rate given."},{"type":"p","html":"<b>3. Debt paydown.<\/b> Free cash flow = EBITDA − interest − tax − capex − increase in working capital. Interviewers often give you the total repaid. If not, work out FCF year by year with interest on the opening balance."},{"type":"p","html":"<b>4. Exit.<\/b> Exit EV = exit EBITDA × exit multiple. Subtract remaining net debt for exit equity."},{"type":"p","html":"<b>5. Returns.<\/b> MOIC = exit equity ÷ entry equity. Convert to IRR with the shortcuts below."},{"type":"p","html":"<b>6. Attribution.<\/b> Split the equity gain into EBITDA growth × entry multiple, change in multiple × exit EBITDA, and debt paydown. The three add up to the total gain."},{"type":"table","rows":[["MOIC","3 years","5 years"],["1.5x","≈ 14%","≈ 8%"],["2.0x","≈ 26%","≈ 15%"],["2.5x","≈ 36%","≈ 20%"],["3.0x","≈ 44%","≈ 25%"]]}],"why":[{"type":"p","html":"Every LBO return comes from three places, buying cheaper than you sell, growing earnings and paying down debt. Following the same six steps every time keeps the mental arithmetic in order."}],"push":[{"q":"“Why does interest use the opening debt balance?”","a":[{"type":"p","html":"It avoids a circular calculation, since the closing balance depends on cash flow after interest. Models often use the average balance with iteration switched on."}]},{"q":"“What tips help on paper?”","a":[{"type":"p","html":"Write a small grid with entry, exit and the change. Round to easy numbers and say so. Give the MOIC first, then the IRR estimate."}]}],"q_text":"How do you run a paper LBO in an interview?","n":114},{"section":"06","group":"Paper LBO drills","reported":null,"answer":[{"type":"p","html":"The money multiple is total cash returned divided by cash invested. IRR accounts for time, so 2x in two years is a far higher IRR than 2x in seven. Funds report both."}],"why":[{"type":"p","html":"IRR rewards getting cash back quickly, while the money multiple shows how much cash came back in total."}],"push":[{"q":"“So which would you choose?”","a":[{"type":"p","html":"It depends on the fund. A quick flip can post a high IRR while returning little cash, so investors also look at the multiple. A large fund that needs to return big sums may prefer a higher multiple over a longer hold."}]}],"q_text":"What's the difference between IRR and the money multiple? Which would you rather have?","n":115},{"section":"06","group":"Paper LBO drills","reported":null,"answer":[{"type":"p","html":"2x in 3 years ≈ 26%. 2x in 5 years ≈ 15%. 2.5x in 5 years ≈ 20%. 3x in 5 years ≈ 25%. 3x in 3 years ≈ 44%. For doubling, the rule of 72 says years to double ≈ 72 ÷ annual return."}],"why":[{"type":"p","html":"Each figure is (multiple)<sup>1/years<\/sup> − 1, so for 3x over 5 years, 3<sup>0.2<\/sup> ≈ 1.25."}],"push":[{"q":"“Roughly what's the IRR on 2x over four years?”","a":[{"type":"p","html":"72 ÷ 4 = 18%, and the exact figure is about 19%."}]}],"q_text":"Give me some IRR shortcuts.","n":116},{"section":"06","group":"Paper LBO drills","reported":null,"answer":[{"type":"p","html":"Entry EV is £1,000m, with £600m of debt and £400m of equity. Exit EV is £1,300m and remaining debt is £300m, so exit equity is £1,000m. The equity has grown 2.5x over five years, roughly a 20% IRR."}],"why":[{"type":"p","html":"Returns came from EBITDA growth, £300m of value, and debt paydown, another £300m."}],"push":[{"q":"“What exit multiple gives a 25% IRR?”","a":[{"type":"p","html":"You need about 3.05x, so roughly £1,220m of equity. Add £300m of debt for an EV of about £1,520m, which on £130m of EBITDA is about 11.7x."}]},{"q":"“What if no debt is repaid?”","a":[{"type":"p","html":"Exit equity is £1,300m − £600m = £700m, 1.75x over five years, roughly 12%."}]}],"q_text":"A PE firm buys a company with £100m of EBITDA at 10x, funded 60% debt and 40% equity. Over five years EBITDA grows to £130m and the company repays £300m of debt. It exits at 10x. What's the IRR?","n":117},{"section":"06","group":"Paper LBO drills","reported":null,"answer":[{"type":"p","html":"<b>Entry.<\/b> EV £800m, debt £400m, equity £400m."},{"type":"p","html":"<b>Exit at 8x.<\/b> EV £1,200m. Debt left is £400m − £200m = £200m, so exit equity is £1,000m. MOIC is 2.5x over five years, about 20% IRR."},{"type":"p","html":"<b>Attribution.<\/b> The equity gain is £600m. EBITDA growth gives £50m × 8 = £400m, debt paydown £200m, and the multiple is unchanged so it adds nothing."},{"type":"p","html":"<b>Exit at 7x.<\/b> EV £1,050m, exit equity £850m, MOIC about 2.1x, roughly 16% IRR. Multiple contraction costs £150m, which is £150m of EBITDA × 1x."}],"why":[{"type":"p","html":"With the entry multiple held, returns come only from EBITDA growth and paydown. A one-turn fall in the exit multiple takes a sixth of the gain away here, which is why sponsors model exit at or below entry."}],"push":[{"q":"“What exit multiple gets you back to 20% with the lower EBITDA growth of £130m?”","a":[{"type":"p","html":"You need £1,000m of equity, so EV of £1,200m on £130m of EBITDA, about 9.2x."}]},{"q":"“What if no debt is repaid?”","a":[{"type":"p","html":"At 8x, exit equity is £1,200m − £400m = £800m, 2x, about 15%."}]}],"q_text":"A sponsor buys a company with £100m of EBITDA at 8x, funded 50% debt. EBITDA reaches £150m by year five, £200m of debt is repaid, and it exits at 8x. What are the MOIC, IRR and return attribution? Redo it with a 7x exit.","n":118},{"section":"06","group":"Paper LBO drills","reported":null,"answer":[{"type":"p","html":"With D&amp;A equal to capex and no working capital change, free cash flow equals net income."},{"type":"table","rows":[["","Year 1","Year 2","Year 3"],["EBITDA","110","120","130"],["EBIT (less 10 D&A)","100","110","120"],["Interest at 8%","40.0","36.4","32.0"],["Pre-tax income","60.0","73.6","88.0"],["Net income = FCF","45.0","55.2","66.0"],["Closing debt","455.0","399.8","333.8"]]},{"type":"p","html":"<b>Exit.<\/b> EV is £130m × 10 = £1,300m. Less £334m of debt leaves exit equity of about £966m."},{"type":"p","html":"<b>Returns.<\/b> MOIC is about 1.93x over three years. 2x in three years is about 26%, so the IRR is just under that, about 25%."}],"why":[{"type":"p","html":"Interest falls each year as debt is repaid, so free cash flow rises faster than EBITDA. That compounding paydown is what the full version tests."}],"push":[{"q":"“How much of the gain came from paydown?”","a":[{"type":"p","html":"Debt fell £166m and EBITDA growth added £30m × 10 = £300m. Together that is the £466m gain in equity."}]},{"q":"“What if the interest rate were 10%?”","a":[{"type":"p","html":"Year one interest would be £50m, net income £37.5m, and every later year would repay less, so IRR falls by a couple of points."}]}],"q_text":"Full paper LBO. A sponsor buys a company with £100m of EBITDA at 10x, with £500m of debt at 8% and £500m of equity. EBITDA grows £10m a year. D&A and capex are both £10m a year, working capital does not change, tax is 25%, and all free cash flow repays debt. Interest is on the opening balance. It exits after three years at 10x. What is the IRR?","n":119},{"section":"06","group":"Paper LBO drills","reported":null,"answer":[{"type":"p","html":"Work backwards. 20% over five years is about 2.5x."},{"type":"p","html":"Exit EV is £75m × 8 = £600m. Debt left is £200m − £100m = £100m, so exit equity is £500m."},{"type":"p","html":"The most equity the sponsor can put in is £500m ÷ 2.5 = £200m. Add the £200m of debt and the maximum entry EV is £400m, which is 8x EBITDA."}],"why":[{"type":"p","html":"An LBO valuation solves for the price. Fix the exit, apply the required multiple, and whatever equity is left plus the debt is the most a sponsor can pay. This is why an LBO is called a floor valuation in Q105."}],"push":[{"q":"“What if the sponsor only needed 15%?”","a":[{"type":"p","html":"15% over five years is about 2x, so equity of £250m and a maximum EV of £450m, 9x."}]},{"q":"“What if lenders offered £250m?”","a":[{"type":"p","html":"With the same £100m repaid, exit debt is £150m and exit equity £450m. At 2.5x the equity is £180m, so EV is £430m. More debt lets the sponsor pay more."}]}],"q_text":"A company has £50m of EBITDA growing to £75m in five years. A sponsor can borrow £200m at entry, expects to repay £100m, and will exit at 8x. It needs a 20% IRR. What is the most it can pay?","n":120},{"section":"06","group":"Paper LBO drills","reported":null,"answer":[{"type":"p","html":"<b>Entry.<\/b> Uses are £500m plus £10m of fees, so £510m. Debt is £300m, so sponsor equity is £210m."},{"type":"p","html":"<b>With the recap.<\/b> £100m back in year two. Exit EV £700m less £250m of debt leaves £450m in year five. Total cash back is £550m, a MOIC of about 2.6x, and the IRR is about 25%."},{"type":"p","html":"<b>Without the recap.<\/b> Assume the same debt paydown, so exit debt is £150m and exit equity £550m in year five. Same 2.6x MOIC, but all the cash arrives at the end, so the IRR is about 21%."}],"why":[{"type":"p","html":"The recap moves £100m forward by three years. MOIC ignores timing so it does not change, but IRR rewards early cash. Fees add to what the sponsor pays and lower both returns."}],"push":[{"q":"“Why might a sponsor's investors push back on a recap?”","a":[{"type":"p","html":"It raises IRR without raising the total cash returned, and it leaves the company with more debt."}]},{"q":"“Where do fees go in sources and uses?”","a":[{"type":"p","html":"In uses, alongside the purchase price, so they increase the equity the sponsor has to put in."}]}],"q_text":"A sponsor buys a company with £50m of EBITDA at 10x, pays £10m of fees, and borrows £300m. In year two it does a £100m dividend recap. At exit in year five EBITDA is £70m, the exit multiple is 10x and debt is £250m. Compare MOIC and IRR with and without the recap.","n":121},{"section":"07","group":null,"reported":"London investment banking analyst interview, March 2026.","answer":[{"type":"p","html":"Take unlevered free cash flow of £100, £110 and £121 over three years, a 10% WACC and 2% terminal growth."},{"type":"p","html":"<b>Present value of the cash flows.<\/b> £100 ÷ 1.1 ≈ £90.9, £110 ÷ 1.21 ≈ £90.9, £121 ÷ 1.331 ≈ £90.9, so about £273 in total."},{"type":"p","html":"<b>Terminal value.<\/b> £121 × 1.02 ÷ (10% − 2%) ≈ £123.4 ÷ 0.08 ≈ £1,543. Discounted at 1.331, that is about £1,159."},{"type":"p","html":"<b>Enterprise value.<\/b> About £273 + £1,159 ≈ £1,432. Subtract net debt for equity value and divide by diluted shares for a share price."}],"why":[{"type":"p","html":"A paper DCF tests whether you can run the mechanics without Excel. Using cash flows that grow at the same rate as WACC keeps every present value identical, which is an easy way to keep mental arithmetic clean. Terminal value makes up about 80% of the total here, which is typical."}],"push":[{"q":"“How would you approximate quickly without exact discount factors?”","a":[{"type":"p","html":"Round the discount factors to 0.91, 0.83 and 0.75 for years one to three at 10%, and state that you are rounding."}]},{"q":"“What if they give you EBITDA instead of free cash flow?”","a":[{"type":"p","html":"Ask for or assume D&amp;A, capex, working capital and the tax rate. Then EBIT × (1 − t) + D&amp;A − capex − change in working capital gives unlevered FCF."}]},{"q":"“What implied EBITDA multiple does your terminal value give?”","a":[{"type":"p","html":"Divide the terminal value by final-year EBITDA. If the answer is far from peers' multiples, one of the assumptions is wrong."}]}],"q_text":"Walk me through a paper DCF.","n":122},{"section":"07","group":null,"reported":"London summer analyst interview, reported July 2024.","answer":[{"type":"p","html":"Start with <b>liquidity<\/b>, meaning how much cash the company has and how long it lasts, using a 13-week cash flow forecast. Then look at the <b>capital structure<\/b>, listing every debt instrument by priority, maturity, security and covenants, and checking how close the company is to breaching a covenant or hitting a maturity wall. Next, work out <b>what has gone wrong<\/b>, whether the business has a temporary problem such as too much debt or a one-off shock, or a lasting one such as falling demand. Then"},{"type":"p","html":"<b>value the business<\/b> on a going-concern basis with lower multiples and a higher discount rate, and on a liquidation basis as a floor. Finally run the <b>waterfall<\/b> to see which creditor classes are covered and where the value runs out."}],"why":[{"type":"p","html":"A distressed company's value is no longer mainly about shareholders. The useful questions are whether it survives the next few months, whether the business is worth saving, and how much each creditor class would recover. The steps follow that order."}],"push":[{"q":"“How do you tell an over-levered good business from a bad business?”","a":[{"type":"p","html":"Look at operating performance before interest. If EBITDA, margins and market position are stable and the problem is the debt load, a balance sheet restructuring can fix it. If EBITDA itself is falling, the business needs operational change or a sale."}]},{"q":"“Which metrics would you look at first?”","a":[{"type":"p","html":"Cash runway, net debt to EBITDA, interest cover, the debt maturity profile and covenant headroom."}]},{"q":"“What's a fixed charge coverage ratio?”","a":[{"type":"p","html":"Earnings available to cover fixed charges, usually EBITDA less capex, divided by fixed charges such as interest and lease payments. Below about 1x the company cannot cover its fixed obligations from operations."}]}],"q_text":"How do you evaluate a distressed company?","n":123},{"section":"07","group":null,"reported":"London interviews in October 2026 and March 2026 both reported questions on the deal lifecycle and the steps in M&A.","answer":[{"type":"p","html":"<b>Pitch and mandate.<\/b> The bank pitches, is hired, and agrees fees in an engagement letter."},{"type":"p","html":"<b>Preparation.<\/b> The team builds the financial model and valuation, drafts a teaser and an information memorandum, and agrees a buyer list with the client."},{"type":"p","html":"<b>First round.<\/b> Interested buyers sign NDAs, receive the information memorandum, and submit non-binding indicative offers."},{"type":"p","html":"<b>Second round.<\/b> A shortlist gets data room access and management presentations, does due diligence, and submits binding offers with a mark-up of the sale and purchase agreement."},{"type":"p","html":"<b>Signing and closing.<\/b> The seller picks a buyer, negotiates final terms and signs. Closing follows once conditions such as regulatory and antitrust approvals are met."}],"why":[{"type":"p","html":"A structured auction keeps several buyers competing for as long as possible, which supports price, while narrowing the field so only serious bidders get sensitive information."}],"push":[{"q":"“How is a UK public takeover different?”","a":[{"type":"p","html":"It runs under the Takeover Code. Once an approach leaks, the bidder usually has 28 days to make a firm offer or walk away, and most recommended deals complete through a court-approved scheme of arrangement, which needs 75% by value of shareholders voting."}]},{"q":"“What does the analyst do in all this?”","a":[{"type":"p","html":"Builds and updates the model, drafts materials such as the information memorandum and buyer lists, manages the data room and tracks buyer contact and bids."}]},{"q":"“What changes on the buy side?”","a":[{"type":"p","html":"The bank screens targets, values them, structures the offer and financing, coordinates due diligence and negotiates terms for the buyer."}]}],"q_text":"Walk me through the steps of an M&A sale process.","n":124},{"section":"07","group":null,"reported":"Asked in a London interview at associate level. Included because the latest London summer analyst technicals focused on accounting.","answer":[{"type":"p","html":"IFRS 3 uses the acquisition method. You identify the acquirer and the acquisition date, then measure the consideration at fair value, including any contingent consideration such as an earn-out. The target's identifiable assets and liabilities are recorded at fair value, including intangibles the target never recognised itself, such as customer relationships and brands. Goodwill is the excess of the consideration plus any non-controlling interest over those net assets. Transaction costs are expensed, and goodwill is tested for impairment every year with no amortisation."}],"why":[{"type":"p","html":"The acquirer is buying assets at today's prices, so the balance sheet resets to fair value. Anything paid above the identifiable net assets has no separate home, which is why it becomes goodwill."}],"push":[{"q":"“What if the price is below fair value of net assets?”","a":[{"type":"p","html":"After rechecking the fair values, the difference is recognised as a gain on a bargain purchase in profit or loss."}]},{"q":"“How can NCI be measured under IFRS 3?”","a":[{"type":"p","html":"Either at fair value, which includes goodwill attributable to the minority, or at its proportionate share of net assets, which does not."}]},{"q":"“How do the write-ups affect future earnings?”","a":[{"type":"p","html":"Higher asset values mean higher depreciation and amortisation, which reduces reported profit after the deal."}]}],"q_text":"How is an acquisition accounted for under IFRS 3?","n":125},{"section":"07","group":null,"reported":"London summer intern interview, May 2026. The candidate was asked about Moelis deals in Europe and from the London office.","answer":[{"type":"p","html":"Moelis is a financial adviser to Qiagen, the Dutch molecular testing company, on its take-private by EQT, announced in October 2026 alongside Goldman Sachs. EQT is offering $52.22 per share, with ADIA and CPP Investments as co-investors, valuing the company at around $12bn including net debt. Qiagen's board backed the offer unanimously and completion is expected in mid-2027."},{"type":"p","html":"The rationale for EQT is a business selling the consumables and instruments used to extract and analyse DNA, RNA and proteins, which gives recurring revenue that suits a private equity owner. Qiagen has attracted interest for years, including a Thermo Fisher deal in 2020 that fell apart after the pandemic lifted its share price, and earlier interest in 2026 from Advent and KKR."}],"why":[{"type":"p","html":"The interviewer wants to see that you follow the firm's work and can explain a deal's logic and Moelis's role. Check the latest status the day before, because terms and timing can change."}],"push":[{"q":"“The premium was reported as about 8.6% over the last close. Isn't that low?”","a":[{"type":"p","html":"It is below typical UK and European takeover premiums of 20% to 40%. One explanation is that years of takeover interest had already lifted the share price, so the last close was not an undisturbed price."}]},{"q":"“What does a sell-side adviser do on a take-private?”","a":[{"type":"p","html":"Advises the board on value and alternatives, runs or responds to the process, negotiates price and terms, and supports the board's recommendation to shareholders."}]},{"q":"“What are the risks to completion?”","a":[{"type":"p","html":"Regulatory and antitrust approvals, shareholder approval, and financing for a deal of this size."}]}],"q_text":"Tell me about a deal Moelis has worked on in Europe.","n":126},{"section":"08","group":null,"reported":"PJT Partners London analyst interview.","answer":[{"type":"p","html":"Split it into two parts. The first is the straight bond, meaning the present value of the coupons and principal discounted at the yield the issuer would pay on ordinary debt. The second is the conversion option, which is a call option on the shares valued with Black–Scholes or a binomial model. Add the two together, then adjust for features such as issuer call rights or investor put rights. The bond floor and the conversion value, which is the conversion ratio times the share price, set the minimum value."}],"why":[{"type":"p","html":"A convertible holder owns debt plus the right to swap it for shares, so its value is the sum of both. The option is why convertibles pay a lower coupon than ordinary bonds."}],"push":[{"q":"“How do you treat a convertible in enterprise value?”","a":[{"type":"p","html":"If the share price is above the conversion price, treat it as converted and add the new shares to the diluted share count. If it is below, treat it as debt."}]},{"q":"“Why would a company issue a convertible?”","a":[{"type":"p","html":"To borrow at a lower coupon by giving investors equity upside, often when its shares are volatile or its credit rating would make ordinary debt expensive."}]}],"q_text":"How would you value a convertible bond?","n":127},{"section":"08","group":null,"reported":"PJT Partners London summer analyst interview.","answer":[{"type":"p","html":"If they have the same net income, EBITDA can differ because of everything between EBITDA and net income. One may own its assets and carry more depreciation, or have made acquisitions that create amortisation. One may carry more debt and pay more interest. Tax rates and one-off items can differ. Lease accounting also matters, since under IFRS 16 lease costs sit below EBITDA but under older rules or US GAAP operating leases sit above it."}],"why":[{"type":"p","html":"EBITDA is profit before interest, tax, depreciation and amortisation. Any difference in those lines lets two companies with identical bottom lines report different EBITDA."}],"push":[{"q":"“So which company is better?”","a":[{"type":"p","html":"You cannot tell from EBITDA alone. You would compare free cash flow, because a company with high EBITDA but heavy capex may generate less cash."}]},{"q":"“Why does this matter for valuation?”","a":[{"type":"p","html":"An EV/EBITDA multiple treats both companies as having different earning power. Comparing EV/EBIT or free cash flow yields gives a fairer picture."}]}],"q_text":"Two companies have the same profitability but different EBITDA. How can that be?","n":128},{"section":"08","group":null,"reported":"PJT Partners London summer analyst interview, Secondaries Advisory group.","answer":[{"type":"p","html":"Start from the fund's net asset value, which is the sum of the general partner's valuations of each portfolio company less fund-level debt. Then adjust for what a buyer of the LP stake takes on, including unfunded commitments the buyer must still pay in, management fees and carried interest that reduce what reaches LPs, and the timing of future distributions. A buyer in the secondaries market forecasts capital calls and distributions, discounts them at its target return, and expresses the price as a percentage of NAV."}],"why":[{"type":"p","html":"An LP stake is a stream of future cash calls and distributions, so it is valued like any other set of cash flows, with NAV as the starting reference point."}],"push":[{"q":"“Why do LP stakes often trade at a discount to NAV?”","a":[{"type":"p","html":"NAV marks can be stale or optimistic, the stake is illiquid, the buyer takes on unfunded commitments and fees, and sellers sometimes need liquidity quickly."}]},{"q":"“What is a GP-led continuation vehicle?”","a":[{"type":"p","html":"A deal where the GP moves one or more assets from an old fund into a new vehicle, giving existing LPs the choice to cash out or roll over while new investors fund the purchase."}]}],"q_text":"How would you value a private equity fund?","n":129},{"section":"08","group":null,"reported":"PJT Partners London summer analyst first round (October 2025). The 45-minute technical interview covered debt in deals and why companies become distressed.","answer":[{"type":"p","html":"Debt is usually the cheapest source of funding, because lenders rank ahead of shareholders and interest is tax deductible. Using it avoids issuing shares and diluting existing owners, and in an LBO it lets the sponsor put in a smaller equity cheque, which raises returns. The risks are that interest and repayments become fixed obligations whatever happens to trading. If earnings fall or rates rise on floating-rate debt, the company can breach covenants or fail to refinance at maturity, which is how many companies end up distressed."}],"why":[{"type":"p","html":"Leverage magnifies outcomes in both directions. The same structure that boosts equity returns when the business performs also accelerates losses when it does not."}],"push":[{"q":"“How would a lender decide how much to lend?”","a":[{"type":"p","html":"By looking at leverage, measured as debt to EBITDA, interest cover, the stability of cash flows, the value of any security, and comparable deals in the sector."}]},{"q":"“What is a covenant?”","a":[{"type":"p","html":"A condition in a loan, such as a maximum leverage ratio, that lets lenders step in if breached. Maintenance covenants are tested regularly, while incurrence covenants only apply when the company takes an action like raising more debt."}]}],"q_text":"Why would a buyer use debt to fund an acquisition, and what are the risks?","n":130},{"section":"08","group":null,"reported":"Perella Weinberg London summer analyst interview, reviewed October 2025.","answer":[{"type":"p","html":"A DDM projects the dividends a company will pay its shareholders, discounts them at the cost of equity, and adds a terminal value, which gives equity value with no bridge needed. A standard DCF projects unlevered free cash flow, discounts it at WACC and gives enterprise value. DDMs are mainly used for banks and insurers, where debt and interest are part of operations and free cash flow is hard to define. Dividends there are limited by regulatory capital requirements."}],"why":[{"type":"p","html":"For a bank, borrowing and lending is the business itself, so separating operating cash flow from financing makes little sense. Dividends are the cleanest measure of cash that can leave the business."}],"push":[{"q":"“What drives the dividends in a bank DDM?”","a":[{"type":"p","html":"Net income and the capital the bank must hold. The bank can only pay out what is left after meeting its target capital ratio, such as CET1."}]},{"q":"“When would a DDM be a poor choice for a normal company?”","a":[{"type":"p","html":"When dividend policy is arbitrary or the company pays little or no dividend, for example a growth company reinvesting its cash."}]}],"q_text":"How is a dividend discount model different from a DCF?","n":131},{"section":"08","group":null,"reported":"Perella Weinberg London summer analyst process, reviewed September 2025, which included maths questions.","answer":[{"type":"p","html":"About 77.5. Since 77² = 5,929 and 78² = 6,084, the answer sits between 77 and 78. 6,013 is 84 above 5,929, and the gap between the two squares is 155, so the answer is roughly 77 + 84 ÷ 155 ≈ 77.54."}],"why":[{"type":"p","html":"Bracketing between two known squares and interpolating gets you within a rounding error of the exact answer in a few seconds. Interviewers care more about a clear method than the third decimal place."}],"push":[{"q":"“Can you do it faster?”","a":[{"type":"p","html":"Use 77² = 5,929, then the gap of 84 divided by 2 × 77 = 154 gives about 0.55, so roughly 77.5."}]}],"q_text":"What is the square root of 6013?","n":132},{"section":"08","group":null,"reported":"Centerview Partners London summer analyst process, July 2026, which included brainteasers and maths questions.","answer":[{"type":"p","html":"5 minutes. Each machine makes one widget in 5 minutes, so 100 machines make 100 widgets in the same 5 minutes."}],"why":[{"type":"p","html":"The trap is scaling the time with the number of widgets. Work out the rate per machine first, and the rest follows."}],"push":[{"q":"“How long would 10 machines take to make 100 widgets?”","a":[{"type":"p","html":"Each machine makes one widget every 5 minutes, so 10 machines make 10 widgets every 5 minutes. 100 widgets take 50 minutes."}]}],"q_text":"If 5 machines take 5 minutes to make 5 widgets, how long would 100 machines take to make 100 widgets?","n":133},{"section":"08","group":null,"reported":"Centerview Partners London summer analyst process, October 2021.","answer":[{"type":"p","html":"I would first ask whether it is a production platform that sells oil or a drilling rig that is rented out, because the revenue model differs. For a production platform, estimate output, say 20,000 barrels a day, times an oil price of about $70, times 365 days, giving revenue of roughly $510m. Operating costs of around $15 a barrel come to roughly $110m, so EBITDA is about $400m before royalties and production taxes. For a rented drilling rig, EBITDA is the day rate times days in use minus daily operating costs."}],"why":[{"type":"p","html":"Estimation questions test structure. Clarify what is being asked, break revenue and costs into drivers you can estimate, state your assumptions out loud and sanity-check the answer."}],"push":[{"q":"“What would make your estimate most wrong?”","a":[{"type":"p","html":"The oil price and production volume, because revenue scales with both. A 10% change in either moves EBITDA by more than 10%, since operating costs are largely fixed."}]},{"q":"“Why might EBITDA overstate the value of the rig?”","a":[{"type":"p","html":"Oil assets need heavy capex and decommissioning spending, and reserves run down over time, so free cash flow is far below EBITDA."}]}],"q_text":"Estimate the EBITDA of an oil rig.","n":134},{"section":"08","group":null,"reported":"Evercore London summer analyst interview, September 2026, reported one valuation question and one market sizing question. The exact sizing question was not given, so this is a worked example of the type.","answer":[{"type":"p","html":"London has about 9 million people. Say 7 million are adults, and on an average day around a third of them buy a coffee, which gives roughly 2.3 million. Add commuters and tourists who live elsewhere, perhaps another 500,000, and some people buy more than one. A reasonable estimate is about 3 million coffees a day."}],"why":[{"type":"p","html":"Market sizing is about breaking a big number into steps you can defend. Start from population, segment it, apply a rate, adjust for edge cases and state the answer with a sense check."}],"push":[{"q":"“How would you sanity-check it?”","a":[{"type":"p","html":"From the supply side. If London has around 8,000 coffee outlets each selling a few hundred cups a day, that also lands in the low millions."}]},{"q":"“What would you use to size a market for a client?”","a":[{"type":"p","html":"Company filings, industry reports, government statistics and expert calls, cross-checked from both the demand side and the supply side."}]}],"q_text":"How many coffees are sold in London each day?","n":135},{"section":"08","group":null,"reported":"Evercore London internship interview with an associate, March 2026.","answer":[{"type":"p","html":"Start from the fund's mandate, meaning its sector focus, geography, deal size and ownership type, for example companies with £10m to £50m of EBITDA. Run a long list through databases such as Capital IQ, PitchBook or Mergermarket. Apply financial filters such
