<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tech Drill">
<title>Technical Drill</title>
<style>
  :root {
    --paper: #ffffff;
    --ink: #000000;
    --ink-2: rgba(0, 0, 0, 0.64);
    --ink-3: rgba(0, 0, 0, 0.42);
    --rule: rgba(0, 0, 0, 0.16);
    --fill: #f2f2f2;
    --right: #0b7a3e;
    --wrong: #c4221f;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Charter, Georgia, "Noto Serif", serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { background: var(--paper); color-scheme: light; -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15.5px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .tnum { font-variant-numeric: tabular-nums; }

  #app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; }
  .screen { padding: max(28px, env(safe-area-inset-top)) 22px max(36px, env(safe-area-inset-bottom)); }

  .eyebrow { font: 600 10.5px/1.3 var(--sans); letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink); }
  .muted { color: var(--ink-2); }
  h1 { margin: 10px 0 14px; font: 600 40px/1.04 var(--serif); letter-spacing: -0.015em; text-wrap: balance; }
  h2 { margin: 8px 0 14px; font: 600 32px/1.08 var(--serif); letter-spacing: -0.01em; text-wrap: balance; }
  .lede { margin: 0; max-width: 46ch; font-size: 14.5px; line-height: 1.55; color: var(--ink-2); }
  .link { font: 500 13px/1.3 var(--sans); text-decoration: underline; text-underline-offset: 3px; }
  .back { display: inline-block; margin: 0 0 26px; font: 500 13px/1 var(--sans); }
  .back::before { content: "\2190\00a0\00a0"; }

  /* home */
  .sets { margin: 34px 0 0; border-top: 2px solid var(--ink); }
  .set { display: block; width: 100%; padding: 22px 0 6px; }
  .set:active .set-name { text-decoration: underline; text-underline-offset: 5px; }
  .set-name { display: block; margin: 7px 0 10px; font: 600 27px/1.1 var(--serif); letter-spacing: -0.01em; }
  .set-meta { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; color: var(--ink-2); }
  .set-adv { display: block; margin-top: 10px; font-size: 12.5px; color: var(--ink-3); }
  .meter { display: block; height: 2px; margin: 16px 0 0; background: var(--rule); }
  .meter i { display: block; height: 100%; background: var(--ink); }
  .note { margin: 22px 0 0; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
  .foot { margin-top: 30px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12.5px; color: var(--ink-3); }

  /* setup */
  .rows { margin: 30px 0 0; border-top: 2px solid var(--ink); }
  .row { border-bottom: 1px solid var(--rule); }
  .row-main { display: grid; grid-template-columns: 22px 28px 1fr; column-gap: 12px; align-items: start; width: 100%; padding: 15px 0 14px; }
  .check { width: 18px; height: 18px; margin-top: 3px; border: 1.5px solid var(--ink); position: relative; }
  .row-main[aria-checked="true"] .check { background: var(--ink); }
  .row-main[aria-checked="true"] .check::after { content: ""; position: absolute; left: 4.5px; top: 1.5px; width: 5px; height: 9px; border: solid var(--paper); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .row-num { padding-top: 1px; font: 600 12px/1.9 var(--sans); letter-spacing: 0.06em; color: var(--ink-3); }
  .row-title { display: block; font: 600 17.5px/1.3 var(--serif); }
  .row-sub { display: block; margin-top: 3px; font-size: 12.5px; line-height: 1.4; color: var(--ink-2); }
  .about { margin: -4px 0 14px 74px; font: 500 12px/1.3 var(--sans); text-decoration: underline; text-underline-offset: 3px; color: var(--ink-2); }
  .about-text { margin: 0 0 16px 74px; font: italic 400 13.5px/1.55 var(--serif); color: var(--ink-2); max-width: 44ch; }
  .opts { margin: 28px 0 0; display: grid; gap: 18px; }
  .opt-label { display: block; margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--ink); }
  .seg button { padding: 12px 10px; text-align: center; font: 600 13.5px/1.2 var(--sans); }
  .seg button + button { border-left: 1.5px solid var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  .btn { display: block; width: 100%; min-height: 52px; padding: 14px 18px; border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink); font: 600 15px/1.2 var(--sans); text-align: center; letter-spacing: 0.01em; }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn:active { background: var(--ink); color: var(--paper); }
  .btn.solid:active { background: var(--paper); color: var(--ink); }
  .btn:disabled { opacity: 0.32; pointer-events: none; }
  .start { margin-top: 30px; }
  .hint { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-2); text-align: center; }

  /* drill */
  #s-drill { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding: 0; }
  .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: max(14px, env(safe-area-inset-top)) 22px 12px; }
  .bar button { font: 500 13px/1 var(--sans); padding: 8px 0; }
  .bar .r { text-align: right; }
  .bar .mid { padding: 8px 0; font: 600 12px/1 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; }
  .progress { height: 2px; background: var(--rule); flex: none; }
  .progress i { display: block; height: 100%; width: 0; background: var(--ink); }
  .thread { position: relative; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 26px 22px 28px; scroll-padding-top: 20px; }
  .where { margin: 0 0 12px; }
  .q-text { margin: 0; font: 600 24px/1.27 var(--serif); letter-spacing: -0.005em; text-wrap: pretty; }
  .reported { margin: 16px 0 0; padding: 10px 0 0; border-top: 1px solid var(--rule); font-size: 13px; line-height: 1.5; color: var(--ink-2); }
  .reported .eyebrow { margin-right: 8px; color: var(--ink); }
  .say { margin: 30px 0 0; font: italic 400 15px/1.5 var(--serif); color: var(--ink-3); }

  .box { position: relative; margin-top: 30px; padding: 20px 16px 16px; border: 1.5px solid var(--ink); }
  .box .tag { position: absolute; top: -10px; left: 14px; padding: 4px 8px 3px; background: var(--ink); color: var(--paper); font: 600 10px/1.2 var(--sans); letter-spacing: 0.15em; text-transform: uppercase; }
  .why { margin-top: 16px; padding: 16px 16px 16px; background: var(--fill); }
  .why .eyebrow { display: block; margin-bottom: 8px; }
  .box ul, .box ol { margin: 0 0 10px; padding-left: 22px; }
  .box li { margin: 0 0 6px; padding-left: 2px; }
  .box li::marker { color: var(--ink); }
  .box ol li::marker { font-variant-numeric: tabular-nums; font-weight: 600; }
  .box > :last-child { margin-bottom: 0; }
  .box p, .why p, .push-a p { margin: 0 0 10px; }
  .box p:last-child, .why p:last-child, .push-a p:last-child { margin-bottom: 0; }
  .box b { font-weight: 650; }
  sup { font-size: 0.72em; line-height: 0; }

  .push { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--ink); }
  .push .eyebrow { display: block; margin-bottom: 10px; }
  .push-q { margin: 0; font: italic 600 19px/1.35 var(--serif); }
  .push-a { margin-top: 14px; padding: 2px 0 2px 14px; border-left: 2px solid var(--ink); }

  /* checked answer */
  .mine { margin-top: 26px; }
  .mine-ta { display: block; width: 100%; min-height: 104px; resize: vertical; padding: 12px 14px; border: 1.5px solid var(--ink); border-radius: 0; background: var(--paper); color: var(--ink); font: 400 15.5px/1.55 var(--sans); -webkit-appearance: none; appearance: none; }
  .mine-ta::placeholder { color: var(--ink-3); }
  .mine-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .btn.sm { width: auto; flex: 1; min-height: 46px; padding: 10px 16px; font-size: 14px; }
  .btn.ghost { flex: 0 0 auto; }
  .mine-err { margin: 10px 0 0; font-size: 13px; line-height: 1.5; }
  .box.checked { margin-top: 26px; }
  .box.checked .tag { background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); padding: 3px 7px 2px; }
  .ck-yours { margin: 0 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); font: italic 400 14.5px/1.5 var(--serif); color: var(--ink-2); white-space: pre-wrap; }
  .ck-verdict { margin: 0 0 4px; font: 600 22px/1.2 var(--serif); }
  .ck-group { margin-top: 16px; }
  .ck-group .eyebrow { display: block; margin-bottom: 6px; }
  .ck-group ul { margin: 0; padding-left: 18px; }
  .ck-group li { margin: 0 0 5px; }
  .ck-group.right, .ck-group.right .eyebrow, .ck-verdict.right { color: var(--right); }
  .ck-group.wrong, .ck-group.wrong .eyebrow, .ck-verdict.wrong { color: var(--wrong); }
  .ck-group.right li::marker, .ck-group.wrong li::marker { color: currentColor; }
  .ck-better { margin: 0; padding: 2px 0 2px 14px; border-left: 2px solid var(--ink); font: 400 15px/1.6 var(--serif); }
  .ck-again { display: block; width: 100%; margin-top: 12px; }
  .tbl { margin: 12px 0 14px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
  thead th { border-bottom: 1.5px solid var(--ink); font: 600 11px/1.3 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; }
  tbody th { font-weight: 600; }

  .actions { flex: none; padding: 12px 22px max(14px, env(safe-area-inset-bottom)); border-top: 1px solid var(--ink); background: var(--paper); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* done */
  .score { margin: 26px 0 6px; font: 600 88px/0.95 var(--serif); letter-spacing: -0.03em; }
  .score small { font-size: 34px; font-weight: 400; color: var(--ink-3); letter-spacing: 0; }
  .tally { display: flex; gap: 22px; margin: 6px 0 0; font-size: 13.5px; color: var(--ink-2); }
  .list { margin: 30px 0 0; padding: 0; list-style: none; border-top: 2px solid var(--ink); }
  .list li { display: grid; grid-template-columns: 44px 1fr; padding: 13px 0; border-bottom: 1px solid var(--rule); font: 500 15.5px/1.4 var(--serif); }
  .list li span { font: 600 12px/1.9 var(--sans); color: var(--ink-3); letter-spacing: 0.04em; }
  .stack { display: grid; gap: 10px; margin-top: 28px; }

  @media (prefers-reduced-motion: no-preference) { .thread { scroll-behavior: smooth; } }
  @media (min-width: 600px) { h1 { font-size: 46px; } .q-text { font-size: 26px; } }
</style>
</head>
<body>
<div id="app">

  <section class="screen" id="s-home">
    <div class="eyebrow">Moelis London</div>
    <h1>First-Round Technicals</h1>
    <p class="lede" id="homeLede"></p>
    <div class="sets" id="sets"></div>
    <p class="note" id="homeNote"></p>
    <div class="foot"><span>Progress is saved on this device.</span><button class="link" id="reset">Reset progress</button></div>
  </section>

  <section class="screen" id="s-setup" hidden>
    <button class="back" id="setupBack">All sections</button>
    <div class="eyebrow" id="setupEyebrow"></div>
    <h2 id="setupTitle"></h2>
    <p class="lede" id="setupIntro"></p>
    <div class="rows" id="rows"></div>
    <div class="opts">
      <div><span class="eyebrow opt-label">Order</span>
        <div class="seg" id="segOrder"><button data-v="order" aria-pressed="false">In order</button><button data-v="shuffle" aria-pressed="true">Shuffled</button></div></div>
      <div><span class="eyebrow opt-label">Questions</span>
        <div class="seg" id="segShow"><button data-v="all" aria-pressed="true">All</button><button data-v="todo" aria-pressed="false">Not yet got</button></div></div>
    </div>
    <button class="btn solid start" id="start">Start</button>
    <p class="hint" id="startHint"></p>
  </section>

  <section class="screen" id="s-drill" hidden>
    <div class="bar"><button id="quit">Close</button><div class="mid tnum" id="pos"></div><div class="r"><button id="skip">Skip</button></div></div>
    <div class="progress"><i id="fill"></i></div>
    <div class="thread" id="thread"></div>
    <div class="actions">
      <button class="btn solid" id="primary">Show answer</button>
      <div class="two" id="grades" hidden><button class="btn" id="miss">Missed it</button><button class="btn solid" id="got">Got it</button></div>
    </div>
  </section>

  <section class="screen" id="s-done" hidden>
    <div class="eyebrow" id="doneEyebrow"></div>
    <div class="score tnum" id="score"></div>
    <div class="tally tnum" id="tally"></div>
    <ul class="list" id="missList"></ul>
    <div class="stack"><button class="btn solid" id="again" hidden>Drill the ones I missed</button><button class="btn" id="finish">Back to the section</button></div>
  </section>

</div>
<script>window.DRILL_DATA = /*__DATA__*/null;</script>
<script>
(function () {
  'use strict';
  var D = window.DRILL_DATA;
  var $ = function (id) { return document.getElementById(id); };
  var nb = function (s) { return s.replace(/([\u2212+\u2013])(?=[\u00a3$\d])/g, '$1\u2060'); };   // keep a sign with its number across line breaks
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  var QS = D.questions, BY = {}, SEC = {};
  QS.forEach(function (q) { BY[q.n] = q; });
  D.sections.forEach(function (s) { SEC[s.id] = s; });

  var SETS = [
    { id: 'bible',  name: 'The 400 Bible', eyebrow: 'Part 1 · ' + D.parts.part1.title, blurb: 'Accounting through to leveraged buyouts', intro: D.parts.part1.intro, secs: ['01', '02', '03', '04', '05', '06'] },
    { id: 'extras', name: 'Extras',        eyebrow: 'Part 2 · ' + D.parts.part2.title, blurb: 'Reported Moelis and boutique questions, extras, restructuring', intro: D.parts.part2.intro, secs: ['07', '08', '09', '10', '11', '12'] },
    { id: 'merger', name: 'Merger Models', eyebrow: 'Section 05 · also in the Bible', blurb: 'Merger model concepts and drills', intro: SEC['05'].intro, secs: ['05'] }
  ];
  SETS.forEach(function (s) {
    s.qs = QS.filter(function (q) { return !q.adv && s.secs.indexOf(q.section) >= 0; });      // the PDF's questions
    s.advN = QS.filter(function (q) { return q.adv && s.secs.indexOf(q.section) >= 0; }).length;
    var ordered = [];                                  // each section's own questions, then its advanced ones
    s.secs.forEach(function (id) {
      QS.forEach(function (q) { if (q.section === id && !q.adv) ordered.push(q); });
      QS.forEach(function (q) { if (q.section === id && q.adv) ordered.push(q); });
    });
    var rows = [];
    ordered.forEach(function (q) {
      var last = rows[rows.length - 1];
      if (!last || last.sec !== q.section || last.group !== q.group || !!last.adv !== !!q.adv) rows.push({ key: rows.length, sec: q.section, group: q.group, adv: !!q.adv, qs: [], first: !last || last.sec !== q.section || !!last.adv !== !!q.adv });
      rows[rows.length - 1].qs.push(q);
    });
    s.rows = rows;
  });

  /* ---------- answer checking (claude.ai viewer only; a plain file copy has no window.claude) ---------- */
  var sample = null, running = null;
  var ERR = {
    rate_limited: 'Too many checks in a row. Wait a minute and try again.',
    session_expired: 'Your Claude session expired. Reload the page and sign in again.',
    upstream_error: 'That check did not get through. Try again.',
    invalid_json: 'The feedback came back garbled. Try again.',
    empty_completion: 'No feedback came back. Try rewording your answer.',
    refused: 'That answer could not be checked. Try rewording it.',
    prompt_too_large: 'That answer is too long to check. Tighten it up.'
  };
  var HIDE = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
  function plainText(bs) {
    return bs.map(function (b) {
      if (b.type === 'table') return b.rows.map(function (r) { return r.join(' | '); }).join('\n');
      var d = document.createElement('div'); d.innerHTML = b.html;
      return (b.type === 'li' ? (b.kind === 'num' ? b.n + '. ' : '- ') : '') + d.textContent;
    }).join('\n');
  }
  function markPrompt(ref, mine) {
    return [
      'You are an investment banking interviewer marking a candidate’s answer to a first-round technical question at a London boutique bank. Assume the UK, IFRS and a 25% tax rate unless the question says otherwise.',
      '',
      'How to mark:',
      '- Mark substance, never wording. Different phrasing, order, shorthand or a spoken style is fine. A correct route that the model answer does not use is fully correct.',
      '- Only call something wrong if it is actually wrong: a wrong number, sign, direction, statement or concept. Missing a point is “missed”, not “wrong”. If a figure is wrong, say what it should be.',
      '- Be honest and calibrated. Do not flatter. If the answer is empty, off topic or only guesses, say so.',
      '- Treat the model answer (and any explanation below) as the source of truth for what a strong answer contains. It may use US wording or dollars: judge the substance, not the jurisdiction.',
      ref.context ? '' : null,
      ref.context ? 'This is a follow-up the interviewer asked after this question: ' + ref.context : null,
      '',
      'QUESTION:', ref.question, '',
      'MODEL ANSWER:', ref.answer, '',
      ref.why ? 'WHY THE MODEL ANSWER IS RIGHT:\n' + ref.why + '\n' : null,
      'CANDIDATE’S ANSWER:', mine, '',
      'Reply with only a JSON object, no other text:',
      '{"verdict":"correct" | "partly" | "not_yet",',
      ' "right":["short phrases: what they got right"],',
      ' "missed":["points from the model answer they left out"],',
      ' "wrong":["anything actually incorrect, with the correct version; empty array if none"],',
      ' "better":"their answer rewritten so it keeps what was right and fixes the rest: first person, spoken British English, no more than 90 words"}'
    ].filter(function (x) { return x !== null; }).join('\n');
  }
  function list(title, items, cls) {
    items = (items || []).filter(function (x) { return typeof x === 'string' && x.trim(); });
    return items.length ? '<div class="ck-group' + (cls ? ' ' + cls : '') + '"><span class="eyebrow">' + title + '</span><ul>' + items.map(function (x) { return '<li>' + esc(nb(x)) + '</li>'; }).join('') + '</ul></div>' : '';
  }
  function mountMine(slot) {
    if (!sample || !slot || slot.firstChild) return;
    var ref = slot._ref, draft = '';
    function form(text) {
      slot.innerHTML = '<div class="mine"><textarea class="mine-ta" rows="4" placeholder="Type your answer here if you want it checked (optional)" aria-label="Your answer"></textarea>' +
        '<div class="mine-row"><button class="btn sm" data-a="check">Check my answer</button></div><p class="mine-err" hidden></p></div>';
      var ta = slot.querySelector('textarea'); ta.value = text || '';
      slot.querySelector('[data-a=check]').addEventListener('click', function () { check(ta.value.trim()); });
    }
    function check(text) {
      var ta = slot.querySelector('textarea'), btn = slot.querySelector('[data-a=check]'), er = slot.querySelector('.mine-err');
      if (!text) { ta.focus(); return; }
      draft = text; er.hidden = true; btn.disabled = true; btn.textContent = 'Checking…';
      var ctl = new AbortController(); running = ctl;
      var stop = document.createElement('button'); stop.className = 'btn sm ghost'; stop.textContent = 'Stop'; btn.parentNode.appendChild(stop);
      stop.addEventListener('click', function () { ctl.abort(); });
      sample.json(markPrompt(ref, text), { signal: ctl.signal }).then(function (r) {
        running = null; result(text, r || {});
      }, function (e) {
        running = null; stop.remove(); btn.disabled = false; btn.textContent = 'Check my answer';
        var code = e && e.code;
        if (code === 'cancelled') return;
        if (HIDE.indexOf(code) >= 0) { sample = null; slot.innerHTML = ''; return; }
        er.textContent = ERR[code] || ERR.upstream_error; er.hidden = false;
      });
    }
    function result(text, r) {
      var v = { correct: 'Correct.', partly: 'Partly right.', not_yet: 'Not yet.' }[r.verdict] || 'Checked.';
      slot.innerHTML = '<div class="box checked"><span class="tag">Your answer, checked</span>' +
        '<p class="ck-yours">' + esc(text) + '</p><p class="ck-verdict ' + ({ correct: 'right', not_yet: 'wrong' }[r.verdict] || '') + '">' + v + '</p>' +
        list('What you got right', r.right, 'right') + list('What you missed', r.missed) + list('What was wrong', r.wrong, 'wrong') +
        (typeof r.better === 'string' && r.better.trim() ? '<div class="ck-group"><span class="eyebrow">Say it like this</span><p class="ck-better">' + esc(nb(r.better)) + '</p></div>' : '') +
        '</div><button class="btn sm ck-again" data-a="again">Edit and check again</button>';
      slot.querySelector('[data-a=again]').addEventListener('click', function () { form(draft); slot.querySelector('textarea').focus(); });
      var box = slot.querySelector('.box'); if (box) reveal(box);
    }
    form('');
  }
  function mountAll() {
    Array.prototype.forEach.call(document.querySelectorAll('.mine-slot'), mountMine);
    var s = document.querySelector('.say'); if (sample && s) s.remove();
  }
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('sample').then(function (s) { if (s) { sample = s; mountAll(); } }, function () {});
    }
  } catch (e) {}

  var K_P = 'moelis_progress_v1', K_S = 'moelis_seen_v1';
  function load(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var PROG = load(K_P), SEEN = load(K_S);       // PROG: n -> 'g' (got it) | 'm' (missed it)

  function show(id) {
    ['home', 'setup', 'drill', 'done'].forEach(function (n) { $('s-' + n).hidden = n !== id; });
    window.scrollTo(0, 0);
  }
  function range(qs) { return qs[0].label + '–' + qs[qs.length - 1].label; }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  function gotCount(qs) { return qs.filter(function (q) { return PROG[q.n] === 'g'; }).length; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ---------- home ---------- */
  function renderHome() {
    $('homeLede').textContent = QS.filter(function (q) { return !q.adv; }).length + ' questions with interview-ready answers, the reasoning behind each one, and the follow-ups an interviewer is likely to push with.';
    $('homeNote').textContent = 'All calculations assume a 25% tax rate unless stated otherwise.';
    var box = $('sets'); box.innerHTML = '';
    SETS.forEach(function (s) {
      var got = gotCount(s.qs), pct = Math.round(got / s.qs.length * 100);
      var b = document.createElement('button');
      b.className = 'set';
      b.innerHTML = '<span class="eyebrow">' + esc(s.eyebrow) + '</span><span class="set-name">' + esc(s.name) + '</span>' +
        '<span class="set-meta"><span>' + esc(range(s.qs)) + ' · ' + plural(s.qs.length, 'question') + '</span><span class="tnum">' + got + ' / ' + s.qs.length + ' got</span></span>' +
        '<span class="meter"><i style="width:' + pct + '%"></i></span>' +
        (s.advN ? '<span class="set-adv">+ ' + plural(s.advN, 'advanced question') + ' you can tick on</span>' : '');
      b.addEventListener('click', function () { openSet(s); });
      box.appendChild(b);
    });
  }
  var armed = null;
  $('reset').addEventListener('click', function () {
    var b = $('reset');
    if (!armed) { b.textContent = 'Tap again to confirm'; armed = setTimeout(function () { armed = null; b.textContent = 'Reset progress'; }, 4000); return; }
    clearTimeout(armed); armed = null; PROG = {}; SEEN = {}; save(K_P, PROG); save(K_S, SEEN); b.textContent = 'Reset progress'; renderHome();
  });

  /* ---------- setup ---------- */
  var cur = { set: null, sel: {}, order: 'shuffle', show: 'all' };
  function openSet(s) {
    cur.set = s; cur.sel = {}; s.rows.forEach(function (r) { cur.sel[r.key] = !r.adv; });      // advanced rows are opt-in
    renderSetup(); show('setup');
  }
  function pool() {
    var out = [];
    cur.set.rows.forEach(function (r) { if (cur.sel[r.key]) out = out.concat(r.qs); });
    if (cur.show === 'todo') out = out.filter(function (q) { return PROG[q.n] !== 'g'; });
    return out;
  }
  function renderSetup() {
    var s = cur.set;
    $('setupEyebrow').textContent = s.eyebrow; $('setupTitle').textContent = s.name; $('setupIntro').textContent = s.intro;
    var box = $('rows'); box.innerHTML = '';
    s.rows.forEach(function (r) {
      var sec = SEC[r.sec], title = r.adv ? sec.title + ', advanced' : (r.group || sec.title), got = gotCount(r.qs), intro = r.adv ? sec.adv_intro : sec.intro;
      var row = document.createElement('div'); row.className = 'row';
      var m = document.createElement('button'); m.className = 'row-main'; m.setAttribute('role', 'checkbox'); m.setAttribute('aria-checked', cur.sel[r.key] ? 'true' : 'false');
      m.innerHTML = '<span class="check"></span><span class="row-num">' + esc(r.sec) + '</span><span><span class="row-title">' + esc(title) + '</span><span class="row-sub tnum">' + esc(range(r.qs)) + ' · ' + plural(r.qs.length, 'question') + ' · ' + got + ' got</span></span>';
      m.addEventListener('click', function () { cur.sel[r.key] = !cur.sel[r.key]; renderSetup(); });
      row.appendChild(m);
      if (r.first && intro) {
        var ab = document.createElement('button'); ab.className = 'about'; ab.textContent = 'About this section'; ab.setAttribute('aria-expanded', 'false');
        var tx = document.createElement('p'); tx.className = 'about-text'; tx.textContent = intro; tx.hidden = true;
        ab.addEventListener('click', function () { tx.hidden = !tx.hidden; ab.setAttribute('aria-expanded', String(!tx.hidden)); ab.textContent = tx.hidden ? 'About this section' : 'Hide'; });
        row.appendChild(ab); row.appendChild(tx);
      }
      box.appendChild(row);
    });
    ['segOrder', 'segShow'].forEach(function (id) {
      var key = id === 'segOrder' ? 'order' : 'show';
      Array.prototype.forEach.call($(id).children, function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === cur[key])); });
    });
    var n = pool().length;
    $('start').disabled = n === 0;
    $('start').textContent = n ? 'Start · ' + plural(n, 'question') : 'Nothing to drill';
    $('startHint').textContent = n ? '' : (cur.show === 'todo' ? 'You have got everything selected. Switch to All to go again.' : 'Select at least one section.');
  }
  ['segOrder', 'segShow'].forEach(function (id) {
    Array.prototype.forEach.call($(id).children, function (b) {
      b.addEventListener('click', function () { cur[id === 'segOrder' ? 'order' : 'show'] = b.getAttribute('data-v'); renderSetup(); });
    });
  });
  $('setupBack').addEventListener('click', function () { renderHome(); show('home'); });
  $('start').addEventListener('click', function () {
    var qs = pool(); if (!qs.length) return;
    var ids;
    if (cur.order === 'shuffle') {         // a fresh shuffle each time, with anything you have never seen come first
      var fresh = shuffle(qs.filter(function (q) { return !SEEN[q.n]; })), seen = shuffle(qs.filter(function (q) { return SEEN[q.n]; }));
      ids = fresh.concat(seen).map(function (q) { return q.n; });
    } else ids = qs.map(function (q) { return q.n; });
    startRun(ids);
  });

  /* ---------- drill ---------- */
  var run = null;
  function table(rows) {
    var h = '<div class="tbl"><table><thead><tr>' + rows[0].map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.slice(1).forEach(function (r) { h += '<tr><th scope="row">' + esc(r[0]) + '</th>' + r.slice(1).map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; });
    return h + '</tbody></table></div>';
  }
  function blocks(bs) {
    var h = '', i = 0;
    while (i < bs.length) {
      var b = bs[i];
      if (b.type === 'li') {                                   // a run of list items becomes one list
        var tag = b.kind === 'num' ? 'ol' : 'ul', items = '';
        while (i < bs.length && bs[i].type === 'li' && bs[i].kind === b.kind) { items += '<li' + (tag === 'ol' ? ' value="' + bs[i].n + '"' : '') + '>' + nb(bs[i].html) + '</li>'; i++; }
        h += '<' + tag + '>' + items + '</' + tag + '>'; continue;
      }
      h += b.type === 'p' ? '<p>' + nb(b.html) + '</p>' : table(b.rows); i++;
    }
    return h;
  }
  function add(html) {
    var d = document.createElement('div'); d.innerHTML = html; var el = d.firstElementChild;
    $('thread').appendChild(el); return el;
  }
  function reveal(el) {
    var t = $('thread'), top = Math.max(0, el.offsetTop - 18);
    if (t.scrollTo) t.scrollTo({ top: top }); else t.scrollTop = top;
  }
  function startRun(ids) {
    run = { ids: ids, i: 0, res: {} };
    show('drill'); showQuestion();
  }
  function showQuestion() {
    var q = BY[run.ids[run.i]], sec = SEC[q.section];
    run.q = q; run.stage = 'q'; run.p = -1;
    SEEN[q.n] = 1; save(K_S, SEEN);
    $('pos').textContent = (run.i + 1) + ' / ' + run.ids.length;
    $('fill').style.width = (run.i / run.ids.length * 100) + '%';
    if (running) { running.abort(); running = null; }
    var t = $('thread'); t.innerHTML = ''; t.scrollTop = 0;
    var where = sec.id + ' · ' + sec.title + (q.adv ? ' · Advanced' : q.group ? ' · ' + q.group : '');
    add('<div class="blk"><div class="eyebrow where">' + q.label + ' · ' + esc(where) + '</div><h3 class="q-text" style="margin:0">' + esc(nb(q.q_text)) + '</h3>' +
      (q.reported ? '<p class="reported"><span class="eyebrow">Reported</span>' + esc(q.reported) + '</p>' : '') +
      (sample ? '' : '<p class="say">Say your answer out loud, then check it.</p>') + '<div class="mine-slot"></div></div>');
    var slot = t.querySelector('.mine-slot');
    slot._ref = { question: q.q_text, answer: plainText(q.answer), why: plainText(q.why) };
    mountMine(slot);
    setActions();
  }
  function morePush() { return run.p + 1 < run.q.push.length; }
  function setActions() {
    var label = null;
    if (run.stage === 'q' || run.stage === 'pq') label = 'Show answer';
    else if (morePush()) label = 'They push';
    $('primary').hidden = !label; if (label) $('primary').textContent = label;
    $('grades').hidden = !!label;
  }
  $('primary').addEventListener('click', function () {
    var q = run.q, el;
    if (run.stage === 'q') {
      var say = document.querySelector('.say'); if (say) say.remove();
      el = add('<div class="blk"><div class="box"><span class="tag">Answer</span>' + blocks(q.answer) + '</div>' +
        (q.why.length ? '<div class="why"><span class="eyebrow">Why it’s right</span>' + blocks(q.why) + '</div>' : '') + '</div>');
      run.stage = 'a';
    } else if (run.stage === 'a' || run.stage === 'pa') {
      run.p++;
      var pu = q.push[run.p];
      el = add('<div class="push blk"><span class="eyebrow">If they push · ' + (run.p + 1) + ' of ' + q.push.length + '</span><p class="push-q">' + esc(nb(pu.q)) + '</p><div class="mine-slot"></div></div>');
      var ps = el.querySelector('.mine-slot');
      ps._ref = { question: pu.q, answer: plainText(pu.a), context: q.q_text };
      mountMine(ps);
      run.stage = 'pq';
    } else if (run.stage === 'pq') {
      var host = $('thread').lastElementChild;
      var a = document.createElement('div'); a.className = 'push-a'; a.innerHTML = blocks(q.push[run.p].a);
      host.appendChild(a); el = a; run.stage = 'pa';
    }
    setActions(); if (el) reveal(el);
  });
  function next() {
    run.i++;
    if (run.i >= run.ids.length) return finish();
    showQuestion();
  }
  function grade(g) {
    var q = run.q; run.res[q.n] = g; PROG[q.n] = g === 'got' ? 'g' : 'm'; save(K_P, PROG); next();
  }
  $('got').addEventListener('click', function () { grade('got'); });
  $('miss').addEventListener('click', function () { grade('miss'); });
  $('skip').addEventListener('click', function () { run.res[run.q.n] = run.res[run.q.n] || 'skip'; next(); });
  $('quit').addEventListener('click', function () { renderSetup(); show('setup'); });

  /* ---------- done ---------- */
  function finish() {
    var ids = run.ids, got = 0, miss = [], skip = 0;
    ids.forEach(function (n) { var r = run.res[n]; if (r === 'got') got++; else if (r === 'miss') miss.push(n); else skip++; });
    $('doneEyebrow').textContent = cur.set.name + ' · done';
    $('score').innerHTML = got + '<small> / ' + ids.length + '</small>';
    $('tally').innerHTML = '<span>' + got + ' got</span><span>' + miss.length + ' missed</span>' + (skip ? '<span>' + skip + ' skipped</span>' : '');
    $('missList').innerHTML = miss.map(function (n) { return '<li><span>' + BY[n].label + '</span>' + esc(BY[n].q_text) + '</li>'; }).join('');
    $('missList').hidden = !miss.length;
    run.miss = miss; $('again').hidden = !miss.length;
    show('done');
  }
  $('again').addEventListener('click', function () { startRun(shuffle(run.miss.slice())); });
  $('finish').addEventListener('click', function () { renderSetup(); show('setup'); });

  renderHome();
})();
</script>
</body>
</html>
